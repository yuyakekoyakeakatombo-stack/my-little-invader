      if(el.classList.contains('down')||el.classList.contains('right')) diaryPage = Math.min(diaryLog.length-1, diaryPage+1);
    });
  });

  // ════════════════════════════════════════
  // おもいで（エンディング後の振り返り）
  //  何が効いたかを言葉で説明はしない。毎回まったく同じ項目を同じ順で出し、
  //  周回どうしを見比べれば分かる、という作りにしてある。
  //  ただし最後の1ページだけは答え合わせとして、隠していた値を目盛りで開く。
  // ════════════════════════════════════════
  const ctxR = initCanvas('lcd-r');
  const MEM_PAGES = 4;
  const MEM_CHAR_BOT = 28;   // 1ページ目に置く姿の、足元の高さ（下辺をここにそろえる）
  const MEM_END_Y = 50, MEM_END_LH = 5;   // 別れかたの1行目の高さと行送り（2行になるものがある）
  let memPage = 0, memFrom = 'menu', fR = 0;
  // 体型の呼び名。形態IDの末尾で決まる（1=ふっくら / 2=すらり / 3=とげとげ）
  function formLabel(){
    const n = (pet.form || '').slice(-1);
    return n === '1' ? T('plump') : n === '2' ? T('sleek') : n === '3' ? T('prickly') : '';
  }
  // どんな別れだったか
  function endLabel(){
    if(pet.dead === 'starve') return T('endStarve');
    if(pet.dead === 'sick')   return T('endSick');
    if(pet.goneBy === 'depart') return T('endDepart');
    if(pet.goneBy === 'invade') return T('endInvade');
    if(pet.goneBy === 'return') return T('endReturn');
    return '';
  }
  function memOpen(from){ memFrom = from || 'menu'; memPage = 0; fR = 0; showView('memory'); }
  function memClose(){ showView(memFrom); }

  //  ミニゲームの記録。ゲーム名は選択画面と同じ英語表記なので、
  //   言語に関わらずピクセル字体で組む（memRow は言語で字体が変わる）
  function memBestRow(label, val, y){
    ctxR.font = '6px "Press Start 2P"'; ctxR.fillStyle = ON;
    ctxR.textAlign = 'left';  ctxR.fillText(label, 3*S, y*S);
    ctxR.textAlign = 'right'; ctxR.fillText(val, (W-3)*S, y*S);
    ctxR.textAlign = 'left';                           // 幅を測る前に必ず戻す
    const lw = ctxR.measureText(label).width / S, vw = ctxR.measureText(val).width / S;
    //  点の高さは字の背の低さに合わせる（memRow の y+2 は9pxの日本語字体に合わせた値）
    for(let x = Math.floor(3 + lw) + 2; x < (W-3) - vw - 1.5; x += STAT_LEADER) dot(ctxR, x, y + 1, DIM);
  }
  //  項目名を左、値を右に置き、あいだを薄い点でつなぐ（STATUS と同じ組み方）
  function memRow(label, val, y){
    ctxR.font = uiFont(6); ctxR.fillStyle = ON;
    ctxR.textAlign = 'left';  ctxR.fillText(label, 3*S, y*S);
    ctxR.textAlign = 'right'; ctxR.fillText(val, (W-3)*S, y*S);
    ctxR.textAlign = 'left';                           // 幅を測る前に必ず戻す（右寄せのままだと狂う）
    const lw = ctxR.measureText(label).width / S, vw = ctxR.measureText(val).width / S;
    for(let x = Math.floor(3 + lw) + 2; x < (W-3) - vw - 1.5; x += STAT_LEADER) dot(ctxR, x, y + 2, DIM);
  }
  //  10本の目盛り。STATUS と同じ見た目にして、同じものを見ていると分かるようにする
  function memGauge(label, v01, y){
    ctxR.font = uiFont(6); ctxR.fillStyle = ON; ctxR.textAlign = 'left';
    ctxR.fillText(label, 3*S, y*S);
    const lit = Math.round(Math.max(0, Math.min(1, v01)) * GAUGE_MAX * 2);
    for(let k=0;k<GAUGE_MAX*2;k++){
      const c = (k < lit) ? ON : DIM;
      for(let dx=0;dx<GAUGE_W;dx++) for(let dy=0;dy<GAUGE_H;dy++)
        dot(ctxR, GAUGE_X + k*(GAUGE_W+GAUGE_GAP) + dx, y + dy, c);
    }
  }
  function tickMemory(){
    if(scene !== 'memory') return;
    // 読みものの画面（メニュー・にっき）と同じく、時刻では色を変えない。
    //  空を映す画面ではないので、夜に開くと暗くなるのは筋が通らない。
    //  行を組む memRow / memGauge / memBestRow はもともと固定色で描いていて、
    //  地の色だけが夜に沈み、字とのつり合いも崩れていた
    const BG = OFF, DM = DIM, NK = ON;
    ctxR.fillStyle = BG; ctxR.fillRect(0,0,W*S,H*S);
    ctxR.textBaseline = 'top';
    // 見出し
    ctxR.font = uiFont(7); ctxR.fillStyle = NK; ctxR.textAlign = 'center';
    ctxR.fillText(T('memory'), (W*S)/2, 3*S);
    for(let x=6;x<W-6;x++) dot(ctxR, x, 13, DM);

    if(memPage === 0){
      // 1ページ目：だれと、どれだけ。いちばん上に、最後の姿を絵で置く
      ctxR.textAlign = 'center';
      //  背の高さは段階でちがう（こども6ドット〜さいしゅう13ドット）ので、
      //  下辺をそろえて置く。上でそろえると、姿ごとに下の文字との間隔が変わる
      const body = (()=>{ const sp = charSprites(); return sp.rest || sp.a; })();
      if(body) stamp(ctxR, body, Math.round((W - body[0].length)/2), MEM_CHAR_BOT - body.length, NK);
      ctxR.font = nameFont(9, pet.name || '????'); ctxR.fillStyle = NK;
      ctxR.fillText(pet.name || '????', (W*S)/2, 30*S);
      //  名前のすぐ下は どんな子だったか。日数はそのあと
      const f = formLabel();
      if(f){
        ctxR.font = uiFont(7); ctxR.fillStyle = NK;
        ctxR.fillText(typeLabel() + (lang==='ja' ? '・' : ' ') + f, (W*S)/2, 37*S);
      } else {
        ctxR.font = uiFont(6); ctxR.fillStyle = NK;
        ctxR.fillText(stageLabel(), (W*S)/2, 38*S);
      }
      //  数を先に読ませる（にほんご「25 にち いっしょにいた」／英語「25 DAYS TOGETHER」）
      ctxR.font = uiFont(6); ctxR.fillStyle = NK;
      ctxR.fillText(petDay() + ' ' + T('mdays'), (W*S)/2, 44*S);
      const e = endLabel();
      if(e){
        ctxR.font = uiFont(6); ctxR.fillStyle = NK;
        //  お迎え・侵攻は2行。1行目の高さをそろえ、下へ伸ばす
        e.split('\n').forEach((line, i) => ctxR.fillText(line, (W*S)/2, (MEM_END_Y + i*MEM_END_LH)*S));
      }

    } else if(memPage === 1){
      // 2ページ目：してあげたこと。数だけを出し、多い少ないの評価はしない
      ctxR.font = uiFont(6); ctxR.fillStyle = NK; ctxR.textAlign = 'center';
      ctxR.fillText(T('mgave'), (W*S)/2, 17*S);
      const t = pet.total || {};
      const p = pet.plays || {};
      const rows = [
        [T('mfeed'),   (t.feed||0)],
        [T('msnack'),  (t.snack||0)],
        [T('mclean'),  (t.clean||0)],
        [T('mpraise'), (pet.praiseCount||0)],
        [T('mplay'),   ((p.sw||0)+(p.ss||0)+(p.ab||0))],
        [T('mmed'),    (t.med||0)],
      ];
      rows.forEach((r,i)=> memRow(r[0], String(r[1]), 23 + i*6));   // 最終行(53)がページ数(57)に掛からない位置

    } else if(memPage === 2){
      // 3ページ目：ミニゲームの記録。2ページ目の「あそんだ」回数の隣に置きたいが、
      //  あちらは6行で埋まっているので、continue して独立した1ページにする
      ctxR.font = uiFont(6); ctxR.fillStyle = NK; ctxR.textAlign = 'center';
      ctxR.fillText(T('mbest'), (W*S)/2, 17*S);
      PLAY_ITEMS.forEach((label,i)=> memBestRow(label, bestText(i), 27 + i*8));

    } else {
      // 4ページ目：どう育ったか。ここだけは隠していた値を開く
      ctxR.font = uiFont(6); ctxR.fillStyle = NK; ctxR.textAlign = 'center';
      ctxR.fillText(T('mlast'), (W*S)/2, 17*S);
      memGauge(T('friend'), (pet.B||0)/100, 27);
      memGauge(T('mcare'),  (pet.C||0)/100, 35);
      memGauge(T('mdisc'),  (pet.D||0)/100, 43);
      const t = pTrait();
      memRow(T('mtemper'), t >= 0.35 ? T('tlively') : t <= -0.35 ? T('tcalm') : T('tmid'), 51);
    }

    // ページ位置。日記と同じ見た目にそろえる
    ctxR.font = uiFont(6); ctxR.fillStyle = NK; ctxR.textAlign = 'center';
    if(memPage > 0)             pageMark(ctxR, 'left',  4*S, 7*S + 4, NK);
    if(memPage < MEM_PAGES-1)   pageMark(ctxR, 'right', (W-4)*S, 7*S + 4, NK);
    ctxR.fillText((memPage+1) + ' / ' + MEM_PAGES, (W*S)/2, 59*S);
    fR++;
  }
  setInterval(tickMemory, 100);
  onPress(document.getElementById('ra'),()=>{ playClick(); btnAnim(document.getElementById('ra'));
    if(memPage < MEM_PAGES-1) memPage++; else memClose(); });
  onPress(document.getElementById('rb'),()=>{ playClick(); btnAnim(document.getElementById('rb')); memClose(); });
  onPress(document.getElementById('rmenu'),()=>{ playClick(); btnAnim(document.getElementById('rmenu'),1,0.93); memClose(); });
  document.querySelectorAll('#view-memory .dpad-arrow').forEach(el=>{
    onPress(el,()=>{
      playClick(900); dpadAnim(el);
      if(el.classList.contains('right')||el.classList.contains('down')) memPage = Math.min(MEM_PAGES-1, memPage+1);
      else memPage = Math.max(0, memPage-1);
    });
  });

  // A・右・下＝次のページ／B・左・上＝前のページ／MENU＝読むのをやめる
  onPress(document.getElementById('sa'),()=>{ playClick(); btnAnim(document.getElementById('sa')); storyNext(); });
  onPress(document.getElementById('sb'),()=>{ playClick(); btnAnim(document.getElementById('sb')); storyPrev(); });
  onPress(document.getElementById('smenu'),()=>{ playClick(); btnAnim(document.getElementById('smenu'),1,0.93); showView('menu'); });
  document.querySelectorAll('#view-story .dpad-arrow').forEach(el=>{
    onPress(el,()=>{
      playClick(900); dpadAnim(el);
      if(el.classList.contains('right') || el.classList.contains('down')) storyNext();
      else storyPrev();
    });
  });

  // ── キーボード操作（PCで遊ぶ人向け）──
  //  ミニゲーム3種は前から矢印キーに対応しているのに、本体だけマウス必須だった。
  //  判定を書き足すと画面ごとの分岐が二重管理になるので、
  //  表示中の画面の実ボタンをそのまま押して、既存の処理に流す
  const KEY_PREFIX = {opening:'o', naming:'g', main:'m', menu:'n', diary:'t', story:'s'};
  const KEY_DIR = {ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right'};
  document.addEventListener('keydown', e=>{
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(miniFrame || manualFrame) return;              // 重ねて開いているあいだは本体を操作しない
    const p = KEY_PREFIX[scene];
    if(!p) return;
    const dir = KEY_DIR[e.key];
    if(dir){
      // 十字キーは押しっぱなしの連続入力を活かす
      const el = document.querySelector('#view-'+scene+' .dpad-arrow.'+dir);
      if(el){ e.preventDefault(); el.click(); }
      return;
    }
    if(e.repeat) return;                              // A/B/MENUは押しっぱなしで連打させない
    const k = e.key.toLowerCase();
    const id = (k==='a' || k===' ' || k==='enter') ? p+'a'
             : (k==='b' || k==='escape' || k==='backspace') ? p+'b'
             : (k==='m') ? p+'menu' : null;
    if(!id) return;
    const btn = document.getElementById(id);
    if(btn){ e.preventDefault(); btn.click(); }
  });

})();
</script>

<script>
// iPhone実機表示：ゲーム機シェルを画面サイズに合わせて拡大（デザイン比率は維持）

  // 実機（ホーム画面アプリ / iOS Safari）ではモックのiPhone外装を消す
  (function(){
    var standalone = window.navigator.standalone === true ||
                     (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    var touchPhone = /iPhone|iPod|Android/i.test(navigator.userAgent);
    if(standalone || touchPhone) document.body.classList.add("device");
  })();
(function(){
  // セーフエリアの各辺を実測（env()はCSSでしか読めないので、探り用の要素を挿して測る）
  function safeInset(side){
    var p=document.createElement("div");
    p.style.cssText="position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-"+side+");";
    document.body.appendChild(p);
    var v=p.getBoundingClientRect().height; p.remove();
    return v;
  }
  function fit(){
    var el=document.querySelector(".iphone"); if(!el) return;
    el.style.transform="none";
    // 計測は必ず通常フローの状態で行う（横向き時のfixed指定が残っていると幅が変わるため）
    el.style.position=""; el.style.left=""; el.style.top="";
    var r=el.getBoundingClientRect();
    var w=r.width||280, h=r.height||600;
    var vw=window.innerWidth, vh=window.innerHeight;
    var device=document.body.classList.contains("device");
    // 端末を横に倒しても縦画面のまま見せる（回転させない）。
    // iOS Safariはマニフェストのorientation指定もscreen.orientation.lock()も非対応のため、
    // 横向きを検知して中身を90度カウンター回転させることで縦表示を維持する。
    var landscape = device && vw > vh;
    // 回転後の外接矩形は (h×s) × (w×s) になるので、幅と高さを入れ替えて収める
    var s = landscape ? Math.min(vw*0.995/h, vh*0.995/w)
                      : Math.min(vw*0.995/w, vh*0.995/h);
    el.style.transformOrigin="center center";
    // どちら向きに倒したかで必要な回転方向が変わるため、OSが報告する角度の逆ぶんだけ戻す
    var angle=0;
    if(window.screen && screen.orientation && typeof screen.orientation.angle==="number") angle=screen.orientation.angle;
    else if(typeof window.orientation==="number") angle=window.orientation;
    if(landscape && angle%180===0) angle=90;   // 角度が取得できない環境では時計回り90°とみなす
    // 横向き時は通常フローの高さ(545px)が画面高を超えて中央がずれるため、fixedで確実にセンタリングする
    if(landscape){ el.style.position="fixed"; el.style.left="50%"; el.style.top="50%"; }
    el.style.transform=(landscape ? "translate(-50%,-50%) rotate("+(-angle)+"deg) " : "")+"scale("+s+")";
    // 実機ではステータスバー分だけ中身（LCD・十字ボタン・A/B/MENU）を下げ、
    // 上部にLEDの余白を確保する。ステータスバーへの被りも避けられる。
    var app=document.querySelector(".app");
    if(app){
      var pad=0;
      if(device){
        // 回転時は画面の左右どちらかにノッチが来る（どちら向きに倒したかで変わる）ので大きい方を使う
        var sat = landscape ? Math.max(safeInset("left"), safeInset("right")) : safeInset("top");
        pad=(sat/s)+6;   // セーフエリア分＋少し余白
      }
      app.style.paddingTop=pad+"px";
    }
    placeLed();
  }
  // 電源LEDを、現在表示中のLCDパネルの上端すぐ上（機種のセーフエリアに依存しない位置）へ置く。
  // 以前はステータスバー分を一律で足しており、Dynamic Island機種などLCDに被ることがあった。
  // 座標はレイアウト値(offsetTop)で求める：getBoundingClientRectは拡大・回転の影響を受けるため。
  function placeLed(){
    var led=document.querySelector(".power-led"); if(!led) return;
    var parent=led.offsetParent || document.querySelector(".app");
    var active=document.querySelector(".view.active");
    var lcd=active && active.querySelector(".lcd-wrap");
    if(!parent || !lcd) return;
    var lcdTop=0, node=lcd;
    while(node && node!==parent){ lcdTop+=node.offsetTop; node=node.offsetParent; }
    var ledH=led.offsetHeight||5;
    // .lcd-wrap の外周ベゼルは box-shadow(0 0 0 7px) で描かれ、レイアウト上の高さに含まれない。
    // そのぶん上に張り出しているので、ベゼル分を差し引いた位置に置かないと実機で被る。
    var BEZEL=7, GAP=8;   // GAP=LEDとLCDベゼルの間隔
    var top=lcdTop - ledH - BEZEL - GAP;
    if(top<2) top=2;
    led.style.top=top+"px";
  }
  window.__placeLed=placeLed;      // ビュー切替時に本体スクリプトから呼ぶ
  window.addEventListener("resize",fit);
  window.addEventListener("orientationchange",function(){setTimeout(fit,300);});
  window.addEventListener("load",fit);
  document.addEventListener("DOMContentLoaded",fit);
})();
</script>
