<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Little Invader">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>My Little Invader</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0;
    /* ボタン長押しでテキスト選択・コピーメニューが出て操作の邪魔になるのを防ぐ。
       iOS Safariは -webkit- 付きのみ有効。テキスト入力欄は無い（命名画面もcanvas描画）ので全体に適用してよい */
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  body { background:#111; display:flex; justify-content:center; align-items:center; min-height:100vh;
    touch-action:manipulation; }

  /* ── iPhoneシェル（開発プレビュー用コンテナ） ── */
  .iphone {
    width:280px; background:#2a2a2a; border-radius:44px; padding:14px;
    border:1px solid #444;
    box-shadow:0 0 0 1px #111, inset 0 1px 0 #555, 0 40px 80px rgba(0,0,0,0.8);
    position:relative;
  }

  /* iPhone側面ボタン（iPhoneのUI） */
  .btn-l  { position:absolute; left:-5px; top:100px; width:4px; height:28px; background:#1e1e1e; border-radius:2px 0 0 2px; border:1px solid #111; }
  .btn-l2 { position:absolute; left:-5px; top:136px; width:4px; height:50px; background:#1e1e1e; border-radius:2px 0 0 2px; border:1px solid #111; }
  .btn-r  { position:absolute; right:-5px; top:120px; width:4px; height:60px; background:#1e1e1e; border-radius:0 2px 2px 0; border:1px solid #111; }

  /* iPhone内側 */
  .iphone-inner { background:#000; border-radius:34px; overflow:hidden; }
  .island { position:absolute; top:10px; left:50%; transform:translateX(-50%); width:88px; height:26px; background:#000; border-radius:20px; z-index:10; }

  /* iPhoneスクリーン ＝ ゲーム機の表示面 */
  .screen-area {
    width:252px; height:545px; background:var(--body-bg, #e8e3d8);
    overflow:hidden; position:relative; display:flex; flex-direction:column;
    align-items:center;
  }
  /* iPhoneホームバー */
  .home-bar { position:absolute; bottom:6px; left:50%; transform:translateX(-50%); width:80px; height:4px; background:rgba(0,0,0,0.18); border-radius:4px; }

  /* ── ゲーム機UI（iPhone画面全体を占有） ── */
  .app {
    width:100%; height:100%;
    background:var(--body-bg, #e8e3d8);
    position:relative;
    display:flex; flex-direction:column; align-items:center;
  }

  /* 電源LED（右上コーナー、ダイナミックアイランド近傍） */
  .power-led {
    position:absolute; top:12px; right:14px;
    width:5px; height:5px; border-radius:50%;
    background:#1fd45e;
    box-shadow:0 0 4px #1fd45e, 0 0 10px rgba(31,212,94,0.55);
    z-index:20;
  }

  /* スピーカーグリル（ホームバーの上、下部中央） */
  .speaker-grille {
    position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
    width:64px; height:5px;
    background-image: radial-gradient(circle at 2px 2.5px, rgba(0,0,0,0.28) 1.5px, transparent 0);
    background-size: 5px 5px;
    pointer-events:none;
  }

  .view { display:none; flex-direction:column; align-items:center; width:100%; }
  .view.active { display:flex; }

  /* ── LCD パネル（多重ベゼル） ── */
  .lcd-wrap {
    background:#b8c890; border-radius:4px;
    position:relative; overflow:hidden; flex-shrink:0;
    box-shadow:
      0 0 0 2px #18160e,
      0 0 0 5px #2e2c1e,
      0 0 0 7px #131108,
      inset 0 2px 6px rgba(0,0,0,0.24),
      inset 2px 0 4px rgba(0,0,0,0.1),
      0 5px 9px rgba(0,0,0,0.40);
  }
  .lcd-wrap::after {
    content:''; position:absolute; inset:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.04) 3px,rgba(0,0,0,0.04) 4px);
    pointer-events:none; z-index:2;
  }
  canvas { display:block; image-rendering:pixelated; width:216px; height:260px; }

  /* opening */
  #view-opening .lcd-wrap { margin-top:16px; width:216px; height:260px; }
  .title-area { margin-top:14px; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .game-title { font-family:'Press Start 2P',monospace; font-size:11px; color:#1a2410; text-align:center; line-height:1.6; }
  .story-text { font-family:'Press Start 2P',monospace; font-size:5px; color:#4a5830; text-align:center; line-height:2; letter-spacing:0.03em; padding:0 8px; }
  .story-text em { font-style:normal; color:#1a2410; }
  .tap-prompt { font-family:'Press Start 2P',monospace; font-size:7px; color:#7a7660; animation:blink 1.2s step-end infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* main / menu */
  .name-strip { margin-top:40px; width:216px; display:flex; justify-content:space-between; align-items:baseline; }
  .pet-name { font-family:'Press Start 2P',monospace; font-size:8px; color:#1a2410; }
  .pet-day  { font-family:'Press Start 2P',monospace; font-size:6px; color:#7a7660; }
  #view-main .lcd-wrap, #view-menu .lcd-wrap { margin-top:6px; width:216px; height:260px; }

  /* ── コントローラー ── */
  .controller { margin-top:18px; width:216px; display:flex; justify-content:space-between; align-items:center; }
  .dpad { position:relative; width:72px; height:72px; flex-shrink:0; }
  .dpad-h, .dpad-v {
    position:absolute;
    background:linear-gradient(180deg,#3c3c3c 0%,#252525 55%,#1c1c1c 100%);
    border-radius:5px; border:1px solid rgba(0,0,0,0.55);
    box-shadow:0 4px 4px var(--shadow-hard,rgba(0,0,0,0.32)), 0 6px 12px var(--shadow-soft,rgba(0,0,0,0.22)), inset 0 1px 0 rgba(255,255,255,0.1), inset 0 -2px 4px rgba(0,0,0,0.42);
  }
  .dpad-h { width:72px; height:24px; top:24px; left:0; }
  .dpad-v { width:24px; height:72px; top:0; left:24px; }
  /* Dパッドセンター＋十字刻み */
  .dpad-center {
    position:absolute; width:24px; height:24px; top:24px; left:24px;
    background:#252525; z-index:1;
  }
  .dpad-center::before {
    content:''; position:absolute; inset:0;
    background:
      linear-gradient(rgba(255,255,255,0.07) 0,rgba(255,255,255,0.07) 1px,transparent 1px) 50% 50%/12px 100% no-repeat,
      linear-gradient(90deg,rgba(255,255,255,0.07) 0,rgba(255,255,255,0.07) 1px,transparent 1px) 50% 50%/100% 12px no-repeat;
  }
  .dpad-arrow {
    position:absolute; display:flex; align-items:center; justify-content:center;
    font-size:6px; color:rgba(255,255,255,0.14); z-index:2; width:24px; height:24px;
    user-select:none; transition:transform 0.06s, filter 0.06s;
  }
  .dpad-arrow.up    { top:0; left:24px; }
  .dpad-arrow.down  { bottom:0; left:24px; }
  .dpad-arrow.left  { top:24px; left:0; }
  .dpad-arrow.right { top:24px; right:0; }

  .btns { display:flex; gap:8px; align-items:center; }
  /* Nintendo式：Bが下・Aが上の斜め配置 */
  .btn-row { display:flex; gap:12px; align-items:flex-start; }
  .btns-wrap { display:flex; flex-direction:column; align-items:center; gap:3px; }
  .btns-wrap.btn-b { transform:translateY(8px); }

  .action-btn {
    width:34px; height:34px; min-width:34px; min-height:34px; max-width:34px; max-height:34px;
    border-radius:50%;
    background:linear-gradient(145deg,#363636 0%,#232323 55%,#1a1a1a 100%);
    border:none;
    box-shadow:0 4px 4px var(--shadow-hard,rgba(0,0,0,0.32)), 0 6px 12px var(--shadow-soft,rgba(0,0,0,0.22)), inset 0 1px 2px rgba(255,255,255,0.13), inset 0 -2px 4px rgba(0,0,0,0.45);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0; transition:transform 0.06s, filter 0.06s;
  }
  .btn-lbl { font-family:'Press Start 2P',monospace; font-size:9px; color:rgba(255,255,255,0.3); user-select:none;
    text-shadow: 0 1px 1px rgba(255,255,255,0.1), 0 -1px 0 rgba(0,0,0,0.5); }
  .lbl-b   { color:rgba(255,255,255,0.3); }
  .lbl-a   { color:rgba(255,255,255,0.3); }

  /* MENUボタン */
  .controller-wrap { display:flex; flex-direction:column; align-items:center; gap:8px; width:216px; margin-top:42px; }
  .controller-row  { width:216px; display:flex; justify-content:space-between; align-items:center; }
  .menu-btn {
    width:60px; height:18px;
    border-radius:9px; background:linear-gradient(180deg,#333 0%,#1e1e1e 100%); border:none;
    box-shadow:0 3px 3px var(--shadow-hard,rgba(0,0,0,0.32)), 0 5px 10px var(--shadow-soft,rgba(0,0,0,0.22)), inset 0 1px 0 rgba(255,255,255,0.1), inset 0 -1px 2px rgba(0,0,0,0.35);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform 0.06s, filter 0.06s;
  }
  .menu-btn-lbl { font-family:'Press Start 2P',monospace; font-size:7px; color:rgba(255,255,255,0.3); user-select:none; letter-spacing:0.08em;
    text-shadow: 0 1px 1px rgba(255,255,255,0.1), 0 -1px 0 rgba(0,0,0,0.5); }

  /* ── 実機モード（ホーム画面から起動 or 実機Safari）：モックのiPhone外装を消してゲーム機本体だけ表示 ── */
  body.device { background:var(--body-bg, #e8e3d8); }
  body.device { overflow:hidden; }
  html.device, body.device { width:100%; height:100%; }
  body.device .iphone {
    background:transparent; border:none; border-radius:0; padding:0; box-shadow:none;
    width:auto;           /* 外装を消した分、幅を中身(252px)に合わせて左寄りを解消 */
  }
  body.device .btn-l, body.device .btn-l2, body.device .btn-r,
  body.device .island, body.device .home-bar { display:none; }
  body.device .iphone-inner { border-radius:0; background:transparent; }
  body.device .screen-area { border-radius:0; }
</style>
</head>
<body>
<div class="iphone">
  <div class="btn-l"></div><div class="btn-l2"></div><div class="btn-r"></div>
  <div class="iphone-inner">
    <div class="island"></div>
    <div class="screen-area">
      <div class="app">
        <div class="power-led"></div>

        <!-- OPENING -->
        <div class="view active" id="view-opening">
          <div class="lcd-wrap" style="margin-top:48px;">
            <canvas id="lcd-o"></canvas>
          </div>
          <div class="controller-wrap">
            <div class="controller-row">
              <div class="dpad">
                <div class="dpad-h"></div><div class="dpad-v"></div><div class="dpad-center"></div>
                <div class="dpad-arrow up">▲</div><div class="dpad-arrow down">▼</div>
                <div class="dpad-arrow left">◀</div><div class="dpad-arrow right">▶</div>
              </div>
              <div class="btns"><div class="btn-row">
                <div class="btns-wrap btn-b"><div class="action-btn" id="ob"><span class="btn-lbl lbl-b">B</span></div></div>
                <div class="btns-wrap"><div class="action-btn" id="oa"><span class="btn-lbl lbl-a">A</span></div></div>
              </div></div>
            </div>
            <div class="menu-btn" id="omenu"><span class="menu-btn-lbl">MENU</span></div>
          </div>
        </div>

        <!-- NAMING -->
        <div class="view" id="view-naming">
          <div class="lcd-wrap" style="margin-top:48px;"><canvas id="lcd-g"></canvas></div>
          <div class="controller-wrap">
            <div class="controller-row">
              <div class="dpad">
                <div class="dpad-h"></div><div class="dpad-v"></div><div class="dpad-center"></div>
                <div class="dpad-arrow up">▲</div><div class="dpad-arrow down">▼</div>
                <div class="dpad-arrow left">◀</div><div class="dpad-arrow right">▶</div>
              </div>
              <div class="btns"><div class="btn-row">
                <div class="btns-wrap btn-b"><div class="action-btn" id="gb"><span class="btn-lbl lbl-b">B</span></div></div>
                <div class="btns-wrap"><div class="action-btn" id="ga"><span class="btn-lbl lbl-a">A</span></div></div>
              </div></div>
            </div>
            <div class="menu-btn" id="gmenu"><span class="menu-btn-lbl">MENU</span></div>
          </div>
        </div>

        <!-- MAIN -->
        <div class="view" id="view-main">
          <div class="lcd-wrap" style="margin-top:48px;"><canvas id="lcd-m"></canvas></div>
          <div class="controller-wrap">
            <div class="controller-row">
              <div class="dpad">
                <div class="dpad-h"></div><div class="dpad-v"></div><div class="dpad-center"></div>
                <div class="dpad-arrow up">▲</div><div class="dpad-arrow down">▼</div>
                <div class="dpad-arrow left">◀</div><div class="dpad-arrow right">▶</div>
              </div>
              <div class="btns"><div class="btn-row">
                <div class="btns-wrap btn-b"><div class="action-btn" id="mb"><span class="btn-lbl lbl-b">B</span></div></div>
                <div class="btns-wrap"><div class="action-btn" id="ma"><span class="btn-lbl lbl-a">A</span></div></div>
              </div></div>
            </div>
            <div class="menu-btn" id="mmenu"><span class="menu-btn-lbl">MENU</span></div>
          </div>
        </div>

        <!-- MENU -->
        <div class="view" id="view-menu">
          <div class="lcd-wrap" style="margin-top:48px;"><canvas id="lcd-n"></canvas></div>
          <div class="controller-wrap">
            <div class="controller-row">
              <div class="dpad">
                <div class="dpad-h"></div><div class="dpad-v"></div><div class="dpad-center"></div>
                <div class="dpad-arrow up">▲</div><div class="dpad-arrow down">▼</div>
                <div class="dpad-arrow left">◀</div><div class="dpad-arrow right">▶</div>
              </div>
              <div class="btns"><div class="btn-row">
                <div class="btns-wrap btn-b"><div class="action-btn" id="nb"><span class="btn-lbl lbl-b">B</span></div></div>
                <div class="btns-wrap"><div class="action-btn" id="na"><span class="btn-lbl lbl-a">A</span></div></div>
              </div></div>
            </div>
            <div class="menu-btn" id="nmenu"><span class="menu-btn-lbl">MENU</span></div>
          </div>

        <!-- STORY -->
        <div class="view" id="view-story">
          <div class="lcd-wrap" style="margin-top:48px;"><canvas id="lcd-s"></canvas></div>
          <div class="controller-wrap">
            <div class="controller-row">
              <div class="dpad">
                <div class="dpad-h"></div><div class="dpad-v"></div><div class="dpad-center"></div>
                <div class="dpad-arrow up">▲</div><div class="dpad-arrow down">▼</div>
                <div class="dpad-arrow left">◀</div><div class="dpad-arrow right">▶</div>
              </div>

                <div class="btns-wrap btn-b"><div class="action-btn" id="sb"><span class="btn-lbl lbl-b">B</span></div></div>
                <div class="btns-wrap"><div class="action-btn" id="sa"><span class="btn-lbl lbl-a">A</span></div></div>

      </div>
      <div class="home-bar"></div>
    </div>

</div>

<script>
(function(){
  // My Little Invader 本体（育成画面）。ミニゲームへの遷移と復帰は同一フォルダ内の相対パス
  const W=54, H=65, S=4;
  const ON='#1a2410', OFF='#b8c890', DIM='#8aaa6a';
  // 育成画面の地面（お世話アイコンはMENU内に移動したため元の高さ。ミニゲーム側と同じ）
  const MAIN_GY = 61;

  // ════════════════════════════════════════
  // 多言語（EN/JP。デフォルトEN。※日本語はPress Start 2P非対応のためフォールバック表示）
  // ════════════════════════════════════════
  let lang = 'en';
  try{ if(localStorage.getItem('myvader_lang') === 'ja') lang = 'ja'; }catch(e){}
  const I18N = {
    en: {
      feed:'FEED', clean:'CLEAN', med:'MEDICINE', pet:'PRAISE', scold:'SCOLD', game:'MINI GAME',
      status:'STATUS', story:'STORY', settings:'SETTINGS', play:'PLAY',
      sound:'SOUND', bodycolor:'BODY COLOR', location:'LOCATION', language:'LANGUAGE', debug:'DEBUG', reset:'ALL RESET',
      on:'ON', off:'OFF', exec:'EXEC', sure:'SURE?', yesno:'A:YES  B:NO',
      locn1:'USE LOCATION', locn2:'ONLY TO SHOW', locn3:'IN-GAME WEATHER', locok:'A:OK  B:CANCEL',
      hungry:'HUNGRY', mood:'MOOD', health:'HEALTH', stage:'STAGE', ptype:'TYPE',
      good:'GOOD', sick:'SICK', weak:'WEAK', dead:'DEAD',
      newborn:'NEWBORN', baby:'BABY', child:'CHILD', adult:'ADULT', finalst:'FINAL',
      gray:'GRAY', martian:'MARTIAN', alien:'ALIEN',
      nameq:'NAME?', done:'DONE', langval:'ENGLISH',
    },
    ja: {
      feed:'ごはん', clean:'そうじ', med:'くすり', pet:'ほめる', scold:'しかる', game:'ゲーム',
      status:'ステータス', story:'ストーリー', settings:'せってい', play:'あそぶ',
      sound:'サウンド', bodycolor:'カラー', location:'ロケーション', language:'げんご', debug:'デバッグ', reset:'リセット',
      on:'オン', off:'オフ', exec:'じっこう', sure:'ほんとうに？', yesno:'A:はい B:いいえ',
      locn1:'いちじょうほうは', locn2:'ゲームの天気に', locn3:'のみつかいます', locok:'A:OK  B:キャンセル',
      hungry:'おなか', mood:'きげん', health:'けんこう', stage:'せいちょう', ptype:'タイプ',
      good:'げんき', sick:'びょうき', weak:'よわり', dead:'おばけ',
      newborn:'うまれたて', baby:'あかちゃん', child:'こども', adult:'おとな', finalst:'さいしゅう',
      gray:'グレイ', martian:'マーシャン', alien:'エイリアン',
      nameq:'なまえは？', done:'けってい', langval:'にほんご',
    },
  };
  function T(k){ return (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k; }
  function toggleLang(){ lang = (lang==='en') ? 'ja' : 'en'; try{ localStorage.setItem('myvader_lang', lang); }catch(e){} }
  // フォント：英語はピクセル字体（Press Start 2P）
  //          日本語はグリフを持つゴシック体で、小さいと潰れるため大きめに描画（可読性優先）
  const JP_FONT = '"Hiragino Maru Gothic ProN","Yu Gothic","Hiragino Sans",sans-serif';
  function uiFont(px){
    if(lang==='ja') return Math.max(9, px + 2) + 'px ' + JP_FONT;  // 例:6px→9px / 7px→9px / 8px→10px
    return px + 'px "Press Start 2P"';
  }
  // ペット名は英数字ならピクセル字体、かな交じりならゴシック体で描画
  function isAscii(s){ return /^[\x00-\x7F]*$/.test(s||''); }
  function nameFont(px, s){ return isAscii(s) ? px + 'px "Press Start 2P"' : Math.max(9, px+2) + 'px ' + JP_FONT; }

  function initCanvas(id) {
    const c = document.getElementById(id);
    c.width = W*S; c.height = H*S;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    return ctx;
  }
  function dot(ctx,x,y,col){ if(x<0||x>=W||y<0||y>=H)return; ctx.fillStyle=col||ON; ctx.fillRect(x*S,y*S,S,S); }
  function stamp(ctx,grid,ox,oy,col){ const c=col||ON; grid.forEach((row,ry)=>row.forEach((v,rx)=>{if(v)dot(ctx,ox+rx,oy+ry,c);})); }

  // ── 遷移 ──
  let scene = 'opening';
  let storyScrollY = 0;
  let storyDone = false;

  function showView(id) {
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+id).classList.add('active');
    scene = id;
    if(id==='story'){ storyScrollY=H*S; storyDone=false; }
    if(window.__placeLed) window.__placeLed();   // 表示中LCDの上に電源LEDを合わせ直す
  }

  // ── 音 ──
  let ac = null;
  // iOSではバックグラウンド復帰・電話などの割り込み後にAudioContextがsuspendedになり無音化する。
  // 生成直後にsuspendedで始まることもあるため、必ずresumeを試みてから鳴らす。
  function ensureAudio(){
    if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; } }
    if(ac.state === 'suspended'){ ac.resume().catch(()=>{}); }
  }
  // 何らかの操作・前面復帰のたびにresumeして復帰させる（保険）
  ['touchend','pointerdown','click'].forEach(function(ev){
    document.addEventListener(ev, function(){ if(ac && ac.state==='suspended') ac.resume().catch(()=>{}); }, {passive:true});
  });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && ac && ac.state==='suspended') ac.resume().catch(()=>{}); });

    osc.connect(g); g.connect(ac.destination);
    osc.type='square';
    osc.frequency.setValueAtTime(freq, ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq*0.33, ac.currentTime+0.04);
    g.gain.setValueAtTime(0.15, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+0.05);
    osc.start(); osc.stop(ac.currentTime+0.05);

  function updatePowerLed(level){

  function easeOut(t){return 1-(1-t)*(1-t);}
  function easeIn(t) {return t*t;}
  function getPhaseO(f){ let r=f%O_TOTAL; for(let p=0;p<O_PHASES.length;p++){if(r<O_PHASES[p])return{ph:p,t:r/O_PHASES[p]};r-=O_PHASES[p];} return{ph:0,t:0}; }

  function drawGroundO(){
    for(let x=0;x<W;x++) dot(ctxO,x,GROUND_Y,ON);
    for(let x=0;x<W;x+=3) dot(ctxO,x,GROUND_Y-1,DIM);
    // 建物（元モックと同じ）
    for(let y=H-11;y<H-4;y++){dot(ctxO,1,y,ON);dot(ctxO,2,y,ON);dot(ctxO,3,y,ON);dot(ctxO,4,y,ON);}
    for(let y=H-8;y<H-4;y++){dot(ctxO,5,y,ON);dot(ctxO,6,y,ON);}
    for(let y=H-13;y<H-4;y++){dot(ctxO,W-6,y,ON);dot(ctxO,W-5,y,ON);dot(ctxO,W-4,y,ON);dot(ctxO,W-3,y,ON);}
    for(let y=H-9;y<H-4;y++){dot(ctxO,W-7,y,ON);dot(ctxO,W-8,y,ON);}
  }
  function drawBeamO(cx,topY,progress){
    const fullBot=H-5, beamBot=Math.round(topY+(fullBot-topY)*progress);
    const totalH=fullBot-topY, maxHalf=10;
    for(let y=topY;y<=beamBot;y++){
      const p=totalH>0?(y-topY)/totalH:0;
      const half=Math.round(p*maxHalf);
      for(let dx=-half;dx<=half;dx++) dot(ctxO,cx+dx,y,OFF);

      if(ph===1){ const ux=Math.round(UFO_START_X+(UFO_END_X-UFO_START_X)*easeOut(t)); stamp(ctxO,UFO_SPR,ux,UFO_Y,ON); }
      else if(ph===2){ stamp(ctxO,UFO_SPR,UFO_END_X,UFO_Y,ON); drawBeamO(UFO_CX,BEAM_TOP,easeOut(t)); }
      else if(ph===3){ drawBeamO(UFO_CX,BEAM_TOP,1); stamp(ctxO,UFO_SPR,UFO_END_X,UFO_Y,ON); const by=Math.round(BEAM_TOP+(BABY_END_Y-BEAM_TOP)*easeOut(t)); stamp(ctxO,BABY_SPR,BABY_X,by,ON); }
      else if(ph===4){ const bp=1-easeOut(t); if(bp>0)drawBeamO(UFO_CX,BEAM_TOP,bp); stamp(ctxO,UFO_SPR,UFO_END_X,UFO_Y,ON); stamp(ctxO,BABY_SPR,BABY_X,BABY_END_Y,ON); }
      else if(ph===5){ const ux=Math.round(UFO_END_X+(-UFO_END_X-16)*easeIn(t)); const uy=Math.round(UFO_Y-12*easeIn(t)); stamp(ctxO,UFO_SPR,ux,uy,ON); stamp(ctxO,BABY_SPR,BABY_X,BABY_END_Y,ON); }
      else if(ph===6){
        const totalDx=W-BABY_X+4, bx=BABY_X+Math.round(t*totalDx);
        const seg=Math.min(t*5,4.999), segIdx=Math.floor(seg), segT=seg-segIdx;

      fO++;

        ctxO.font = '6px "Press Start 2P"';
        ctxO.fillStyle = blink ? ON : DIM;
        ctxO.fillText('PRESS  A', cx, 35*S);
      }
    }
  }

  // ════════════════════════════════════════

  // ════════════════════════════════════════
  const SAVE_KEY = 'myvader_pet';

    EP:0, ageMin:0, eggTargetEP:0,        // 進化ポイント/年齢(分)/NEWBORN→BABYの個体別目標EP
    finalAt:0, departFlag:false,          // 最終形態到達時刻・旅立ちエンド確定

    praiseCount:0, scoldBadCount:0,       // ほめた回数／理不尽・睡眠妨害のしかる回数

  let pet = defaultPet();

  // ════════════════════════════════════════
  // 進化システム（企画書§5）
  //  EP: 1日=1.0＋天気補正(晴れ+0.2/雨-0.2)。DEBUG中は60倍で貯まる
  //  たまご→(約30h±5h・EPで判定)→中間体→(EP1)→幼体→(EP4)→成体[P分岐]→(EP11)→最終形態[C×D+特殊]
  // ════════════════════════════════════════
  // ════════════════════════════════════════
  // かまい度システム（甘やかし↔放置）
  //  進化の系統・形態の分岐と、早期の帰還エンディング判定に使う。
  //  数値はここに集約してあるので、バランス調整はこのブロックだけで完結する。
  // ════════════════════════════════════════
  const A_ADJ = {                 // 行動ごとのかまい度増減
    feedFull:   +3,               // 満腹なのにごはん＝甘やかし
    feedHungry: +1,               // 空腹時のごはん＝適切な世話
    praise:     +2,
    clean:      +1,
    med:        +1,
    play:       +1,
    scoldFair:   0,               // 正当なしつけ（わがまま中）は甘やかしでも放置でもない
    scoldBad:   -3,               // 理不尽なしかる／寝ているのを起こすしかる
    noTouchDay: -8,               // ふれあいゼロの日
    starveHour: -1,               // 空腹MAXの放置（1時間ごと）
    dirtHour:   -1,               // 汚れの放置（1時間ごと）
  };
  const A_SPOIL_SCALE   = 30;     // 1日あたりのAがこの値で「甘やかし度100」
  const A_NEGLECT_SCALE = 15;     // 1日あたりの−Aがこの値で「放置度100」
  const PLAY_WEIGHT     = 25;     // ミニゲーム傾向の重み（世話スタイルが主・ゲームは従）
  // 帰還エンディング（幼体到達を起点に判定）
  const RET_GRACE_DAYS  = 3;      // 幼体到達からこの日数は判定しない（猶予）
  const RET_ESTR_DAYS   = 3;      // 疎遠期がこの日数続くと帰還
  const RET_PRAISE_RATE = 0.1;    // ほめる回数／日 がこれ未満で兆候（10日に1回未満＝極端に少ない）
  const RET_PLAY_RATE   = 0.1;    // ミニゲーム回数／日 がこれ未満で兆候（10日に1回未満）
  const RET_SCOLD_RATE  = 2.0;    // 理不尽なしかる／日 がこれ超で兆候
  const RET_NOTOUCH_DAYS= 5;      // ふれあいゼロがこの日数続くと兆候

  function addA(n){ pet.A = Math.max(-9999, Math.min(9999, (pet.A||0) + n)); }

  // 帰還の兆候があるか（幼体到達後の接し方だけを見る）。1日1回、日付が変わった時に判定
  //  生命維持の怠り（空腹・病気）は「死亡」ルートなのでここでは見ない。
  //  ここで見るのは「ごはんは与えているが構ってやらない」という情緒的な放置。
  function returnSigns(){
    if(!pet.larvaAt || !pet.snapL) return [];                // 幼体前は判定しない
    const days = daysSince(pet.larvaAt);
    if(days < RET_GRACE_DAYS) return [];                     // 到達直後の猶予期間
    const p = pet.plays || {sw:0,ss:0,ab:0};
    const praise = (pet.praiseCount||0)   - (pet.snapL.praise||0);
    const bad    = (pet.scoldBadCount||0) - (pet.snapL.bad||0);
    const plays  = (p.sw||0)+(p.ss||0)+(p.ab||0) - (pet.snapL.plays||0);
    const sg = [];
    if((pet.noTouchDays||0) >= RET_NOTOUCH_DAYS)       sg.push('notouch'); // ごはんしか与えていない日が続く
    if(praise < days * RET_PRAISE_RATE)                sg.push('praise');  // ほめる回数が極端に少ない
    if(plays  < days * RET_PLAY_RATE)                  sg.push('play');    // 遊ぶ回数が極端に少ない
    if(bad > days * RET_SCOLD_RATE && bad > praise*3)  sg.push('scold');   // 理不尽なしかるが多すぎる
    if(pet.lowBDays >= 5)                              sg.push('lowB');    // なつき度が低いまま続いた
    return sg;
  }
  // 兆候が重なった時だけ疎遠期に入り、続けば帰還が確定する（途中で持ち直せば解除）。
  //  1項目だけ欠けている程度（例：よく褒めるがゲームはしない）では帰還させない。
  //  ただし「ふれあいゼロが続く」は単独でも明確な放置なので成立させる。
  function checkReturn(){
    if(pet.dead || pet.ufoFlag) return;
    const sg = returnSigns();
    const bad = sg.includes('notouch') || sg.length >= 2;
    if(bad){
      pet.estrangedDays = (pet.estrangedDays||0) + 1;
      if(pet.estrangedDays >= RET_ESTR_DAYS) pet.ufoFlag = true;
    } else {
      pet.estrangedDays = 0;                                 // 持ち直したら解除
    }
  }
  // ごはん以外の世話（ほめる・遊ぶ・そうじ・くすり）に触れた印。1日1回でも触れれば放置ではない
  function markTouch(){ pet.touchedToday = true; }
  const DAY_MS = 86400000;
  function daysSince(ts){ return ts ? Math.max(0, (Date.now()-ts)/DAY_MS) : 0; }

  // 世話スタイルを3方向のスコアに変換（0〜100）
  function careStyle(aPerDay){
    const spoil   = Math.max(0, Math.min(1,  aPerDay / A_SPOIL_SCALE))   * 100;
    const neglect = Math.max(0, Math.min(1, -aPerDay / A_NEGLECT_SCALE)) * 100;
    return { spoil, neglect, balance: 100 - Math.max(spoil, neglect) };
  }
  // ミニゲームのプレイ比率（合計0なら全て0＝補正なし）
  function playRatio(p){
    const t = (p.sw||0)+(p.ss||0)+(p.ab||0);
    return t ? {sw:p.sw/t, ss:p.ss/t, ab:p.ab/t} : {sw:0, ss:0, ab:0};
  }
  function bestOf(scores){   // {key:点数} から最高点のキーを返す
    return Object.keys(scores).reduce((a,b)=> scores[b] > scores[a] ? b : a);
  }

  // NEWBORN→BABY：30時間±5時間。他段階と同じEP（天気補正付きの累積）で判定し、機嫌でも増減
  const EGG_H_BASE = 30, EGG_H_JITTER = 5;
  function rollEggTarget(){ return (EGG_H_BASE + (Math.random()*2-1)*EGG_H_JITTER) / 24; }  // 時間→EP(1日=1.0)
  let evoT = 0;                                   // 進化演出フレーム
  let departEnding = !!(pet.departFlag && !pet.dead), departT = 0;   // 旅立ちエンド（E4）

  function evolveTo(st){ pet.stage = st; evoT = 36; savePet(); }

  // Stage3 系統分岐：全期間の世話スタイル＋ミニゲーム傾向
  //   甘やかす→タコ ／ バランス→インベーダー ／ 放置気味→グレイ
  function pickLineage(){
    const days = Math.max(1, daysSince(pet.birth));
    const st = careStyle((pet.A||0) / days);
    const r  = playRatio(pet.plays || {});
    return bestOf({
      tako: st.spoil   + r.sw * PLAY_WEIGHT,   // SPACEWALK をよく遊ぶとタコ寄り
      inv:  st.balance + r.ss * PLAY_WEIGHT,   // SHOOTING STAR でインベーダー寄り
      grey: st.neglect + r.ab * PLAY_WEIGHT,   // ABDUCTION でグレイ寄り
    });
  }
  // Stage4 形態分岐：成体になってからの行動だけで判定（前半と後半で育て方を変えられる）
  //   甘やかす→まるっと(1) ／ バランス→バランス(2) ／ 放置気味→やんちゃ(3)
  function pickForm(){
    const L = pet.lineage;
    // 特殊条件（隠し進化）を優先
    if(L==='tako' && pet.fullFeeds >= 10 && pet.sickCount >= 1) return 't3';   // クラーケン：大食いルート
    if(L==='grey' && pet.best.sw >= 250 && pet.best.ss >= 100 && pet.best.ab >= 400) return 'g3';  // オールラウンダー
    if(L==='inv'  && pet.nightPlays >= 7 && pet.D >= 50) return 'i3';          // ワイルド（夜更かしだが悪い子ではない）
    const s = pet.snapA || {A:0, sw:0, ss:0, ab:0};
    const days = Math.max(1, daysSince(pet.lineageAt));
    const st = careStyle(((pet.A||0) - (s.A||0)) / days);
    const p  = pet.plays || {sw:0,ss:0,ab:0};
    const r  = playRatio({ sw:(p.sw||0)-(s.sw||0), ss:(p.ss||0)-(s.ss||0), ab:(p.ab||0)-(s.ab||0) });
    const n = bestOf({
      1: st.spoil   + r.sw * PLAY_WEIGHT,   // まるっと ← SPACEWALK
      2: st.balance + r.ab * PLAY_WEIGHT,   // バランス ← ABDUCTION
      3: st.neglect + r.ss * PLAY_WEIGHT,   // やんちゃ ← SHOOTING STAR
    });
    return (L==='grey'?'g':L==='tako'?'t':'i') + n;
  }
  function maybeEvolve(){
    if(pet.dead || !pet.name) return;
    if(effectiveAsleep()) return;                 // 進化は起きている時（起床時）に起こる
    if(pet.stage==='egg'){   // NEWBORN→BABY：EPが個体ごとの目標(30h±5h)に達したら。以後の段階はBABY起点で数えるためEPリセット
      if(!pet.eggTargetEP) pet.eggTargetEP = rollEggTarget();
      if(pet.EP >= pet.eggTargetEP){ pet.EP = 0; return evolveTo('mid'); }
      return;
    }
    if(pet.stage==='mid'   && pet.EP >= 1){
      // 幼体到達＝帰還判定の起点。ここからの接し方を見る（それ以前の放置は持ち越さない）
      pet.larvaAt = Date.now();
      const p = pet.plays || {sw:0,ss:0,ab:0};
      pet.snapL = { praise: pet.praiseCount||0, bad: pet.scoldBadCount||0,
                    plays: (p.sw||0)+(p.ss||0)+(p.ab||0) };
      pet.noTouchDays = 0; pet.estrangedDays = 0;
      return evolveTo('larva');
    }
    if(pet.stage==='larva' && pet.EP >= 4){
      pet.lineage = pickLineage();                // 世話スタイル×ミニゲーム傾向で系統決定
      // 成体到達＝形態判定の起点。ここからの行動だけで最終形態が決まる
      pet.lineageAt = Date.now();
      const p = pet.plays || {sw:0,ss:0,ab:0};
      pet.snapA = { A: pet.A||0, sw:p.sw||0, ss:p.ss||0, ab:p.ab||0 };
      return evolveTo('adult');
    }
    if(pet.stage==='adult' && pet.EP >= 11){
      pet.form = pickForm();                      // 成体以降の世話スタイル＋特殊条件で形態決定
      pet.finalAt = Date.now();
      return evolveTo('final');
    }
  }

  // ミニゲームの結果を受け取り（戻ってきた起動時に処理）
  function processGameResult(){
    try {
      const raw = localStorage.getItem('myvader_result');
      if(!raw) return;
      localStorage.removeItem('myvader_result');
      returnedFromGame = true;
      const r = JSON.parse(raw);
      if(!r || !pet.name || pet.dead) return;
      if(Date.now() - r.at > 3600000) return;     // 1時間以上前の結果は無視
      if(pet.mood < 4) pet.mood++;                // 遊んで楽しかった
      gainB(2);
      const h = new Date(r.at).getHours();
      if(h >= 22 || h < 4){ pet.nightPlays++; pet.P = Math.min(100, pet.P + 2); }   // 夜更かし
      if(!pet.plays) pet.plays = {sw:0,ss:0,ab:0};
      if(r.game==='spacewalk'){    pet.best.sw = Math.max(pet.best.sw, r.score); pet.plays.sw++; if(r.score >= 250) pet.P = Math.max(-100, pet.P - 2); }
      if(r.game==='shootingstar'){ pet.best.ss = Math.max(pet.best.ss, r.score); pet.plays.ss++; if(r.score >= 100) pet.P = Math.min(100, pet.P + 2); }
      if(r.game==='abduction'){    pet.best.ab = Math.max(pet.best.ab, r.score); pet.plays.ab++; if(r.score >= 400) pet.C = Math.min(100, pet.C + 2); }
      addA(A_ADJ.play); markTouch();                // 遊んであげた＝ふれあい
      pet.C = Math.min(100, pet.C + 1);           // 遊んであげたケア加点
      savePet();
    } catch(e){}
  }
  processGameResult();
  // ミニゲームからの復帰：オープニングを飛ばして育成画面へ直行
  if(returnedFromGame && pet.name) showView('main');
  // 育成中（命名済みで生存）は、アプリを再起動してもオープニングを出さず育成画面から再開
  else if(pet.name && !pet.dead) showView('main');

  // ── ミニゲームを同一ページ内のフルスクリーンiframeで開く ──
  // ホーム画面アプリで別ファイルへ遷移するとSafariのUI付き表示に抜け出してしまうため、
  // 遷移せずiframeで重ねる。プレイ中は本体の時間進行を止める。
  let miniFrame = null, inMiniGame = false;
  function openMiniGame(file){
    if(miniFrame) return;
    inMiniGame = true;
    savePet();
    const f = document.createElement('iframe');
    f.src = file;
    f.setAttribute('scrolling','no');
    f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:none;z-index:9999;background:#000;';
    document.body.appendChild(f);
    miniFrame = f;
  }
  function closeMiniGame(){
    if(miniFrame){ miniFrame.remove(); miniFrame = null; }
    inMiniGame = false;
    pet.lastTick = Date.now();     // プレイ中のぶんは進行させない
    processGameResult();           // スコアを育成に反映
    savePet();
    inPlay = false;
    showView('main');
  }
  window.addEventListener('message', function(e){
    if(e && e.data && e.data.myvader === 'exit') closeMiniGame();
  });
  // 経過日数：進化タイマー(EP/ageMin)とは別カウント。カレンダーの日付境界(0:00)で+1
  function startOfDay(t){ const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
  function petDay(){
    if(!pet.birth) return 1;
    const days = Math.round((startOfDay(Date.now()) - startOfDay(pet.birth)) / 86400000);
    return Math.min(99, days + 1);   // 誕生日=DAY01、次の0:00でDAY02
  }
  function dayLabel(){ return 'DAY' + String(petDay()).padStart(2,'0'); }

  // ── 時間進行（企画書§4 ドラフト値）──
  const HUNGER_MIN = 180;   // 3時間でおなか♥1減（幼体）
  const MOOD_MIN   = 240;   // 4時間でごきげん♪1減
  const CATCHUP_CAP_MS = 14*86400000;  // 起動時の経過計算は最大14日分

  // ── 睡眠スケジュール（企画書§4：段階/系統別。毎日±ランダムでばらつく）──
  // 日ごとに安定した擬似乱数（同じ日は同じ、日が変われば変わる。個体ごとにも異なる）
  function dayIndex(d){ const x = new Date(d); x.setHours(0,0,0,0); return Math.floor(x.getTime()/86400000); }
  function dayRnd(di, salt){
    let s = (Math.imul(di, 2654435761) ^ ((pet.birth||0) & 0xffffffff)) | 0;
    for(let i=0;i<salt.length;i++) s = (Math.imul(s, 31) + salt.charCodeAt(i)) | 0;
    s ^= s >>> 15; s = Math.imul(s, 2246822519); s ^= s >>> 13;
    return ((s >>> 0) % 100000) / 100000;   // 0..1
  }
  // 段階/系統別の睡眠設定：bed=就寝時,wake=起床時（inv=夜更かしで24=0時）,jit=±分ゆらぎ,nap種別
  function sleepConfig(){
    const st = pet.stage;
    if(st==='egg' || st==='mid') return {bed:19, wake:8, jit:45, nap:'baby'};   // 赤ちゃん：ほぼ寝ている
    if(st==='larva')             return {bed:20, wake:8, jit:40, nap:'young'};  // 幼体：夜＋昼寝（幅広）
    const L = pet.lineage;
    if(L==='tako') return (pet.form==='t3')
      ? {bed:21, wake:7, jit:40, nap:'none'}     // クラーケンは昼寝なし
      : {bed:21, wake:7, jit:45, nap:'young'};   // タコ：まるっと・昼寝あり（幅広）
    if(L==='inv')  return {bed:24, wake:9, jit:60, nap:'none'};   // インベーダー：夜更かし
    return {bed:22, wake:7, jit:40, nap:'none'};                  // グレイ：バランス・昼寝なし
  }
  // その日の昼寝ウィンドウ（幼体/タコ/赤ちゃんのみ。回数・時間帯を日ごとにランダム化）
  function napWindows(di, kind){
    if(kind==='none') return [];
    const r = dayRnd(di,'napn');
    let count = (kind==='baby') ? (r<0.15?1:2)          // 赤ちゃんは昼寝多め（ほぼ2回）
                                : (r<0.30?0 : r<0.80?1:2); // 幼体/タコ：なし30%/1回50%/2回20%
    const out = [];
    for(let i=0;i<count;i++){
      const base  = dayRnd(di,'nside'+i) < 0.45 ? 9 : 13;               // 午前(9時台〜) or 午後(13時台〜)
      const start = base*60 + Math.floor(dayRnd(di,'nstart'+i)*150);    // 基準＋0〜2.5時間
      const dur   = (kind==='baby'?80:60) + Math.floor(dayRnd(di,'ndur'+i)*40);  // 60/80＋0〜40分
      out.push([start, start+dur]);
    }
    return out;
  }
  function isAsleep(d){
    const cfg = sleepConfig();
    const di  = dayIndex(d);
    const minutes = d.getHours()*60 + d.getMinutes();
    // 夜間睡眠（毎日±jitterでゆらぐ）
    let bedM  = cfg.bed*60  + Math.round((dayRnd(di,'bed') *2-1)*cfg.jit);
    const wakeM = cfg.wake*60 + Math.round((dayRnd(di,'wake')*2-1)*cfg.jit);
    bedM = ((bedM % 1440) + 1440) % 1440;
    const night = (bedM <= wakeM) ? (minutes >= bedM && minutes < wakeM)
                                  : (minutes >= bedM || minutes < wakeM);
    if(night) return true;
    // 昼寝
    return napWindows(di, cfg.nap).some(([a,b]) => minutes >= a && minutes < b);
  }
  // 実効睡眠（しかられて起きた直後は起きている）
  // DEBUG中は常に起きている扱い（3秒サイクルの夜に操作がランダムに弾かれるのを防ぎ、いつでも検証可能に）
  function effectiveAsleep(){
    if(debugMode) return false;
    return isAsleep(new Date()) && Date.now() >= (pet.wokeUntil || 0);
  }

  // 経過時間ぶんのステータス進行。睡眠中は1/3減速。DEBUG中は60倍加速（検証用）
  function advancePet(){
    if(!pet.name || !pet.lastTick) return;
    const now = Date.now();
    if(pet.dead || ufoEnding || departEnding || inMiniGame){ pet.lastTick = now; return; }   // 死亡・エンディング後・ミニゲーム中は進行停止
    let elapsed = now - pet.lastTick;
    if(elapsed < 60000) return;                    // 1分未満は持ち越し
    let remain = Math.min(elapsed, CATCHUP_CAP_MS);
    const mult = debugMode ? 60 : 1;
    const STEP = 60000;                            // 実1分刻み
    let vt = now - remain;
    while(remain >= STEP){
      vt += STEP; remain -= STEP;
      const sleeping = isAsleep(new Date(vt));
      // 残しておいた皿：起きていて空腹なら食べる（傷んだ皿は食べない）
      if(pet.plateAt && !pet.plateSpoiled && !sleeping && pet.hunger < 4){ pet.plateAt = 0; pet.hunger++; schedulePoop(); }
      const rate = sleeping ? 1/3 : 1;
      const gameMin = mult * rate;
      const dirtN = pet.W + (pet.plateSpoiled ? 1 : 0);   // 汚れ総数（うんち＋食べ残し）
      // 年齢と進化ポイント（睡眠減速なし。EPは1日=1.0＋天気補正）
      pet.ageMin += mult;
      const wb = weatherFetched ? (weather==='clear' ? 0.2 : isBadWeather() ? -0.2 : 0) : 0;
      // NEWBORN期は世話の充実度（機嫌）でも進化速度が少し増減
      const careF = (pet.stage==='egg') ? (pet.mood>=3 ? 1.15 : (pet.mood<=1 ? 0.85 : 1)) : 1;
      pet.EP += mult / 1440 * (1 + wb) * careF;
      pet.hungerAcc += gameMin;
      pet.moodAcc   += gameMin * (dirtN > 0 ? 2 : 1);   // 汚れ放置中はごきげん低下が2倍
      if(pet.hungerAcc >= HUNGER_MIN){ pet.hungerAcc -= HUNGER_MIN; if(pet.hunger > 0) pet.hunger--; }
      if(pet.moodAcc   >= MOOD_MIN)  { pet.moodAcc   -= MOOD_MIN;   if(pet.mood   > 0) pet.mood--;   }

      // 汚れ放置 → 病気（6時間ごとに抽選。1個=10%、2個以上=25%）
      if(dirtN > 0 && pet.health === 'GOOD'){
        pet.dirtAcc += gameMin;
        if(pet.dirtAcc >= 360){
          pet.dirtAcc -= 360;
          if(Math.random() < (dirtN >= 2 ? 0.25 : 0.10)) pet.health = 'SICK';
        }
      }
      // 病気放置 → 死（36時間・起床換算）
      if(pet.health === 'SICK'){
        pet.sickAcc += gameMin;
        if(pet.sickAcc >= 2160){ pet.dead = 'sick'; break; }
      }
      // 空腹MAX → 衰弱(18時間) → 死(さらに12時間)
      if(pet.hunger === 0){
        pet.starveAcc += gameMin;
        addA(A_ADJ.starveHour * gameMin / 60);      // 空腹MAXの放置＝放置寄り
        if(pet.starveAcc >= 1800){ pet.dead = 'starve'; break; }
      } else pet.starveAcc = 0;
      if(pet.W >= 2) addA(A_ADJ.dirtHour * gameMin / 60);   // 汚れの放置＝放置寄り
    }
    pet.lastTick = now - remain;

    // 皿の放置 → 食べ残し汚れ化（2時間。DEBUG中は2分）。皿は残したまま「傷んだ皿」にする
    const PLATE_MS = debugMode ? 120000 : 7200000;
    if(pet.plateAt && !pet.plateSpoiled && now - pet.plateAt >= PLATE_MS){ pet.plateSpoiled = true; }
    // うんち発生
    if(pet.poopAt && now >= pet.poopAt){ pet.poopAt = 0; pet.W = Math.min(4, pet.W + 1); if(!pet.poopSince) pet.poopSince = now; }

    // わがまま拒否の放置（60分。DEBUG中は60秒）→ しつけ低下
    const TANTRUM_MS = debugMode ? 60000 : 3600000;
    if(pet.tantrumAt && now - pet.tantrumAt >= TANTRUM_MS){
      pet.tantrumAt = 0; pet.tantrumType = '';
      pet.D = Math.max(0, pet.D - 3);
    }

    // ── 日次処理：日付が変わった時に1回だけ ──
    const tk = todayKey();
    if(pet.calDay !== tk){
      if(pet.calDay){
        // ふれあい（ごはん以外の世話）が無い日が続くと、少しずつ心が離れる
        if(pet.touchedToday){ pet.noTouchDays = 0; }
        else { pet.noTouchDays = (pet.noTouchDays||0) + 1; addA(A_ADJ.noTouchDay); pet.B = Math.max(0, pet.B - 5); }
        pet.lowBDays = (pet.B < 20) ? pet.lowBDays + 1 : 0;
        checkReturn();                                  // 帰還の兆候（疎遠期）と確定を判定
      }
      pet.calDay = tk;
      pet.touchedToday = false;
    }
    // 旅立ちエンド（E4）：最終形態から14日・なつき度60以上・健康
    if(pet.stage==='final' && pet.finalAt && !pet.departFlag &&
       now - pet.finalAt >= 14*86400000 && pet.B >= 60 && pet.health === 'GOOD'){
      pet.departFlag = true;
    }

    maybeEvolve();   // 進化条件チェック（起きている時のみ発動）
    savePet();
  }

  // ════════════════════════════════════════
  // NAMING（スタート時のみ・1〜6文字・以後変更不可）
  //  文字種：ABC(英数) / ひらがな / カタカナ。MENUボタンで切替（言語設定に依存せず全て選べる）
  // ════════════════════════════════════════
  const ctxG = initCanvas('lcd-g');
  const NAME_MAX = 6;
  // ABC：6×6グリッド
  const ABC_ROWS = (()=>{ const s='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789', rows=[];
    for(let r=0;r<6;r++){ const row=[]; for(let c=0;c<6;c++) row.push(s[r*6+c]||null); rows.push(row);} return rows; })();
  // 五十音表（6段×10行。空欄はnull。末尾列に を/ん/ー）※定義は左=あ行で書き、下で列を反転してあ行を右端に
  // 6段目は小書き文字：促音(っ)・拗音(ゃゅょ)・小書き母音。撥音(ん)と長音(ー)は3段目/4段目の末尾列にある
  const HIRA_ROWS = [
    ['あ','か','さ','た','な','は','ま','や','ら','わ'],
    ['い','き','し','ち','に','ひ','み',null,'り','を'],
    ['う','く','す','つ','ぬ','ふ','む','ゆ','る','ん'],
    ['え','け','せ','て','ね','へ','め',null,'れ','ー'],
    ['お','こ','そ','と','の','ほ','も','よ','ろ','゛'],
    ['ぁ','ぃ','ぅ','ぇ','ぉ','っ','ゃ','ゅ','ょ','゜'],
  ];
  const KATA_ROWS = [
    ['ア','カ','サ','タ','ナ','ハ','マ','ヤ','ラ','ワ'],
    ['イ','キ','シ','チ','ニ','ヒ','ミ',null,'リ','ヲ'],
    ['ウ','ク','ス','ツ','ヌ','フ','ム','ユ','ル','ン'],
    ['エ','ケ','セ','テ','ネ','ヘ','メ',null,'レ','ー'],
    ['オ','コ','ソ','ト','ノ','ホ','モ','ヨ','ロ','゛'],
    ['ァ','ィ','ゥ','ェ','ォ','ッ','ャ','ュ','ョ','゜'],
  ];
  // 五十音表の伝統的な並び（あ行を右端）にするため各段の列を反転
  [HIRA_ROWS, KATA_ROWS].forEach(rows=>rows.forEach(r=>r.reverse()));
  // ── 濁点(゛)／半濁点(゜)：直前に打った文字（編集中はカーソル位置の文字）に付け外しする ──
  const MARK_DAKU = '゛', MARK_HANDAKU = '゜';
  const DAKU = {
    'か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご','さ':'ざ','し':'じ','す':'ず','せ':'ぜ','そ':'ぞ',
    'た':'だ','ち':'ぢ','つ':'づ','て':'で','と':'ど','は':'ば','ひ':'び','ふ':'ぶ','へ':'べ','ほ':'ぼ','う':'ゔ',
    'カ':'ガ','キ':'ギ','ク':'グ','ケ':'ゲ','コ':'ゴ','サ':'ザ','シ':'ジ','ス':'ズ','セ':'ゼ','ソ':'ゾ',
    'タ':'ダ','チ':'ヂ','ツ':'ヅ','テ':'デ','ト':'ド','ハ':'バ','ヒ':'ビ','フ':'ブ','ヘ':'ベ','ホ':'ボ','ウ':'ヴ',
  };
  const HANDAKU = {
    'は':'ぱ','ひ':'ぴ','ふ':'ぷ','へ':'ぺ','ほ':'ぽ',
    'ハ':'パ','ヒ':'ピ','フ':'プ','ヘ':'ペ','ホ':'ポ',
  };
  const DAKU_REV = {}, HANDAKU_REV = {};
  for(const k in DAKU)    DAKU_REV[DAKU[k]] = k;
  for(const k in HANDAKU) HANDAKU_REV[HANDAKU[k]] = k;
  // 濁点・半濁点を外した素の文字（が→か、ぱ→は）
  function kanaBase(ch){ return DAKU_REV[ch] || HANDAKU_REV[ch] || ch; }
  // 対象位置：編集中ならカーソル位置、末尾（追記位置）なら直前に打った文字
  function markTargetIndex(){ return (nameCur < nameBuf.length) ? nameCur : nameCur - 1; }
  function applyMark(mark){
    const i = markTargetIndex();
    if(i < 0 || i >= nameBuf.length) return false;
    const ch = nameBuf[i], base = kanaBase(ch);
    const table = (mark === MARK_DAKU) ? DAKU : HANDAKU;
    // 同じ記号をもう一度押したら外す（トグル）。付けられない文字なら何もしない
    const out = (table[base] === ch) ? base : table[base];
    if(!out) return false;
    nameBuf = nameBuf.slice(0,i) + out + nameBuf.slice(i+1);
    return true;
  }
  const NAME_MODES = ['abc','hira','kata'];
  const MODE_TAG = {abc:'ABC', hira:'ひらがな', kata:'カタカナ'};   // 切替ボタンの表示（語で切替）
  let nameMode = 'abc';
  let nameBuf = '', nameR = 0, nameC = 0, onDone = false, onSwitch = false;
  let nameCur = 0;          // 編集中のスロット位置（0..NAME_MAX-1）。ここに文字を書き込む
  let onSlots = false;      // 名前スロット行を選択中（左右でカーソル移動＝打った文字の修正）
  // カーソルが取りうる最大位置：末尾の追記位置まで（文字を飛ばして空きを作らせない）
  function nameCurMax(){ return Math.min(nameBuf.length, NAME_MAX-1); }
  let nameSelActive = false;     // 育成画面で「NAME:????」を選択中（黒塗り反転表示。Aで命名画面へ）
  let fG = 0;

  function nameLayout(){
    if(nameMode==='abc') return {cells:ABC_ROWS, cellW:8, rowH:6, gx0:3, gy0:17, kana:false};
    // かなは6段（小書き文字の段を追加）。下部ボタン列(y58〜)に掛からないよう行高を7・開始を15に詰めてある
    return {cells:(nameMode==='hira'?HIRA_ROWS:KATA_ROWS), cellW:5, rowH:7, gx0:2, gy0:15, kana:true};
  }
  function setNameMode(m){ nameMode = m; nameR=0; nameC = (m==='abc') ? 0 : 9; }  // かなは「あ」（右端）から
  function cycleNameMode(){ setNameMode(NAME_MODES[(NAME_MODES.indexOf(nameMode)+1)%NAME_MODES.length]); }
  function startNaming(){ setNameMode((lang==='ja')?'hira':'abc'); nameBuf=''; nameCur=0; onDone=false; onSwitch=false; onSlots=false; }

  function tickNaming(){
    if(scene !== 'naming') return;
    fG++;
    ctxG.fillStyle = OFF; ctxG.fillRect(0,0,W*S,H*S);
    ctxG.textBaseline = 'top';

    // タイトル
    ctxG.font = uiFont(6); ctxG.fillStyle = ON; ctxG.textAlign = 'center';
    ctxG.fillText(T('nameq'), (W*S)/2, 1*S);

    // 名前スロット（6枠、入力中の枠は点滅）
    const slotW = 7, startX = Math.round(W/2 - NAME_MAX*slotW/2);
    for(let i=0;i<NAME_MAX;i++){
      const cx = startX + i*slotW;
      const ch = nameBuf[i];
      const cursorHere = (i === nameCur);
      // スロット行を選択中は、編集対象の枠を網掛けで示す（文字より先に塗る）
      if(onSlots && cursorHere){
        for(let dx=0;dx<slotW;dx++) for(let dy=0;dy<7;dy++) dot(ctxG, cx+dx, 5+dy, DIM);
      }
      if(ch){
        ctxG.font = nameFont(8, ch); ctxG.fillStyle = ON; ctxG.textAlign = 'center';
        ctxG.fillText(ch, (cx + slotW/2)*S, 6*S);
      }
      const blink = Math.floor(fG/4)%2===0;
      const lineCol = cursorHere ? (blink?ON:DIM) : DIM;
      for(let dx=0;dx<5;dx++) dot(ctxG, cx+1+dx, 11, lineCol);
    }
    for(let x=1;x<W-1;x++) dot(ctxG, x, 14, DIM);

    // 文字グリッド
    const L = nameLayout();
    for(let r=0;r<L.cells.length;r++){
      for(let c=0;c<L.cells[r].length;c++){
        const ch = L.cells[r][c]; if(ch===null) continue;
        const x = L.gx0 + c*L.cellW, y = L.gy0 + r*L.rowH;
        const isSel = (!onDone && !onSwitch && r===nameR && c===nameC);
        // 網掛けの高さ：文字に合わせて短く（下に伸びすぎるのを防ぐ）。かな6/英数5
        const hlH = L.kana ? 6 : 5;
        if(isSel){ for(let dx=0;dx<L.cellW;dx++) for(let dy=0;dy<hlH;dy++) dot(ctxG, x+dx, y+dy, DIM); }
        // 濁点・半濁点はフォントの記号だと極小で見分けづらいため、ドット絵で大きく描く
        if(ch === MARK_DAKU){          // ゛＝縦2本のチョン
          for(const cx of [1,3]) { dot(ctxG, x+cx, y+2, ON); dot(ctxG, x+cx, y+3, ON); }
          continue;
        }
        if(ch === MARK_HANDAKU){       // ゜＝丸（穴を大きく取らないと塗りつぶしに見えるのでセル幅いっぱいに描く）
          for(const cx of [1,2,3]) { dot(ctxG, x+cx, y+1, ON); dot(ctxG, x+cx, y+4, ON); }
          dot(ctxG, x+0, y+2, ON); dot(ctxG, x+4, y+2, ON);
          dot(ctxG, x+0, y+3, ON); dot(ctxG, x+4, y+3, ON);
          continue;
        }
        // かなは言語設定に依らず常にゴシック体・同一サイズ（ひらがな/カタカナで統一）
        ctxG.font = L.kana ? ('9px ' + JP_FONT) : '7px "Press Start 2P"';
        ctxG.fillStyle = ON; ctxG.textAlign = 'center'; ctxG.textBaseline = 'middle';
        ctxG.fillText(ch, (x + L.cellW/2)*S, (y + hlH/2)*S);   // 網掛け内で上下中央
        ctxG.textBaseline = 'top';
      }
    }

    // ── 下部ボタン列：左下=入力切替（現在の文字種を語で表示・押すと循環）、右=DONE ──
    const by = 59;
    const swBoxTop = by - 1, swBoxL = 1, swBoxW = 24;   // ボタン領域 x1..24 / y58..64
    if(onSwitch){ // 選択：薄緑の網掛け（文字選択と同じ）
      for(let dx=0;dx<swBoxW;dx++) for(let dy=0;dy<7;dy++) dot(ctxG, swBoxL+dx, swBoxTop+dy, DIM);
    }
    // かなラベルはアプリ言語に依らず常にゴシック体で大きめに（ABCとの見た目サイズを揃える）
    ctxG.font = (nameMode==='abc') ? '7px "Press Start 2P"' : ('9px ' + JP_FONT);
    ctxG.fillStyle = ON; ctxG.textAlign='center'; ctxG.textBaseline='middle';
    ctxG.fillText(MODE_TAG[nameMode], (swBoxL + swBoxW/2)*S, (by+2)*S);
    ctxG.textBaseline='top';
    // DONE（右寄せ・1文字以上で有効）。切替ボタンと縦位置・サイズを揃える
    const doneCx = 40;
    if(onDone){ for(let dx=0;dx<20;dx++) for(let dy=0;dy<7;dy++) dot(ctxG, 30+dx, by-1+dy, DIM); }
    ctxG.font = (lang==='ja') ? ('9px '+JP_FONT) : '7px "Press Start 2P"';
    ctxG.fillStyle = nameBuf.length ? ON : '#7a7660';
    ctxG.textAlign = 'center'; ctxG.textBaseline = 'middle';
    ctxG.fillText(T('done'), doneCx*S, (by+2)*S);
    ctxG.textBaseline = 'top';
  }

  function nameMove(dir){
    const L = nameLayout(), R = L.cells.length, C = L.cells[0].length;
    if(onSlots){   // 名前スロット行：左右でカーソル移動（打った文字の修正）、下でグリッドへ
      if(dir==='left')  nameCur = Math.max(0, nameCur-1);
      if(dir==='right') nameCur = Math.min(nameCurMax(), nameCur+1);
      if(dir==='down'){ onSlots=false; nameR=0; }
      if(dir==='up'){   onSlots=false; onSwitch=true; }   // 上で下部ボタン列へ（縦方向のループ）
      return;
    }
    if(onSwitch || onDone){   // 下部ボタン列：左=切替ボタン / 右=DONE、上でグリッドへ戻る
      if(dir==='left'){  onSwitch=true;  onDone=false; }
      if(dir==='right'){ onSwitch=false; onDone=true;  }
      if(dir==='up'){ onSwitch=false; onDone=false; nameR=R-1; nameC=Math.min(nameC,C-1); if(L.cells[nameR][nameC]===null) nameMove('left'); }
      if(dir==='down'){ onSwitch=false; onDone=false; onSlots=true; nameCur=Math.min(nameCur, nameCurMax()); }   // 下でスロット行へ（ループ）
      return;
    }
    if(dir==='up' && nameR===0){ onSlots=true; nameCur=Math.min(nameCur, nameCurMax()); return; }   // 最上段から上でスロット行へ（修正用）
    if(dir==='down' && nameR===R-1){ onSwitch=true; return; }   // 最下段から下で下部ボタンへ（まず切替ボタン）
    let nr=nameR, nc=nameC;
    for(let k=0;k<R*C;k++){
      if(dir==='left')  nc=(nc-1+C)%C;
      else if(dir==='right') nc=(nc+1)%C;
      else if(dir==='up')    nr=(nr-1+R)%R;
      else if(dir==='down')  nr=(nr+1)%R;
      if(L.cells[nr][nc]!==null){ nameR=nr; nameC=nc; return; }
    }
  }

  // weather: 'clear' | 'cloudy' | 'rain' | 'snow'
  // timeOfDay: 'day' | 'night'
  let weather = 'clear';

  // 雪は見た目だけ雨と別で、キャラの振る舞い・移動速度・EP補正は雨と同じ扱いにする
  function isBadWeather(){ return weather === 'rain' || weather === 'snow'; }

  function getTimeOfDay() {
    const h = new Date().getHours();
    return (h >= 7 && h < 19) ? 'day' : 'night';
  }

  // Open-Meteo WMO天気コード → weather種別
  function codeToWeather(code) {
    if ([0,1].includes(code))                          return 'clear';
    if ([2,3,45,48].includes(code))                    return 'cloudy';
    // 雪・にわか雪・着氷性の霧雨は雪扱い（雨より先に判定しないと code>=51 に飲まれる）
    if ([56,57,66,67,71,73,75,77,85,86].includes(code)) return 'snow';
    if (code >= 51)                                    return 'rain';
    return 'clear';
  }

  async function fetchWeather() {
    try {
      const pos = await new Promise((res,rej)=>
        navigator.geolocation.getCurrentPosition(res,rej,{timeout:8000})
      );
      const {latitude:lat, longitude:lon} = pos.coords;
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=weathercode`;
      const r = await fetch(url);
      const d = await r.json();
      weather = codeToWeather(d.current.weathercode);
      weatherFetched = true;
    } catch(e) {
      // 位置情報拒否 or オフライン → そのまま
    }
  }

      case 'egg':   return {a:EGG_A, b:EGG_B, rest:EGG_A, sleep:EGG_SLEEP};
      case 'mid':   return {a:MID_A, b:MID_B, rest:MID_A, sleep:MID_SLEEP};

    if(pet.stage==='mid')   return T('baby');
    if(pet.stage==='larva') return T('child');
    if(pet.stage==='adult') return T('adult');
    return T('finalst');
  }

  const SPOIL_LUMP=[

  // ハエ1匹（汚れのすぐ上を小さく舞う・羽ばたきで点滅）。傷んだ皿とうんちで共用
  function drawFly(bx, by, k, NK, DM){
    const fx = bx + Math.round(Math.sin((fM+k*13)/5)*2);

  // 地面上のオブジェクト（皿・うんち）が占めるx区間 [a,b)
  function objectSpans(){
    const spans = [];
    if(pet.plateAt || pet.plateSpoiled) spans.push([PLATE_X, PLATE_X + PLATE_W]);
    for(let i=0;i<pet.W && i<POOP_X.length;i++) spans.push([POOP_X[i], POOP_X[i] + POOP_W]);
    return spans;
  }
  // 幅gwのキャラ左端xを置ける自由区間（画面内・障害物を除く）
  function freeSegments(gw){
    const spans = objectSpans().slice().sort((a,b)=>a[0]-b[0]);
    const hardMax = W - gw - 1;
    const segs = []; let lo = 1;
    for(const [a,b] of spans){
      const blockHi = b - 1;                 // x<b && x+gw>a が被り → 禁止xは (a-gw, b)
      const segHi = Math.min(a - gw, hardMax);
      if(segHi >= lo) segs.push([lo, segHi]);
      lo = Math.max(lo, blockHi + 1);
    }
    if(hardMax >= lo) segs.push([lo, hardMax]);
    return segs.filter(([a,b])=>a<=b);
  }

  // ── 流れ星（晴れた夜だけ、まれに右上→左下へ流れる） ──
  // 特別感を出すため頻度は控えめ。1フレーム80msなので、平均で数分に1回ほど出る確率にしてある
  const SHOOT_CHANCE = 0.00013;  // 毎フレームの出現確率（≒10分に1回。特別感を出すため控えめ）
  const SHOOT_LEN = 4;           // 尾の長さ（ドット）
  let shootStar = null;          // {x,y,vx,vy} 流れている間だけ入る
  function updateShootingStar(NK, DM){
    if(!shootStar){
      if(Math.random() < SHOOT_CHANCE){
        // 画面上部の右寄りから出て、左下へ斜めに流れる
        shootStar = { x: W*0.45 + Math.random()*W*0.5, y: 1 + Math.random()*6, vx: -1.1, vy: 0.55 };
      }
      return;
    }
    // 頭を濃く、尾を薄く描いて流れる向きを見せる
    const hx = Math.round(shootStar.x), hy = Math.round(shootStar.y);
    dot(ctxM, hx, hy, NK);
    for(let i=1;i<=SHOOT_LEN;i++){
      dot(ctxM, Math.round(shootStar.x - shootStar.vx*i), Math.round(shootStar.y - shootStar.vy*i), DM);
    }
    shootStar.x += shootStar.vx; shootStar.y += shootStar.vy;
    // 画面外／地平線に届いたら消す
    if(shootStar.x < -SHOOT_LEN || shootStar.y > MAIN_GY-3) shootStar = null;
  }

  let reactType = null, reactT = 0;   // 育成画面でのリアクション表示

  // ── 移動AI（進化段階・系統・性格で歩き方が変わる） ──
  let walkX = null, walkDir = 1, walkTimer = 0;
  let jumpT = 0, floatT = 0, hopPause = 0, preJumpT = 0;
  let wiggleT = 0;   // その場モゾモゾ（傾きポーズを左右反転で切り替え）
  let squatT = 0;    // その場屈伸（脚を畳んで縮む↔伸びるを繰り返す）
  let squatWalkT = 0; // 屈伸しながら横移動
  function flipH(g){ return g.map(r=>[...r].reverse()); }
  // しゃがみフレーム：下から2番目の行（脚）を1段抜いて縮める。足元は据え置きで屈伸に見える
  function squatFrame(g){ return (g.length >= 5) ? [...g.slice(0, g.length-2), g[g.length-1]] : g; }
  function moveProfile(){
    // speed:ドット/tick, jump:行動決定時のジャンプ率, jumpH:高さ, float:浮遊率, mode:'walk'|'hop'
    let p;
    switch(pet.stage){
      case 'egg':   p = {mode:'walk', speed:0.08, jump:0,    jumpH:0, float:0, wiggle:0.45, squat:0.15}; break;  // 幼少期：時々その場モゾモゾ
      case 'mid':   p = {mode:'walk', speed:0.10, jump:0.05, jumpH:2, float:0, squat:0.15, squatWalk:0.15}; break;
      case 'larva': p = {mode:'walk', speed:0.14, jump:0.06, jumpH:2, float:0, squat:0.18, squatWalk:0.15}; break;
      default: {
        const L = pet.lineage;
        if(L==='tako')     p = {mode:'walk', speed:0.09, jump:0.03, jumpH:1, float:0.12, squat:0.15, squatWalk:0.12}; // ときどき浮遊（控えめ）
        else if(L==='inv') p = {mode:'hop',  speed:0.30, jump:0.25, jumpH:3, float:0,    squat:0.10}; // ぴょんぴょん移動
        else               p = {mode:'walk', speed:0.13, jump:0.05, jumpH:2, float:0,    squat:0.18, squatWalk:0.18}; // グレイ：標準（ジャンプ控えめ）
      }
    }
    // 性格補正：やんちゃは活発、まるっとはおっとり
    if(pet.P >= 30){ p.speed *= 1.3; p.jump = Math.min(0.5, p.jump*1.5); }
    else if(pet.P <= -30){ p.speed *= 0.8; }
    return p;
  }

  function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
  function gainB(n){   // なつき度（日次上限+5）
    if(pet.dayKey !== todayKey()){ pet.dayKey = todayKey(); pet.bGainToday = 0; }
    if(pet.bGainToday < 5){ pet.B = Math.min(100, pet.B + n); pet.bGainToday += n; }
  }
  function schedulePoop(){  // 食後45±30分（DEBUG中は45〜75秒）
    const unit = debugMode ? 1000 : 60000;
    pet.poopAt = Date.now() + (45 + Math.random()*30) * unit;
  }

  // わがまま拒否（Stage2まで）。しつけDが低いほど起きやすい（基準20%）
  function isYoung(){ return pet.stage==='mid' || pet.stage==='larva'; }
  function rollTantrum(type){
    if(!isYoung() || pet.tantrumAt) return false;
    const chance = Math.min(0.5, Math.max(0.05, 0.2 + (50 - pet.D) * 0.004));
    if(Math.random() < chance){
      pet.tantrumAt = Date.now(); pet.tantrumType = type;
      return true;
    }
    return false;
  }

  function doCare(act){
    if(pet.dead || ufoEnding || departEnding || !pet.name) return;  // おばけ・エンディング後・命名前は世話不可
    const asleep = effectiveAsleep();
    switch(act){
      case 'FEED':
        if(asleep){ pet.plateAt = Date.now(); }                     // 起こさない。皿を残す（起床後に空腹なら食べる／放置で食べ残し化）
        else if(pet.tantrumAt || rollTantrum('feed')){ setReaction('refuse'); }  // わがまま：食べない（しかると従う）
        else if(pet.hunger >= 4){
          if(pet.P <= -30){                                         // まるっと傾向：満腹でも食べてしまう
            pet.fullFeeds++; pet.P = Math.max(-100, pet.P - 1); addA(A_ADJ.feedFull);
            if(pet.health === 'GOOD' && Math.random() < 0.05) pet.health = 'SICK';  // 食べ過ぎ病気リスク
            schedulePoop(); setReaction('eat', EAT_T);
          } else { pet.plateAt = Date.now(); setReaction('refuse'); }  // 拒否、皿が残る
        }
        else {
          if(pet.hunger <= 1) gainB(1);                             // 空腹時に食べさせるとなつく
          addA(A_ADJ.feedHungry);
          pet.hunger++; schedulePoop(); setReaction('eat', EAT_T);  // 3口で減っていく食事アニメ
        }
        break;
      case 'CLEAN':
        if(pet.W > 0 || pet.plateAt || pet.plateSpoiled){
          cleanSnapW = pet.W; cleanSnapPlate = !!pet.plateAt; cleanSnapSpoiled = !!pet.plateSpoiled; cleanSnapPoopFly = poopHasFlies();  // 見た目用に退避
          pet.W = 0; pet.plateAt = 0; pet.plateSpoiled = false; pet.poopSince = 0;
          if(pet.mood < 4) pet.mood++;
          addA(A_ADJ.clean); markTouch();
          setReaction('clean', CLEAN_T, asleep);                    // ほうき掃きアニメ（睡眠中は音符を出さない）
        } else setReaction('nothing');                              // 空振り（…）
        break;
      case 'MED':
        if(pet.health === 'SICK'){
          pet.health = 'GOOD'; pet.sickAcc = 0; pet.sickCount++;    // 治療（回数は進化条件に使用）
          addA(A_ADJ.med); markTouch();
          setReaction('cured');
        }
        else { if(pet.mood > 0) pet.mood--; setReaction('anger'); } // 健康時は嫌がる
        break;
      case 'PET':  // PRAISE（褒める）
        if(asleep){ /* 睡眠中は無反応（起こさない・効果なし） */ }
        else {
          // 疎遠期は見た目そっけないが、褒めた事実は記録する（続ければ持ち直せるようにするため）
          pet.praiseCount = (pet.praiseCount||0) + 1;
          addA(A_ADJ.praise); markTouch();
          if(isEstranged()){ setReaction('nothing'); }              // 疎遠期：反応しない（…）
          else { if(pet.mood < 4) pet.mood++; gainB(1); setReaction('heart'); }
        }
        break;
      case 'SCOLD':
        if(asleep){                                                 // 起こしてしまう
          pet.wokeUntil = Date.now() + (debugMode ? 30000 : 600000);
          pet.mood = Math.max(0, pet.mood - 2);
          pet.P = Math.min(100, pet.P + 2);                         // 夜更かし癖（やんちゃ化）
          pet.scoldBadCount = (pet.scoldBadCount||0) + 1;            // 寝ているのを起こす＝理不尽なしかる
          addA(A_ADJ.scoldBad);
          setReaction('anger');
        } else if(pet.tantrumAt){                                   // 正当なしかる：しゅんとして従う（わがまま解消）
          pet.tantrumAt = 0; pet.tantrumType = '';
          pet.D = Math.min(100, pet.D + 5);
          if(pet.mood > 0) pet.mood--;
          addA(A_ADJ.scoldFair); markTouch();                        // しつけは甘やかしでも放置でもない（ふれあいには数える）
          setReaction('sad');                                       // 食事は出さない。改めてごはんをあげれば食べる
        } else {                                                    // 不当なしかる
          pet.mood = Math.max(0, pet.mood - 2);
          pet.B = Math.max(0, pet.B - 2);
          pet.D = Math.max(0, pet.D - 4);
          pet.P = Math.min(100, pet.P + 1);
          pet.scoldBadCount = (pet.scoldBadCount||0) + 1;
          addA(A_ADJ.scoldBad);
          setReaction('sad');
        }
        break;
    }
    savePet();
  }

  // ── おばけ画面（餓死・病死後）：漂うだけ。SETTINGSとリセットのみ操作可 ──

  // ── UFO帰還エンディング（世話不足）：迎えに来て去る → 新しいたまごへ ──
  function drawUfoEnding(BG, DM, NK){
    ctxM.fillStyle = BG; ctxM.fillRect(0,0,W*S,H*S);
    for(let x=0;x<W;x++) dot(ctxM,x,MAIN_GY,NK);
    for(let x=0;x<W;x+=3) dot(ctxM,x,MAIN_GY-1,DM);
    const t = ufoT, ux1 = 20, uy = 6;
    const cr = charSprites().rest;
    const cX = Math.floor((W - cr[0].length)/2), cY = MAIN_GY - cr.length;
    const drawBeam = ()=>{ for(let y=uy+7;y<MAIN_GY;y++) for(let x=23;x<=28;x++) if((x+y)%2===0) dot(ctxM,x,y,DM); };
    if(t < 25){        // UFOが迎えに来る
      const ux = Math.round((W+2) + (ux1-(W+2))*(t/25));
      stamp(ctxM, UFO_SPR, ux, uy, NK);
      stamp(ctxM, cr, cX, cY, NK);
    } else if(t < 50){ // ビーム照射
      stamp(ctxM, UFO_SPR, ux1, uy, NK); drawBeam();
      stamp(ctxM, cr, cX, cY, NK);
    } else if(t < 70){ // 吸い上げ（振り返らない）
      stamp(ctxM, UFO_SPR, ux1, uy, NK); drawBeam();
      const p = (t-50)/20;
      stamp(ctxM, cr, cX, Math.round(cY + (uy+7-cY)*p), NK);
    } else if(t < 90){ // 去る
      const p = (t-70)/20;
      stamp(ctxM, UFO_SPR, Math.round(ux1+(W+6-ux1)*p), Math.round(uy-10*p), NK);
    } else {           // 別れの言葉
      ctxM.font='7px "Press Start 2P"'; ctxM.fillStyle=NK;
      ctxM.textAlign='center'; ctxM.textBaseline='top';
      ctxM.fillText('GOODBYE...',(W*S)/2, 28*S);
    }
    ufoT++;
    if(ufoT >= 130){   // 終了 → セーブ消去 → オープニング（新しいたまご）へ
      try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
      pet = defaultPet(); nameBuf=''; nameCur=0; onSlots=false;
      ufoEnding = false; ufoT = 0;
      showView('opening'); fO = 0; openingReady = false;
    }
  }

  // ── 旅立ちエンディング（E4・ハッピー）：仲間の艦隊が迎えに来る大団円 ──
  function drawDepartEnding(BG, DM, NK){
    ctxM.fillStyle = BG; ctxM.fillRect(0,0,W*S,H*S);
    for(let x=0;x<W;x++) dot(ctxM,x,MAIN_GY,NK);
    for(let x=0;x<W;x+=3) dot(ctxM,x,MAIN_GY-1,DM);
    STARS_M.forEach(([x,y],i)=>dot(ctxM,x,y+10,(fM+i*9)%28<20?DM:BG));
    const t = departT, uy = 5;
    const cr = charSprites().a;
    const cX = Math.floor((W - cr[0].length)/2), cY = MAIN_GY - cr.length;
    const drawBeam = ()=>{ for(let y=uy+9;y<MAIN_GY;y++) for(let x=cX+1;x<cX+cr[0].length-1;x++) if((x+y)%2===0) dot(ctxM,x,y,DM); };
    const fleet = (p)=>{   // 3機の艦隊（中央大＋左右）
      const ux = Math.round((W+4) + (17-(W+4))*p);
      stamp(ctxM, UFO_SPR, ux, uy, NK);
      stamp(ctxM, UFO_SPR, ux-16, uy+6, NK);
      stamp(ctxM, UFO_SPR, ux+16, uy+6, NK);
    };
    if(t < 30){        // 艦隊が迎えに来る
      fleet(t/30);
      stamp(ctxM, cr, cX, cY, NK);
    } else if(t < 60){ // キャラが跳ねて喜ぶ＋ハート
      fleet(1);
      stamp(ctxM, cr, cX, cY + ((t%8<4)?-2:0), NK);
      if(t%10<7) stamp(ctxM, ICO_HEART, cX-6, cY-4, NK);
    } else if(t < 85){ // ビームで昇っていく（手を振る＝小刻み揺れ）
      fleet(1); drawBeam();
      const p = (t-60)/25;
      stamp(ctxM, cr, cX + ((t%4<2)?-1:1), Math.round(cY + (uy+9-cY)*p), NK);
    } else if(t < 110){ // 艦隊が去る
      const p = (t-85)/25;
      const ux = Math.round(17 + (W+6-17)*p), uy2 = Math.round(uy - 12*p);
      stamp(ctxM, UFO_SPR, ux, uy2, NK);
      stamp(ctxM, UFO_SPR, ux-16, uy2+6, NK);
      stamp(ctxM, UFO_SPR, ux+16, uy2+6, NK);
    } else {           // 感謝のメッセージ
      ctxM.font='7px "Press Start 2P"'; ctxM.fillStyle=NK;
      ctxM.textAlign='center'; ctxM.textBaseline='top';
      ctxM.fillText('THANK YOU!',(W*S)/2, 24*S);
      if(departT%10<7) stamp(ctxM, ICO_HEART, Math.floor(W/2)-2, 34, NK);
    }
    departT++;
    if(departT >= 160){   // 大団円 → 新しいたまごへ
      try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
      pet = defaultPet(); nameBuf=''; nameCur=0; onSlots=false;
      departEnding = false; departT = 0;
      showView('opening'); fO = 0; openingReady = false;
    }
  }

  // ════════════════════════════════════════
  // 到着演出：新規ゲーム開始時、画面中央上からのビームでNEWBORNが降りてくる
  //  UFOの機体は映さず、ビームだけを見せる（オープニングでUFOは描き終えているため）
  // ════════════════════════════════════════
  const ARR_BEAM_TOP = 10;                      // 描き始め（ヘッダーの区切り線 y=9 の直下）
  const ARR_APEX = -18;                         // 円錐の頂点。ヘッダーのさらに上に置き、頂点側をしっかり隠す
  const ARR_MAX_HALF = 13;                      // 地面際の半幅（照射角の広さ）
  const ARR_CX = Math.floor(W/2);               // 中央
  const ARR_PH = [16, 26, 10, 18];              // ①ビーム下降 ②キャラ降下 ③着地の間 ④ビーム上昇
  const ARR_TOTAL = ARR_PH.reduce((a,b)=>a+b,0);
  let arriveT = -1;                             // -1=演出なし。0以上で再生中
  function startArrival(){ arriveT = 0; }
  function arrivalPhase(){
    let r = arriveT;
    for(let p=0;p<ARR_PH.length;p++){ if(r < ARR_PH[p]) return {ph:p, t:r/ARR_PH[p]}; r -= ARR_PH[p]; }
    return {ph:ARR_PH.length-1, t:1};
  }
  // ビーム：頂点(ARR_APEX)から下へ広がる円錐のうち、区切り線より下だけを描く。
  //   頂点はヘッダーの奥に隠れるため、見えるのは幅を持った切り口から始まる。
  //   progress=0..1 で下端が伸縮する。
  function drawArrivalBeam(progress, DM){
    const botY = MAIN_GY-1, maxHalf = ARR_MAX_HALF;
    const end = Math.round(ARR_BEAM_TOP + (botY-ARR_BEAM_TOP)*progress);
    for(let y=ARR_BEAM_TOP; y<=end; y++){
      const half = Math.round(((y-ARR_APEX)/(botY-ARR_APEX)) * maxHalf);
      for(let dx=-half; dx<=half; dx++) dot(ctxM, ARR_CX+dx, y, DM);
    }
  }
  // ── 背景一式（下地・名前/日数・区切り線・天体・天気・地面）──
  //    通常の育成画面と到着演出の両方で使う
  function drawMainBackdrop(BG, DM, NK){
    ctxM.fillStyle = BG; ctxM.fillRect(0,0,W*S,H*S);

    // 名前と日数（未命名時は NAME:???? の????を黒/薄緑で点滅。十字上で選択→Aで命名画面へ）
    ctxM.font='6px "Press Start 2P"';
    ctxM.textBaseline='top'; ctxM.textAlign='left';
    if(pet.name){
      ctxM.font=nameFont(6, pet.name); ctxM.fillStyle=NK; ctxM.fillText(pet.name, 2*S, 2*S);
    } else if(nameSelActive){
      // 選択中：黒塗り帯に白抜き（反転）で明示
      for(let dx=1;dx<17;dx++) for(let dy=1;dy<5;dy++) dot(ctxM,dx,dy,NK);
      ctxM.fillStyle=BG; ctxM.fillText('NAME:????', 2*S, 2*S);
    } else {
      ctxM.fillStyle=NK; ctxM.fillText('NAME:', 2*S, 2*S);
      ctxM.fillStyle=(fM%10<5) ? NK : DM;
      ctxM.fillText('????', 2*S + 30, 2*S);   // 'NAME:'=5文字×6px
    }
    ctxM.font='6px "Press Start 2P"';   // DAYカウントは常にピクセル字体（名前がかなでも影響させない）
    ctxM.fillStyle=NK;
    ctxM.textAlign='right'; ctxM.fillText(dayLabel(),  (W-2)*S, 2*S);
    for(let x=0;x<W;x++) dot(ctxM,x,9,DM);

    // ── 天体（右上） ──
    if (timeOfDay==='night') {
      STARS_M.forEach(([x,y],i)=>dot(ctxM,x,y+10,(fM+i*9)%28<20?DM:BG));
      stamp(ctxM, MOON, W-10, 11, NK);
      // 晴れた夜だけ、まれに流れ星（曇り・雨の夜は星が見えない想定なので出さない）
      if (weather === 'clear') updateShootingStar(NK, DM);
    } else if (!isBadWeather()) {
      stamp(ctxM, SUN, W-13, 10, NK);
    }

    // ── 天気エフェクト ──
    if (weather === 'rain') {
      updateRain(BG, DM);
    } else if (weather === 'snow') {
      updateSnow(BG, DM);
    } else if (weather === 'cloudy') {
      // 雲がゆっくり流れる
      cloudX = (cloudX + (fM%4===0?1:0)) % (W+8);
      const cx = W - cloudX;
      stamp(ctxM, CLOUD_A, cx,    11, DM);
      stamp(ctxM, CLOUD_B, cx-14, 14, DM);
    }

    // 地面（下部お世話バーのぶん上げる）
    for(let x=0;x<W;x++) dot(ctxM,x,MAIN_GY,NK);
    for(let x=0;x<W;x+=3) dot(ctxM,x,MAIN_GY-1,DM);
  }

  function drawArrival(BG, DM, NK){
    // 名前・日数・天体・天気も通常画面と同じように出す（キャラだけ居ない状態から始まる）
    drawMainBackdrop(BG, DM, NK);

    const spr = EGG_A, gw = spr[0].length, gh = spr.length;
    const charX = ARR_CX - Math.floor(gw/2);
    const landY = MAIN_GY - gh;                 // 着地位置（足元が地面に接する）
    const {ph,t} = arrivalPhase();

    if(ph===0){                                  // ①ビームが下りてくる
      drawArrivalBeam(easeOut(t), DM);
    } else if(ph===1){                           // ②ビームの中をキャラが降りてくる
      drawArrivalBeam(1, DM);
      const y = Math.round(ARR_BEAM_TOP + (landY-ARR_BEAM_TOP)*easeOut(t));
      stamp(ctxM, spr, charX, y, NK);
    } else if(ph===2){                           // ③着地して少し止まる
      drawArrivalBeam(1, DM);
      stamp(ctxM, spr, charX, landY, NK);
    } else {                                     // ④ビームが上がって消える
      const p = 1-easeOut(t);
      if(p>0) drawArrivalBeam(p, DM);
      stamp(ctxM, spr, charX, landY, NK);
    }

    fM++;                                        // ????の点滅・雲や雨の動きを演出中も進める
    arriveT++;
    if(arriveT >= ARR_TOTAL){ arriveT = -1; }    // 終了 → そのまま育成画面へ
  }

  let fM=0;
  function tickMain(){
    advancePet();   // リアルタイム進行（1分単位で処理）
    if(!debugMode) timeOfDay = getTimeOfDay();   // 実時刻に追従（DEBUG中はサイクル優先）
    const col = getColors();
    const BG  = col.bg, DM = col.dim, NK = col.on;
    if(pet.departFlag && !departEnding && !pet.dead){ departEnding = true; departT = 0; }  // 旅立ちの日
    if(departEnding){ drawDepartEnding(BG, DM, NK); return; }  // 旅立ちエンディング再生中
    if(ufoEnding){ drawUfoEnding(BG, DM, NK); return; }   // 帰還エンディング再生中
    if(pet.dead){ drawGhost(BG, DM, NK); return; }        // おばけ状態
    if(arriveT >= 0){ drawArrival(BG, DM, NK); return; }  // 到着演出（新規ゲーム開始時）
    // 睡眠判定（しかられて起きた直後は起きている。DEBUG中は表示時間帯に連動）
    const asleep = effectiveAsleep();

    drawMainBackdrop(BG, DM, NK);


    // ── キャラクター（段階別スプライト。睡眠・衰弱・病気・天気で振る舞い変化） ──
    const sp = charSprites();
    let yOff=0, grid, bounceSpeed=30, bounceAmt=1;
    let charCol = NK;
    if (asleep) {
      // 睡眠中：丸まって動かない（閉眼スプライト）
      grid = sp.sleep;
      yOff = 0;
    } else if (isWeak()) {
      // 衰弱：薄い色でぐったり動かない
      grid = sp.rest; yOff = 0; charCol = DM;
    } else if (pet.health === 'SICK') {
      // 病気：丸まってゆっくり上下
      grid = sp.rest;
      yOff = (fM%40<20) ? 0 : 1;
    } else if (isBadWeather()) {
      // 雨・雪：動きが遅く、足縮め
      bounceSpeed=60; bounceAmt=1;
      grid = sp.rest;
      yOff = (fM%bounceSpeed)<(bounceSpeed/2)?0:bounceAmt;
    } else if (weather==='cloudy') {
      // 曇り：少しゆっくり
      bounceSpeed=40;
      grid = (fM%50)<25?sp.a:sp.b;
      yOff = (fM%bounceSpeed)<(bounceSpeed/2)?0:bounceAmt;
    } else {
      // 晴れ：元気よく歩く。連続バウンドはやめ、時々しゃがんでからポンと跳ねる（頻度控えめ）
      grid = (fM%50)<25?sp.a:sp.b;
      const bp = fM % 42;                                  // バウンド周期（従来25→42で頻度減）
      if(bp < 3){ grid = squatFrame(grid); yOff = 0; }     // まず屈伸で溜め（足は接地）
      else if(bp < 8){ yOff = -2; }                        // ポンと浮く
      else { yOff = 0; }                                   // それ以外は接地して歩く
    }

    // ── リアクションによるポーズ上書き ──
    let xOff=0;
    let eatLvl = -1;   // 食事中の残量（3→2→1→0）
    if(reactT > 0){
      if(reactType==='eat'){
        eatLvl = Math.max(0, 3 - Math.floor((EAT_T - reactT)/15));
        if(eatLvl > 0){
          grid = eatSprite();                                            // 目が皿の方（右）を向く
          yOff = (fM%6<3) ? -1 : 0;                                      // 食べている間は小さく揺れる
        } else { yOff = 0; }
      }
      else if(reactType==='refuse'||reactType==='anger'){ xOff=(fM%4<2)?-1:1; }  // 首振り/イヤイヤ
      else if(reactType==='sad'){ grid = sp.rest; yOff = 0; }             // しゅん
    }

    // ── 移動AI：歩き回る・ジャンプ・浮遊（タコ）・ぴょんぴょん（インベーダー） ──
    const gw = grid[0].length, gh = grid.length;
    const minX = 1, maxX = W - gw - 1;
    if(walkX === null) walkX = Math.floor((W - gw)/2);
    walkX = Math.max(minX, Math.min(maxX, walkX));   // 進化でサイズが変わった時のクランプ
    const moving = !(asleep || isWeak() || pet.health==='SICK' || reactT>0 || evoT>0);
    let airOff = 0;   // ジャンプ/浮遊の上方向オフセット
    if(moving){
      const prof = moveProfile();
      const wSpd = isBadWeather() ? 0.35 : (weather==='cloudy' ? 0.7 : 1);
      if(wiggleT > 0){
        // その場モゾモゾ：傾きポーズを左右反転で高速切り替え（移動は停止・足は地面に固定）
        wiggleT--; yOff = 0;
        grid = (fM%8 < 4) ? sp.b : flipH(sp.b);
      } else if(squatT > 0){
        // その場屈伸：しゃがみ↔立ちを周期で切り替え（数回。足は地面に固定して跳ねの浮きを止める）
        squatT--; yOff = 0;
        if(Math.floor((42 - squatT) / 7) % 2 === 1) grid = squatFrame(grid);
      } else {
      if(walkTimer <= 0 && !squatWalkT && !preJumpT && !jumpT && !floatT){
        // 次の行動を決める（実行中のアクションが終わってから）：左へ／右へ／ひとやすみ
        const r = Math.random();
        walkDir = r < 0.34 ? -1 : (r < 0.68 ? 1 : 0);
        if(prof.wiggle && Math.random() < prof.wiggle){
          wiggleT = 22; walkDir = 0;                                                    // 時々その場でモゾモゾ
        } else if(prof.squat && Math.random() < prof.squat){
          squatT = 42; walkDir = 0;                                                     // 時々その場で屈伸
        } else if(prof.squatWalk && walkDir !== 0 && Math.random() < prof.squatWalk){
          squatWalkT = 54;                                                              // 屈伸しながら横移動
        } else if(!isBadWeather()){
          if(prof.float && Math.random() < prof.float) floatT = 44;                     // タコ：浮遊
          else if(prof.jump && Math.random() < prof.jump && floatT === 0) preJumpT = 5; // ジャンプ（まずしゃがんで溜め）
        }
        walkTimer = 25 + Math.floor(Math.random()*35);
      }
      walkTimer--;
      if(preJumpT > 0){
        // ジャンプ前の溜め：しゃがんでから発射
        preJumpT--; yOff = 0; grid = squatFrame(grid);
        if(preJumpT === 0) jumpT = 10;
      } else if(squatWalkT > 0){
        // 屈伸しながら横移動（しゃがみ↔立ちを繰り返しつつ進む）
        squatWalkT--; yOff = 0;
        if(walkDir === 0) walkDir = 1;   // 念のため方向を確保
        if(Math.floor((54 - squatWalkT)/6) % 2 === 1) grid = squatFrame(grid);
        walkX += walkDir * prof.speed * 0.9 * wSpd;
      } else if(floatT > 0){
        // 浮遊：ふわっと上がり漂って降りる
        floatT--;
        const ft = 44 - floatT;
        const lift = ft < 10 ? ft*0.4 : (floatT < 10 ? floatT*0.4 : 4 + Math.sin(fM/4));
        airOff = Math.round(lift);
        walkX += walkDir * prof.speed * 0.6 * wSpd;
      } else if(jumpT > 0){
        // ジャンプ：放物線（跳びながら進む）
        jumpT--;
        airOff = Math.round(Math.sin(Math.PI * (10-jumpT)/10) * prof.jumpH);
        walkX += walkDir * prof.speed * 1.4 * wSpd;
      } else if(walkDir !== 0){
        if(prof.mode === 'hop'){
          // インベーダー：跳ねて進む（着地中は進まない）
          if(hopPause <= 0){ jumpT = 10; hopPause = 5 + Math.floor(Math.random()*6); }
          else hopPause--;
        } else {
          walkX += walkDir * prof.speed * wSpd;
        }
      }
      // 画面端＋オブジェクト（皿・うんち）を壁として扱い、重なりを回避
      const segs = freeSegments(gw);
      if(segs.length){
        let seg = segs.find(([a,b]) => walkX >= a && walkX <= b);
        if(seg){
          if(walkX <= seg[0]){ walkX = seg[0]; walkDir = 1; }   // 区間の左端でバウンド
          if(walkX >= seg[1]){ walkX = seg[1]; walkDir = -1; }  // 右端でバウンド
        } else {
          // 障害物に被っている（オブジェクトが足元に出た等）→ 最寄りの自由区間へ徐々に押し出す
          const near = segs.reduce((best,s)=>{
            const d  = walkX < s[0]  ? s[0]-walkX  : walkX-s[1];
            const bd = walkX < best[0]? best[0]-walkX: walkX-best[1];
            return d < bd ? s : best;
          });
          const target = walkX < near[0] ? near[0] : near[1];
          walkX += Math.sign(target - walkX) * Math.min(0.8, Math.abs(target - walkX));
        }
      }
      }   // ← モゾモゾ中でなければ歩行
    }

    let charX = Math.round(walkX);
    const charY = MAIN_GY - grid.length;   // 屈伸で縮んだフレームでも足元を地面に据える
    if(reactT > 0 && reactType === 'eat') charX = 36 - gw - 2;   // 皿の前に来て食べる

    // 進化演出：点滅＋キラキラ
    let hideChar = false;
    if(evoT > 0){
      evoT--;
      if(evoT%6 < 3) hideChar = true;
      for(let k=0;k<6;k++){
        const sx = charX - 5 + ((fM*7 + k*11) % (gw+10));
        const sy = charY - 5 + ((fM*5 + k*7)  % (gh+8));
        dot(ctxM, sx, sy, DM);
      }
    }
    if(!hideChar) stamp(ctxM, grid, charX+xOff, charY+yOff-airOff, charCol);

    // 食事中の口パクパク（皿側に開けた口の穴が開閉する）
    if(!hideChar && reactT > 0 && reactType === 'eat' && eatLvl > 0){
      const m = EAT_MOUTH[eatKey()];
      if(m){
        dot(ctxM, charX+xOff+m[0], charY+yOff+m[1], BG);                  // 口（閉じ線）
        if(fM%6 >= 3) dot(ctxM, charX+xOff+m[0], charY+yOff+m[1]+1, BG);  // 開いた口
      }
    }

    // ── 皿・汚れオブジェクト ──
    const plateX = 36;                              // 皿は固定位置（キャラが移動するため）
    if(pet.plateSpoiled) drawSpoiledPlate(plateX, MAIN_GY-1, NK, DM);     // 食べ残し（崩れた盛り＋ハエ）
    else if(pet.plateAt) drawFoodPlate(plateX, MAIN_GY-1, 3, NK, DM);     // 残った皿（満杯のまま）
    else if(eatLvl >= 0) drawFoodPlate(plateX, MAIN_GY-1, eatLvl, NK, DM); // 食事中：3口で減って空皿に
    const poopFly = poopHasFlies();
    for(let i=0;i<pet.W && i<POOP_X.length;i++){
      stamp(ctxM, POOP_SPR, POOP_X[i], MAIN_GY-4, NK);          // 足元を地面に接地させる
      if(poopFly) drawFly(POOP_X[i]+2, MAIN_GY-6, i, NK, DM);   // 放置中はハエがたかる
    }

    // ── CLEAN：ほうきが左→右へ掃き、通過した汚れが消える ──
    if(reactT > 0 && reactType === 'clean'){
      const prog = (CLEAN_T - reactT) / CLEAN_T;
      const bx = Math.round(-8 + prog * (W + 16));                  // 画面外左→画面外右
      // まだ掃かれていない汚れ・皿を表示（ほうきの先端が届くまで）
      for(let i=0;i<cleanSnapW && i<POOP_X.length;i++)
        if(POOP_X[i] > bx + 4){
          stamp(ctxM, POOP_SPR, POOP_X[i], MAIN_GY-4, NK);
          if(cleanSnapPoopFly) drawFly(POOP_X[i]+2, MAIN_GY-6, i, NK, DM);
        }
      if(plateX > bx + 4){
        if(cleanSnapSpoiled) drawSpoiledPlate(plateX, MAIN_GY-1, NK, DM);
        else if(cleanSnapPlate) drawFoodPlate(plateX, MAIN_GY-1, 3, NK, DM);
      }
      // ほうき本体（上下に小さく揺れながら進む）
      const by = MAIN_GY - 10 + ((fM%6<3) ? 0 : 1);
      stamp(ctxM, BROOM_SPR, bx, by, NK);
    }

    // ── 感情アイコン（リアクション優先 → 状態駆動。移動に追従し画面内にクランプ） ──
    // 感情アイコン位置：通常はキャラ左上。左に余白が無い（左端）ときはキャラの右側へ回してキャラとの接触を避ける
    // アイコンごとに幅が違う（Zzz・…は8ドット、！は2ドット）ので、
    // 固定オフセットではなくスプライト幅から右端を揃えて一定の隙間を確保する
    const EMO_GAP = 2;                                        // キャラとの隙間（ドット）
    const iconY = charY + yOff - airOff - 3;
    function emo(spr){
      const w = spr[0].length;
      // 通常はキャラの左。左に余白が足りない（画面左端）ときは右側へ回す
      let x = (charX - EMO_GAP - w >= 1) ? (charX - EMO_GAP - w) : (charX + gw + EMO_GAP);
      x = Math.max(1, Math.min(W - w, x));                    // 画面内にクランプ
      stamp(ctxM, spr, x, iconY, NK);
    }
    // 演出アイコンを出すか（quiet時は出さず、下の状態アイコン＝Zzzなどに任せる）
    const showReact = reactT > 0 && !reactQuiet;
    if (reactT > 0) {
      const blink = (fM%8)<5;
      if(blink && showReact){
        if(reactType==='eat'||reactType==='clean')            emo(ICO_NOTE);
        else if(reactType==='heart'||reactType==='cured')     emo(ICO_HEART);
        else if(reactType==='anger'||reactType==='refuse')    emo(ICO_ANGER);
        else if(reactType==='nothing'||reactType==='sad')     emo(ICO_DOTS);
        else if(reactType==='hungry')                         emo(ICO_EXCL);
        else if(reactType==='sick')                           emo(ICO_DROP);
      }
      reactT--;
      // 食事が終わったら、食べる前の位置ではなく画面中央から歩き再開
      if(reactT === 0 && reactType === 'eat'){ walkX = Math.floor((W - gw)/2); walkDir = Math.random()<0.5?-1:1; walkTimer = 0; }
    }
    if (showReact) {
      /* 演出アイコンは上で描画済み */
    } else if (asleep) {
      // 睡眠中：Zzz
      if((fM%30)<24) emo(ICO_ZZZ);
    } else if (isWeak()) {
      // 衰弱：！を速く点滅（SOS）
      if((fM%8)<5) emo(ICO_EXCL);
    } else if (pet.health === 'SICK') {
      // 病気：汗しずく

        if(key==='debug')   { ctxN.fillStyle=debugMode?ON:'#7a7660'; ctxN.fillText(debugMode?T('on'):T('off'), (W-2)*S, (y+1)*S); }
        if(key==='reset')   { ctxN.fillStyle='#7a3a3a'; ctxN.fillText(T('exec'), (W-2)*S, (y+1)*S); }

    } else if (inStatus) {

      ctxN.font=uiFont(7);

      // けんこう度（★0〜4）：おなか・きげんと同じ4段階表示に揃える。
      // 状態が悪化する順に星が減り、手遅れになる前に気づけるようにしてある
      const healthVal =
          pet.dead                ? 0    // おばけ
        : isWeak()                ? 1    // 衰弱（空腹18時間超。あと12時間で死）
        : pet.health==='SICK'     ? 2    // 病気（放置36時間で死）
        : pet.hunger===0          ? 3    // 空腹が続いている（このままだと衰弱）
        :                           4;   // げんき
      const rows=[
        {label:T('hungry'), type:'bar', val:pet.hunger},

        }

        // STATUSに選択項目なし
      } else if(inPlay){

          if(dir==='up')    menuSel = (r===1) ? menuSel-3 : 8;
          if(dir==='down')  menuSel = (r===0) ? menuSel+3 : 6;
        } else {
          if(dir==='up')   menuSel = (menuSel===6) ? 4 : menuSel-1;  // STATUSから上でグリッド下段中央へ

      else inSettings=false;

    else if(inStatus){ inStatus=false; }
