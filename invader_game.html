  const CARE_ORDER  = ['FEED','CLEAN','MED','PET','SCOLD','GAME'];
  // いま押しても何も起きないお世話を返す。MENUではこれを薄い色で描いて、
  //  押せないことが見て分かるようにする（実行側の条件と食い違わないよう、判定はここに集約）
  function careDisabled(act){
    if(!pet.name) return true;                             // 命名前はすべて不可
    if(pet.dead || pet.gone || ufoEnding || departEnding) return true;   // おばけ・エンディング後
    const asleep = effectiveAsleep();
    switch(act){
      case 'FEED':  return plateOnScreen();                // 皿が残っているあいだは出せない
      case 'CLEAN': return !(pet.W > 0 || pet.plateAt || pet.plateSpoiled);   // 片づけるものが無い
      case 'MED':   return asleep || pet.health !== 'SICK';// 就寝中と、病気でないとき
      case 'PET':   return asleep;                         // 寝ているあいだは無反応
      case 'SCOLD': return false;                          // 寝ていても起こせるので常に可
      case 'GAME':  return asleep || pet.health === 'SICK' || pet.hunger <= 1;
    }
    return false;
  }
  const CARE_LABELS = {FEED:'FEED',CLEAN:'CLEAN',MED:'MEDICINE',PET:'PRAISE',SCOLD:'SCOLD',GAME:'MINI GAME'};  // PET=褒める
  let careFlash = 0; // （旧・点滅用。現在未使用）

  // ════════════════════════════════════════
  // お世話アクションの効果とリアクション（企画書§6 状態×アクション）
  // ════════════════════════════════════════
  let reactType = null, reactT = 0;   // 育成画面でのリアクション表示
  let reactFood = 'meal';             // 食事アニメで描く中身（'meal'=ごはん / 'snack'=おやつ）
  // quiet=true のときは演出だけ出し、頭上の感情アイコンは表示しない（睡眠中の掃除など）
  let reactQuiet = false;
  function setReaction(type, t=24, quiet=false){ reactType = type; reactT = t; reactQuiet = quiet; }

  // ── 移動AI（進化段階・系統・性格で歩き方が変わる） ──
  let walkX = null, walkDir = 1, walkTimer = 0;
  let jumpT = 0, floatT = 0, hopPause = 0, preJumpT = 0;
  let jumpDur = 10, jumpHi = 3;   // 今の跳躍の長さ（フレーム）と高さ（ドット）
  let wiggleT = 0;   // その場モゾモゾ（傾きポーズを左右反転で切り替え）
  let squatT = 0;    // その場屈伸（脚を畳んで縮む↔伸びるを繰り返す）
  let squatWalkT = 0; // 屈伸しながら横移動
  let lookT = 0;     // その場で見回す（グレイ）
  let dashT = 0;     // ひと息に走る（グレイ）
  function flipH(g){ return g.map(r=>[...r].reverse()); }
  // しゃがみフレーム：下から2番目の行（脚）を1段抜いて縮める。足元は据え置きで屈伸に見える
  function squatFrame(g){ return (g.length >= 5) ? [...g.slice(0, g.length-2), g[g.length-1]] : g; }
  // 浮遊（マーシャン）：画面中央あたりまでふわりと上がり、左右に漂ってから降りてくる。
  //  tickMain は100msなので、70フレーム＝7秒ほどの動作になる
  const FLOAT_T = 70;                    // 浮遊の総フレーム
  const FLOAT_RISE = 18, FLOAT_FALL = 18;// 上がる／降りるのにかける時間
  const FLOAT_H = 18;                    // 最大の浮き（ドット）。地面から画面中央あたりまで
  const FLOAT_TOP = 10;                  // 頭がこの高さより上に行かないようにする（ヘッダー回避）
  // グレイ：立ち止まって見回す／ひと息に走って急停止。
  //  「活発で知的」を、速さではなく“注意深さと緩急”で表す
  const LOOK_T = 36, LOOK_TURN = 9;                  // 見回す長さと、目を動かす間隔
  const LOOK_SCAN = [-1, 1, -1, 1];                  // 見回すときの目の向き（左→右→左→右）
  const DASH_T = 12, DASH_MUL = 2.2, DASH_STOP = 10; // 走るフレーム数・速度倍率・止まったあとの静止
  // 跳躍（インベーダー）：跳ぶたびに高さを変える。大きく跳ぶと体の中心が画面中央よりやや下まで上がる
  const HOP_H_MAX = 15;                  // 一番大きい跳ね（ドット）
  function hopHeight(base){
    const r = Math.random();
    if(r < 0.55) return base;                                        // ふつうの跳ね
    if(r < 0.85) return base + 2 + Math.floor(Math.random()*3);      // 少し高め
    return HOP_H_MAX - Math.floor(Math.random()*3);                  // ときどき大きく跳ぶ
  }
  // 跳躍を始める。高いほど滞空も長くする（高さの平方根に比例＝放物線らしい伸び方）
  function startJump(prof){
    jumpHi  = (prof.mode === 'hop') ? hopHeight(prof.jumpH) : prof.jumpH;
    jumpDur = Math.max(8, Math.round(8 * Math.sqrt(jumpHi / 3)));
    jumpT   = jumpDur;
  }
  function moveProfile(){
    // speed:ドット/tick, jump:行動決定時のジャンプ率, jumpH:高さ, float:浮遊率, mode:'walk'|'hop'
    let p;
    switch(pet.stage){
      case 'egg':   p = {mode:'walk', speed:0.08, jump:0,    jumpH:0, float:0, wiggle:0.45, squat:0.15}; break;  // 幼少期：時々その場モゾモゾ
      case 'mid':   p = {mode:'walk', speed:0.10, jump:0.05, jumpH:2, float:0, squat:0.15, squatWalk:0.15}; break;
      case 'larva': p = {mode:'walk', speed:0.14, jump:0.06, jumpH:2, float:0, squat:0.18, squatWalk:0.15}; break;
      default: {
        const L = pet.lineage;
        // マーシャン＝のんびり／インベーダー＝基準（ぴょんぴょん）／グレイ＝活発
        if(L==='tako')     p = {mode:'walk', speed:0.09, jump:0.03, jumpH:1, float:0.12, squat:0.15, squatWalk:0.12}; // ときどき浮遊（控えめ）
        else if(L==='inv') p = {mode:'hop',  speed:0.20, jump:0.25, jumpH:3, float:0,    squat:0.10}; // ぴょんぴょん移動
        else               p = {mode:'walk', speed:0.26, jump:0.10, jumpH:2, float:0,    squat:0.12, squatWalk:0.12, look:0.22, dash:0.30}; // 見回して、ひと息に走る
      }
    }
    // 性格補正：やんちゃほど速く・よく跳ね、おっとりほどゆっくり（系統のベース値に掛ける）
    const t = pTrait();
    p.speed *= 1 + t*0.35;
    p.jump   = Math.min(0.5, p.jump * (1 + t*0.6));
    return p;
  }

  function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
  function gainB(n){   // なつき度（日次上限+5）
    if(pet.dayKey !== todayKey()){ pet.dayKey = todayKey(); pet.bGainToday = 0; }
    if(pet.bGainToday < 5){ pet.B = Math.min(100, pet.B + n); pet.bGainToday += n; }
  }
  function schedulePoop(){  // 食後45±30分（DEBUG中は45〜75秒）
    const unit = debugMode ? 1000 : 60000;
    pet.poopAt = Date.now() + (45 + Math.random()*30) * unit;
  }

  // わがまま拒否（Stage2まで）。しつけDが低いほど起きやすい（基準20%）
  function isYoung(){ return pet.stage==='mid' || pet.stage==='larva'; }
  // 大人になってもわがままは残るが、子どものときよりは減る。
  //  おっとりなほど残りやすく、やんちゃなほど早く抜ける
  function tantrumStageMul(){
    if(isYoung()) return 1;
    const t = pTrait();                                 // -1=おっとり … +1=やんちゃ
    return Math.max(0, 0.35 - t*0.25);                  // おっとり0.60 ／ 標準0.35 ／ やんちゃ0.10
  }
  function rollTantrum(type){
    if(type==='snack') return false;                    // おやつは絶対に拒否しない
    if(pet.tantrumAt) return false;
    let chance = Math.min(0.5, Math.max(0.05, 0.2 + (50 - pet.D) * 0.004));
    chance *= 1 + snackSeverity() * 0.8;                             // おやつ漬けだとわがままが出やすい
    // 甘やかしすぎると、つけあがってわがままが増える（甘やかしの唯一のペナルティ）
    const st = careStyle((pet.A||0) / Math.max(1, daysSince(pet.birth)));
    chance = Math.min(0.75, chance * (1 + st.spoil/100 * 0.6));
    chance *= tantrumStageMul();                        // 大人は控えめに（性格で残り方が変わる）
    if(Math.random() < chance){
      pet.tantrumAt = Date.now(); pet.tantrumType = type;
      return true;
    }
    return false;
  }

  // 皿を置いて残す／食事アニメを始める（どちらもごはんとおやつで見た目が変わる）
  function leavePlate(kind){ pet.plateAt = Date.now(); pet.plateKind = kind; }
  function eatReaction(kind){ reactFood = kind; setReaction('eat', EAT_T); }

  // 皿（ごはん／おやつ／食べ残し）が育成画面に出ているか。出ている間は新しく出せない
  function plateOnScreen(){ return !!(pet.plateAt || pet.plateSpoiled); }

  function doCare(act){
    if(pet.dead || pet.gone || ufoEnding || departEnding || !pet.name) return;  // おばけ・帰還後・エンディング後・命名前は世話不可
    if((act==='FEED' || act==='SNACK') && plateOnScreen()) return;  // 皿が残っている間は出せない
    const asleep = effectiveAsleep();
    switch(act){
      case 'FEED':                                                  // ごはん
        pet.mealCount = (pet.mealCount||0) + 1;
        if(asleep){ leavePlate('meal'); }                           // 起こさない。皿を残す（起床後に空腹なら食べる／放置で食べ残し化）
        // わがまま：食べないが、ごはんは出す。皿はそのまま残り、わがままが収まってから食べる
        //  （放置すれば他の拒否と同じく食べ残しとして傷む）
        else if(pet.tantrumAt || rollTantrum('feed')){ leavePlate('meal'); setReaction('refuse'); }
        else if(pet.hunger >= 5){
          if(pTrait() <= -0.5){                                     // おっとり：満腹でも食べてしまう
            pet.fullFeeds++; addA(A_ADJ.feedFull);
            pet.overAcc = (pet.overAcc||0) + 1;
            // 食べ過ぎ：あとから効いてくる。続けるほど当たりやすい
            rollSick(SICK_P.overeat * (1 + overeatSeverity() * SICK_P.overeatMul), true);
            schedulePoop(); eatReaction('meal');
          } else { leavePlate('meal'); }                            // 満腹：無反応で皿だけ残す
            //  ここで嫌がる仕草を出すと、わがままの拒否と区別がつかなくなる
        }
        else {
          if(pet.hunger <= 1) gainB(1);                             // 空腹時に食べさせるとなつく
          note('fed');
          addA(A_ADJ.feedHungry);
          pet.hunger++; schedulePoop(); eatReaction('meal');        // 3口で減っていく食事アニメ
        }
        break;
      case 'SNACK': {                                               // おやつ
        // おなかとごきげんを同時に満たせるが、ごはんより多く与えると
        // わがままが増え、病気にもなりやすくなる（おやつ漬け）。
        const over = snackOveruse();                                // 加算前の状態で判定する
        pet.snackCount = (pet.snackCount||0) + 1;
        if(asleep){ leavePlate('snack'); break; }                   // 起こさない。おやつの皿を残す
        // わがまま中でもおやつは食べる（わがまま自体は解消しない＝しかるまで続く）
        if(pet.hunger < 5) pet.hunger++;
        raiseMood();
        if(over){
          addA(A_ADJ.snackOver); note('snackMany');
          rollSick(SICK_P.snackNow + snackSeverity() * 0.12, true);  // おやつ漬け：しばらくしてから具合が悪くなる
        } else {
          gainB(1);                                                 // 適度なおやつはなかよし度アップ
          note('snack');
          addA(A_ADJ.snackOk);
        }
        markTouch();
        schedulePoop(); eatReaction('snack');
        break;
      }
      case 'CLEAN':
        if(pet.W > 0 || pet.plateAt || pet.plateSpoiled){
          cleanSnapW = pet.W; cleanSnapPlate = !!pet.plateAt; cleanSnapSpoiled = !!pet.plateSpoiled; cleanSnapPoopFly = poopHasFlies(); cleanSnapKind = pet.plateKind;  // 見た目用に退避
          pet.W = 0; pet.plateAt = 0; pet.plateSpoiled = false; pet.poopSince = 0;
          raiseMood();                                              // 汚れを消してから上げるので、病気でなければMAXまで戻せる
          note('cleaned');
          addA(A_ADJ.clean); markTouch();
          setReaction('clean', CLEAN_T, asleep);                    // ほうき掃きアニメ（睡眠中は音符を出さない）
        }
        // 掃除するものが無い時は無反応（退屈マークを出さない）
        break;
      case 'MED':
        // 寝ているあいだは何もしない。以前は寝たまま嫌がる仕草が出ていた
        if(asleep) break;
        // わがまま：くすりも飲まない。しかって聞かせるか、収まるのを待つ
        //  （わがままは最長1時間で自然に解ける。病気の死亡は36時間なので詰みにはならない）
        else if(pet.tantrumAt || rollTantrum('med')){ setReaction('refuse'); }
        else if(pet.health === 'SICK'){
          pet.health = 'GOOD'; pet.sickAcc = 0; pet.sickCount++;    // 治療（回数は進化条件に使用）
          note('cured');
          addA(A_ADJ.med); markTouch();
          setReaction('cured');
        }
        else { if(pet.mood > 0) pet.mood--; setReaction('anger'); } // 健康時は嫌がる
        break;
      case 'PET':  // PRAISE（褒める）
        if(asleep){ /* 睡眠中は無反応（起こさない・効果なし） */ }
        else {
          // 疎遠期は見た目そっけないが、褒めた事実は記録する（続ければ持ち直せるようにするため）
          pet.praiseCount = (pet.praiseCount||0) + 1;
          addA(A_ADJ.praise); markTouch();
          if(isEstranged()){ setReaction('nothing'); }              // 疎遠期：反応しない（…）
          else { raiseMood(); gainB(1); note('praised'); setReaction('heart'); }
        }
        break;
      case 'SCOLD':
        if(asleep){                                                 // 起こしてしまう
          pet.wokeUntil = Date.now() + (debugMode ? 30000 : 600000);
          pet.mood = Math.max(0, pet.mood - 2);
          addP(P_ADJ.wokenUp);                                      // 睡眠を邪魔されて落ち着かなくなる
          pet.scoldBadCount = (pet.scoldBadCount||0) + 1;            // 寝ているのを起こす＝理不尽なしかる
          note('woken');
          addA(A_ADJ.scoldBad);
          setReaction('anger');
        } else if(pet.tantrumAt){                                   // 正当なしかる：しゅんとして従う（わがまま解消）
          pet.tantrumAt = 0; pet.tantrumType = '';
          addD(+5);
          if(pet.mood > 0) pet.mood--;
          addA(A_ADJ.scoldFair); markTouch();   // しつけは甘やかしでも放置でもない（ふれあいには数える）
          setReaction('sad');                                       // 食事は出さない。改めてごはんをあげれば食べる
        } else {                                                    // 不当なしかる
          pet.mood = Math.max(0, pet.mood - 2);
          pet.B = Math.max(0, pet.B - 2);
          addD(-4);
          addP(P_ADJ.scoldBad);
          pet.scoldBadCount = (pet.scoldBadCount||0) + 1;
          addA(A_ADJ.scoldBad); note('scolded');
          setReaction('sad');
        }
        break;
    }
    clampMood();   // 世話の結果その場で病気になった場合も、きげんを上限に合わせる
    savePet();
  }

  // ── おばけ画面（餓死・病死後）：漂うだけ。SETTINGSとリセットのみ操作可 ──
  function drawGhost(BG, DM, NK){
    ctxM.fillStyle = BG; ctxM.fillRect(0,0,W*S,H*S);
    ctxM.font='6px "Press Start 2P"'; ctxM.textBaseline='top'; ctxM.fillStyle=NK;
    ctxM.font=nameFont(6, pet.name); ctxM.textAlign='left';  ctxM.fillText(pet.name||'------', 2*S, 2*S);
    ctxM.font='6px "Press Start 2P"';   // DAYカウントは常にピクセル字体
    ctxM.textAlign='right'; ctxM.fillText(dayLabel(), (W-2)*S, 2*S);
    for(let x=0;x<W;x++) dot(ctxM,x,HEADER_Y,DM);
    for(let x=0;x<W;x++) dot(ctxM,x,MAIN_GY,NK);
    for(let x=0;x<W;x+=3) dot(ctxM,x,MAIN_GY-1,DM);
    STARS_M.forEach(([x,y],i)=>dot(ctxM,x,y+10,(fM+i*9)%28<20?DM:BG));
    const bob = [0,-1,-2,-1][Math.floor(fM/8)%4];
    stamp(ctxM, GHOST_SPR, 22, 34+bob, DM);
    fM++;
  }

  // ── エンディング共通：吸い上げのビームと、小さくなるキャラ ──
  //  ビームはオープニングと同じ「下が広がる三角形」。UFOの少し上を頂点に取り、
  //  真下が細くなりすぎないようにしてある。市松に打って光が透けている感じを出す
  const END_BEAM_APEX = 8;      // 頂点をUFOからどれだけ上に置くか
  const END_BEAM_HALF = 7;      // 地面際の半幅（ここが一番広い）
  // 周囲を一段暗くする。この上から地の明るさで円錐を切り抜くと、光の柱として浮かび上がる
  function dimField(DM){
    for(let y = 0; y < MAIN_GY; y++) for(let x = 0; x < W; x++) dot(ctxM, x, y, DM);
  }
  // ビーム本体。prog=0で出ておらず、1で地面まで届く。
  //  伸ばすときは0→1、消すときは1→0にすると、上から伸びて下から消えていく
  function drawEndBeam(cx, topY, prog, BG){
    const bot = MAIN_GY - 1, apex = topY - END_BEAM_APEX;
    const end = Math.round(topY + (bot - topY) * Math.max(0, Math.min(1, prog)));
    for(let y = topY; y <= end; y++){
      const half = Math.round((y - apex) / (bot - apex) * END_BEAM_HALF);
      for(let dx = -half; dx <= half; dx++) dot(ctxM, cx + dx, y, BG);
    }
  }
  // 最近傍で縮めたスプライトを作る。範囲内に1つでも点があれば打つので、
  //  小さくしても輪郭が消えずにシルエットが残る
  function shrinkGrid(g, sc){
    const h = g.length, w = g[0].length;
    const nh = Math.max(1, Math.round(h * sc)), nw = Math.max(1, Math.round(w * sc));
    const out = [];
    for(let y = 0; y < nh; y++){
      const row = [], y0 = Math.floor(y * h / nh), y1 = Math.max(y0 + 1, Math.floor((y + 1) * h / nh));
      for(let x = 0; x < nw; x++){
        const x0 = Math.floor(x * w / nw), x1 = Math.max(x0 + 1, Math.floor((x + 1) * w / nw));
        let v = 0;
        for(let yy = y0; yy < y1 && !v; yy++) for(let xx = x0; xx < x1; xx++) if(g[yy][xx]){ v = 1; break; }
        row.push(v);
      }
      out.push(row);
    }
    return out;
  }
  // 画面の中心に置くための左端。キャラの配置と同じ式なので、
  //  UFO・ビーム・キャラの縦の軸がすべて同じ列（x=26）に揃う
  function centerX(w){ return Math.floor((W - w) / 2); }
  const END_AXIS = centerX(9) + Math.floor(9/2);        // 揃える中心の列
  // 吸い上げ中のキャラ：p=0で元の大きさ、p=1で END_SHRINK まで縮む。中心は動かさない
  const END_SHRINK = 0.34;
  function stampLifted(grid, cx, y, p, NK, wobble){
    const sp = shrinkGrid(grid, 1 - (1 - END_SHRINK) * p);
    stamp(ctxM, sp, cx - Math.floor(sp[0].length / 2) + (wobble || 0), y, NK);
  }

  // ── UFO帰還エンディング（世話不足）：迎えに来て去る → 新しいたまごへ ──
  function drawUfoEnding(BG, DM, NK){
    ctxM.fillStyle = BG; ctxM.fillRect(0,0,W*S,H*S);
    for(let x=0;x<W;x++) dot(ctxM,x,MAIN_GY,NK);
    for(let x=0;x<W;x+=3) dot(ctxM,x,MAIN_GY-1,DM);
    const t = ufoT, uy = 6;
    const cr = charSprites().rest;
    const ux1 = centerX(UFO_SPR[0].length);               // UFOも画面中央に置く
    const cX = centerX(cr[0].length), cY = MAIN_GY - cr.length;
    const bcx = END_AXIS;                                 // UFO・ビーム・キャラで共通の中心
    const beam = (prog)=>{ dimField(DM); drawEndBeam(bcx, uy+7, prog, BG); };
    if(t < 25){        // UFOが迎えに来る
      const ux = Math.round((W+2) + (ux1-(W+2))*(t/25));
      stamp(ctxM, UFO_SPR, ux, uy, NK);
      stamp(ctxM, cr, cX, cY, NK);
    } else if(t < 40){ // ビームが上から伸びてくる
      beam((t-24)/15);        // t=39 でちょうど地面に届く
      stamp(ctxM, UFO_SPR, ux1, uy, NK);
      stamp(ctxM, cr, cX, cY, NK);
    } else if(t < 60){ // 吸い上げ（振り返らない）。昇るにつれて小さくなる
      beam(1);
      stamp(ctxM, UFO_SPR, ux1, uy, NK);
      const p = (t-40)/20;
      stampLifted(cr, bcx, Math.round(cY + (uy+7-cY)*p), p, NK, 0);
    } else if(t < 72){ // ビームが下から消えていく
      beam(1 - (t-59)/12);    // t=71 でちょうど消え切る
      stamp(ctxM, UFO_SPR, ux1, uy, NK);
    } else if(t < 92){ // 去る
      const p = (t-72)/20;
      stamp(ctxM, UFO_SPR, Math.round(ux1+(W+6-ux1)*p), Math.round(uy-10*p), NK);
    } else {           // 別れの言葉
      ctxM.font='7px "Press Start 2P"'; ctxM.fillStyle=NK;
      ctxM.textAlign='center'; ctxM.textBaseline='top';
      ctxM.fillText('GOODBYE...',(W*S)/2, 28*S);
    }
    ufoT++;
    if(ufoT >= 130){
      // 終了 → 「いなくなったあと」の画面で止める。
      //  すぐ次の子が来ると、いなくなったことが流されてしまう。
      //  最後の日記を読み返す時間を残し、ALL RESET を押すまでこのまま。
      pet.gone = true; pet.goneBy = 'return'; pet.ufoFlag = false;
      ufoEnding = false; ufoT = 0;
      savePet();
    }
  }

  // ── 帰還したあと：主のいない庭 ──
  //  日記マークは残るので、ヘッダーから最後のことばを読み返せる
  function drawGone(BG, DM, NK){
    ctxM.fillStyle = BG; ctxM.fillRect(0,0,W*S,H*S);
    ctxM.font='6px "Press Start 2P"'; ctxM.textBaseline='top'; ctxM.fillStyle=NK;
    ctxM.font=nameFont(6, pet.name); ctxM.textAlign='left';  ctxM.fillText(pet.name||'------', 2*S, 2*S);
    ctxM.font='6px "Press Start 2P"';
    ctxM.textAlign='right'; ctxM.fillText(dayLabel(), (W-2)*S, 2*S);
    // 未読の日記（別れのことば）があるあいだは、ヘッダーのノートを点滅させる
    if(diaryUnread > 0){
      const IX = 90, IY = 8;
      if(diarySelActive){ ctxM.fillStyle = DM; ctxM.fillRect(IX-3, IY-3, 13, 14); }
      if(diarySelActive || fM%16 < 10) stampPx(ctxM, DIARY_ICON, IX, IY, NK);
    } else if(diarySelActive) diarySelActive = false;
    for(let x=0;x<W;x++) dot(ctxM,x,HEADER_Y,DM);
    STARS_M.forEach(([x,y],i)=>dot(ctxM,x,y+10,(fM+i*9)%28<20?DM:BG));
    // 演出で出した言葉を、リセットするまで残す。
    //  点滅はさせない。もう変化しない画面だと分かるように、静かに置いておく
    const msg = pet.goneBy==='depart' ? 'THANK YOU!' : (pet.goneBy==='return' ? 'GOODBYE...' : '');
    if(msg){
      ctxM.font='7px "Press Start 2P"'; ctxM.fillStyle=NK;
      ctxM.textAlign='center'; ctxM.textBaseline='top';
      ctxM.fillText(msg,(W*S)/2, 32*S);
    }
    for(let x=0;x<W;x++) dot(ctxM,x,MAIN_GY,NK);
    for(let x=0;x<W;x+=3) dot(ctxM,x,MAIN_GY-1,DM);
    fM++;
  }

  // ── 旅立ちエンディング（E4・ハッピー）：仲間の艦隊が迎えに来る大団円 ──
  function drawDepartEnding(BG, DM, NK){
    ctxM.fillStyle = BG; ctxM.fillRect(0,0,W*S,H*S);
    for(let x=0;x<W;x++) dot(ctxM,x,MAIN_GY,NK);
    for(let x=0;x<W;x+=3) dot(ctxM,x,MAIN_GY-1,DM);
    STARS_M.forEach(([x,y],i)=>dot(ctxM,x,y+10,(fM+i*9)%28<20?DM:BG));
    const t = departT, uy = 5;
    const cr = charSprites().a;
    const uxC = centerX(UFO_SPR[0].length);               // 中央の1機を画面中央に置く
    const cX = centerX(cr[0].length), cY = MAIN_GY - cr.length;
    const bcx = END_AXIS;                                 // UFO・ビーム・キャラで共通の中心
    const beam = (prog)=>{ dimField(DM); drawEndBeam(bcx, uy+9, prog, BG); };
    const fleet = (p)=>{   // 3機の艦隊（中央大＋左右）
      const ux = Math.round((W+4) + (uxC-(W+4))*p);
      stamp(ctxM, UFO_SPR, ux, uy, NK);
      stamp(ctxM, UFO_SPR, ux-16, uy+6, NK);
      stamp(ctxM, UFO_SPR, ux+16, uy+6, NK);
    };
    if(t < 30){        // 艦隊が迎えに来る
      fleet(t/30);
      stamp(ctxM, cr, cX, cY, NK);
    } else if(t < 55){ // キャラが跳ねて喜ぶ＋ハート
      fleet(1);
      stamp(ctxM, cr, cX, cY + ((t%8<4)?-2:0), NK);
      if(t%10<7) stamp(ctxM, ICO_HEART, cX-6, cY-4, NK);
    } else if(t < 70){ // ビームが上から伸びてくる
      beam((t-54)/15);        // t=69 でちょうど地面に届く
      fleet(1);
      stamp(ctxM, cr, cX, cY, NK);
    } else if(t < 95){ // ビームで昇っていく（手を振る＝小刻み揺れ）。昇るにつれて小さくなる
      beam(1); fleet(1);
      const p = (t-70)/25;
      stampLifted(cr, bcx, Math.round(cY + (uy+9-cY)*p), p, NK, (t%4<2)?-1:1);
    } else if(t < 107){ // ビームが下から消えていく
      beam(1 - (t-94)/12);    // t=106 でちょうど消え切る
      fleet(1);
    } else if(t < 132){ // 艦隊が去る
      const p = (t-107)/25;
      const ux = Math.round(uxC + (W+6-uxC)*p), uy2 = Math.round(uy - 12*p);
      stamp(ctxM, UFO_SPR, ux, uy2, NK);
      stamp(ctxM, UFO_SPR, ux-16, uy2+6, NK);
      stamp(ctxM, UFO_SPR, ux+16, uy2+6, NK);
    } else {           // 感謝のメッセージ
      ctxM.font='7px "Press Start 2P"'; ctxM.fillStyle=NK;
      ctxM.textAlign='center'; ctxM.textBaseline='top';
      ctxM.fillText('THANK YOU!',(W*S)/2, 24*S);
      if(departT%10<7) stamp(ctxM, ICO_HEART, Math.floor(W/2)-2, 34, NK);
    }
    departT++;
    if(departT >= 160){
      // 帰還エンド（E3）と同じく、演出のあとは「いなくなったあと」で止める。
      //  次の子は ALL RESET を押すまで来ない
      pet.gone = true; pet.goneBy = 'depart'; pet.departFlag = false;
      departEnding = false; departT = 0;
      savePet();
    }
  }

  // ════════════════════════════════════════
  // 到着演出：新規ゲーム開始時、画面中央上からのビームでNEWBORNが降りてくる
  //  UFOの機体は映さず、ビームだけを見せる（オープニングでUFOは描き終えているため）
  // ════════════════════════════════════════
  const ARR_BEAM_TOP = HEADER_Y + 1;            // 描き始め（ヘッダーの区切り線の直下）
  const ARR_APEX = -18;                         // 円錐の頂点。ヘッダーのさらに上に置き、頂点側をしっかり隠す
  const ARR_MAX_HALF = 13;                      // 地面際の半幅（照射角の広さ）
  const ARR_CX = Math.floor(W/2);               // 中央
  // ①周囲が暗くなる ②ビーム下降 ③キャラ降下 ④着地の間 ⑤ビーム上昇 ⑥明るさが戻る
  //   ①と⑥はフェードせず一瞬で切り替わるので、間（ま）として短く取るだけ
  const ARR_PH = [6, 16, 26, 10, 18, 6];
  const ARR_TOTAL = ARR_PH.reduce((a,b)=>a+b,0);
  let arriveT = -1;                             // -1=演出なし。0以上で再生中
  function startArrival(){
    arriveT = 0;
    // 育成画面のキャンバスには、直前まで tickMain が描いていた「たまごが居る通常画面」が
    // 残っている。表示を切り替えた瞬間にそれが一瞬見えてしまうので、
    // ここで演出の1コマ目（暗転）を描いてから見せる。
    const c = getColors();
    drawArrival(c.bg, c.dim, c.on);
    arriveT = 0;                      // drawArrival が進めたぶんを戻す
  }
  function arrivalPhase(){
    let r = arriveT;
    for(let p=0;p<ARR_PH.length;p++){ if(r < ARR_PH[p]) return {ph:p, t:r/ARR_PH[p]}; r -= ARR_PH[p]; }
    return {ph:ARR_PH.length-1, t:1};
  }
  // 周囲の暗転：ビームとは独立に、フィールド全体を一段暗く塗る（フェードはせず一気に切り替える）
  function drawArrivalDark(DM){
    for(let y=ARR_BEAM_TOP; y<=MAIN_GY-1; y++){
      for(let x=0;x<W;x++) dot(ctxM, x, y, DM);
    }
  }
  // ビーム：頂点(ARR_APEX)から下へ広がる円錐のうち、区切り線より下だけを描く。
  //   頂点はヘッダーの奥に隠れるため、見えるのは幅を持った切り口から始まる。
  //   暗転したフィールドを地の明るさで切り抜くので、光の柱として浮かび上がる。
  //   progress=0..1 で下端が伸縮する。
  function drawArrivalBeam(progress, BG){
    const botY = MAIN_GY-1, maxHalf = ARR_MAX_HALF;
    const end = Math.round(ARR_BEAM_TOP + (botY-ARR_BEAM_TOP)*progress);
    for(let y=ARR_BEAM_TOP; y<=end; y++){
      const half = Math.round(((y-ARR_APEX)/(botY-ARR_APEX)) * maxHalf);
      for(let dx=-half; dx<=half; dx++) dot(ctxM, ARR_CX+dx, y, BG);
    }
  }
  // ── 背景一式（下地・名前/日数・区切り線・天体・天気・地面）──
  //    通常の育成画面と到着演出の両方で使う。
  //    hideSky=true で天体・天気を省く（到着演出はビームだけを見せたいので出さない）
  function drawMainBackdrop(BG, DM, NK, hideSky){
    ctxM.fillStyle = BG; ctxM.fillRect(0,0,W*S,H*S);

    // 名前と日数（未命名時は NAME:???? の????を黒/薄緑で点滅。十字上で選択→Aで命名画面へ）
    ctxM.font='6px "Press Start 2P"';
    ctxM.textBaseline='top'; ctxM.textAlign='left';
    if(pet.name){
      ctxM.font=nameFont(6, pet.name); ctxM.fillStyle=NK; ctxM.fillText(pet.name, 2*S, 2*S);
    } else if(nameSelActive){
      // 選択中：黒塗り帯に白抜き（反転）で明示
      for(let dx=1;dx<17;dx++) for(let dy=1;dy<5;dy++) dot(ctxM,dx,dy,NK);
      ctxM.fillStyle=BG; ctxM.fillText('NAME:????', 2*S, 2*S);
    } else {
      ctxM.fillStyle=NK; ctxM.fillText('NAME:', 2*S, 2*S);
      ctxM.fillStyle=(fM%10<5) ? NK : DM;
      ctxM.fillText('????', 2*S + 30, 2*S);   // 'NAME:'=5文字×6px
    }
    ctxM.font='6px "Press Start 2P"';   // DAYカウントは常にピクセル字体（名前がかなでも影響させない）
    ctxM.fillStyle=NK;
    ctxM.textAlign='right'; ctxM.fillText(dayLabel(),  (W-2)*S, 2*S);
    // 名前と日数のあいだに日記マーク。未読のあいだは点滅する（十字上で選択→Aで開く）
    if(diaryUnread > 0){                          // 読み終わると消える（読み返すのは MENU→DIARY）
      const IX = 90, IY = 8;                      // px。名前と日数のあいだ、文字の高さに揃える
      if(diarySelActive){                         // 選択中は薄色の枠で囲む
        ctxM.fillStyle = DM; ctxM.fillRect(IX-3, IY-3, 13, 14);
      }
      if(diarySelActive || fM%16 < 10) stampPx(ctxM, DIARY_ICON, IX, IY, NK);
    } else if(diarySelActive) diarySelActive = false;
    for(let x=0;x<W;x++) dot(ctxM,x,HEADER_Y,DM);

    // ── 天体（右上） ──
    if (hideSky) {
      /* 到着演出中は天体も天気も出さない */
    } else if (weather === 'cloudy' || weather === 'rain') {
      // 曇り・雨の日は空が雲に覆われているので、太陽も月も星も出さない。
      //  ただし曇りの夜だけ、雲の切れ間をUFOがよぎることがある（雲はこのあと上から描かれる）
      if (weather === 'cloudy' && timeOfDay === 'night') updateNightUfo(DM);
    } else if (timeOfDay==='night') {
      STARS_M.forEach(([x,y],i)=>dot(ctxM,x,y+10,(fM+i*9)%28<20?DM:BG));
      stamp(ctxM, MOON, W-10, 11, NK);
      // 晴れた夜だけ、まれに流れ星
      if (weather === 'clear') updateShootingStar(NK, DM);
    } else if (!isBadWeather()) {
      stamp(ctxM, SUN, W-13, 10, NK);
    }

    // ── 天気エフェクト ──
    if (hideSky) {
      /* 到着演出中は出さない */
    } else if (weather === 'rain') {
      updateRain(BG, DM);               // 雨の日は雲を出さず、雨粒だけで空を表す
    } else if (weather === 'snow') {
      updateSnow(BG, DM);
    } else if (weather === 'cloudy') {
      drawClouds(CLOUD_N, DM);
    }

    // 地面（下部お世話バーのぶん上げる）
    for(let x=0;x<W;x++) dot(ctxM,x,MAIN_GY,NK);
    for(let x=0;x<W;x+=3) dot(ctxM,x,MAIN_GY-1,DM);
  }

  // 暗転で潰れた地面の点線を描き直す
  function drawArrivalGround(DM){
    for(let x=0;x<W;x+=3) dot(ctxM, x, MAIN_GY-1, DM);
  }
  function drawArrival(BG, DM, NK){
    // 名前・日数は出すが、天体・天気は演出中は出さない（ビームに集中させる）
    drawMainBackdrop(BG, DM, NK, true);

    const spr = EGG_A, gw = spr[0].length, gh = spr.length;
    const charX = ARR_CX - Math.floor(gw/2);
    const landY = MAIN_GY - gh;                 // 着地位置（足元が地面に接する）
    const {ph,t} = arrivalPhase();

    if(ph===0){                                  // ①周囲が暗くなる（一瞬で暗転し、そのまま少し置く）
      drawArrivalDark(DM);
      drawArrivalGround(DM);
    } else if(ph===1){                           // ②暗転した中をビームが下りてくる
      drawArrivalDark(DM);
      drawArrivalBeam(easeOut(t), BG);
      drawArrivalGround(DM);
    } else if(ph===2){                           // ③ビームの中をたまごが降りてくる
      drawArrivalDark(DM);
      drawArrivalBeam(1, BG);
      drawArrivalGround(DM);
      const y = Math.round(ARR_BEAM_TOP + (landY-ARR_BEAM_TOP)*easeOut(t));
      stamp(ctxM, spr, charX, y, NK);
    } else if(ph===3){                           // ④着地して少し止まる
      drawArrivalDark(DM);
      drawArrivalBeam(1, BG);
      drawArrivalGround(DM);
      stamp(ctxM, spr, charX, landY, NK);
    } else if(ph===4){                           // ⑤ビームが上がって消える
      drawArrivalDark(DM);
      const p = 1-easeOut(t);
      if(p>0) drawArrivalBeam(p, BG);
      drawArrivalGround(DM);
      stamp(ctxM, spr, charX, landY, NK);
    } else {                                     // ⑥明るさが戻る（暗転を解くだけ）
      drawArrivalGround(DM);
      stamp(ctxM, spr, charX, landY, NK);
    }

    fM++;                                        // ????の点滅・雲や雨の動きを演出中も進める
    arriveT++;
    if(arriveT >= ARR_TOTAL){ arriveT = -1; }    // 終了 → そのまま育成画面へ
  }

  let fM=0;
  function tickMain(){
    advancePet();   // リアルタイム進行（1分単位で処理）
    if(!debugMode) timeOfDay = getTimeOfDay();   // 実時刻に追従（DEBUG中はサイクル優先）
    const col = getColors();
    const BG  = col.bg, DM = col.dim, NK = col.on;
    if(pet.departFlag && !departEnding && !pet.dead){ departEnding = true; departT = 0; }  // 旅立ちの日
    if(departEnding){ drawDepartEnding(BG, DM, NK); return; }  // 旅立ちエンディング再生中
    if(ufoEnding){ drawUfoEnding(BG, DM, NK); return; }   // 帰還エンディング再生中
    if(pet.dead){ drawGhost(BG, DM, NK); return; }        // おばけ状態
    if(pet.gone){ drawGone(BG, DM, NK); return; }         // 帰還したあと（主のいない庭）
    if(arriveT >= 0){ drawArrival(BG, DM, NK); return; }  // 到着演出（新規ゲーム開始時）
    // 睡眠判定（しかられて起きた直後は起きている。DEBUG中は表示時間帯に連動）
    const asleep = effectiveAsleep();

    drawMainBackdrop(BG, DM, NK);


    // ── キャラクター（段階別スプライト。睡眠・衰弱・病気・天気で振る舞い変化） ──
    const sp = charSprites();
    let yOff=0, grid, bounceSpeed=30, bounceAmt=1;
    let charCol = NK;
    if (asleep) {
      // 睡眠中：丸まって動かない（閉眼スプライト）
      grid = sp.sleep;
      yOff = 0;
    } else if (isWeak()) {
      // 衰弱：薄い色でぐったり動かない
      grid = sp.rest; yOff = 0; charCol = DM;
    } else if (pet.health === 'SICK') {
      // 病気：丸まってゆっくり上下。目は就寝時と同じ閉じ線
      grid = sickSprite(sp);
      yOff = (fM%40<20) ? 0 : 1;
    } else if (isBadWeather()) {
      // 雨・雪：動きが遅く、足縮め
      bounceSpeed=60; bounceAmt=1;
      grid = sp.rest;
      yOff = (fM%bounceSpeed)<(bounceSpeed/2)?0:bounceAmt;
    } else if (weather==='cloudy') {
      // 曇り：少しゆっくり
      bounceSpeed=40;
      grid = (fM%50)<25?sp.a:sp.b;
      yOff = (fM%bounceSpeed)<(bounceSpeed/2)?0:bounceAmt;
    } else {
      // 晴れ：元気よく歩く。連続バウンドはやめ、時々しゃがんでからポンと跳ねる（頻度控えめ）
      grid = (fM%50)<25?sp.a:sp.b;
      const bp = fM % 42;                                  // バウンド周期（従来25→42で頻度減）
      if(bp < 3){ grid = squatFrame(grid); yOff = 0; }     // まず屈伸で溜め（足は接地）
      else if(bp < 8){ yOff = -2; }                        // ポンと浮く
      else { yOff = 0; }                                   // それ以外は接地して歩く
    }

    // ── リアクションによるポーズ上書き ──
    let xOff=0;
    let eatLvl = -1;   // 食事中の残量（3→2→1→0）
    if(reactT > 0){
      if(reactType==='eat'){
        eatLvl = Math.max(0, 3 - Math.floor((EAT_T - reactT)/15));
        if(eatLvl > 0){
          grid = eatSprite();                                            // 目が皿の方（右）を向く
          yOff = (fM%6<3) ? -1 : 0;                                      // 食べている間は小さく揺れる
        } else { yOff = 0; }
      }
      else if(reactType==='refuse'||reactType==='anger'){ xOff=(fM%4<2)?-1:1; }  // 首振り/イヤイヤ
      else if(reactType==='sad'){ grid = sp.rest; yOff = 0; }             // しゅん
    }

    // ── 移動AI：歩き回る・ジャンプ・浮遊（タコ）・ぴょんぴょん（インベーダー） ──
    const gw = grid[0].length, gh = grid.length;
    const minX = 1, maxX = W - gw - 1;
    if(walkX === null) walkX = Math.floor((W - gw)/2);
    walkX = Math.max(minX, Math.min(maxX, walkX));   // 進化でサイズが変わった時のクランプ
    const moving = !(asleep || isWeak() || pet.health==='SICK' || reactT>0 || evoT>0);
    let airOff = 0;   // ジャンプ/浮遊の上方向オフセット
    if(moving){
      const prof = moveProfile();
      const wSpd = isBadWeather() ? 0.35 : (weather==='cloudy' ? 0.7 : 1);
      if(wiggleT > 0){
        // その場モゾモゾ：傾きポーズを左右反転で高速切り替え（移動は停止・足は地面に固定）
        wiggleT--; yOff = 0;
        grid = (fM%8 < 4) ? sp.b : flipH(sp.b);
      } else if(squatT > 0){
        // その場屈伸：しゃがみ↔立ちを周期で切り替え（数回。足は地面に固定して跳ねの浮きを止める）
        squatT--; yOff = 0;
        if(Math.floor((42 - squatT) / 7) % 2 === 1) grid = squatFrame(grid);
      } else {
      if(walkTimer <= 0 && !squatWalkT && !preJumpT && !jumpT && !floatT && !lookT && !dashT){
        // 次の行動を決める（実行中のアクションが終わってから）：左へ／右へ／ひとやすみ
        const r = Math.random();
        walkDir = r < 0.34 ? -1 : (r < 0.68 ? 1 : 0);
        if(prof.look && Math.random() < prof.look){
          lookT = LOOK_T; walkDir = 0;                                                  // グレイ：立ち止まって見回す
        } else if(prof.wiggle && Math.random() < prof.wiggle){
          wiggleT = 22; walkDir = 0;                                                    // 時々その場でモゾモゾ
        } else if(prof.squat && Math.random() < prof.squat){
          squatT = 42; walkDir = 0;                                                     // 時々その場で屈伸
        } else if(prof.squatWalk && walkDir !== 0 && Math.random() < prof.squatWalk){
          squatWalkT = 54;                                                              // 屈伸しながら横移動
        } else if(prof.dash && walkDir !== 0 && Math.random() < prof.dash){
          dashT = DASH_T;                                                               // グレイ：ひと息に走る
        } else if(!isBadWeather()){
          if(prof.float && Math.random() < prof.float) floatT = FLOAT_T;               // マーシャン：浮遊
          else if(prof.jump && Math.random() < prof.jump && floatT === 0) preJumpT = 5; // ジャンプ（まずしゃがんで溜め）
        }
        walkTimer = 25 + Math.floor(Math.random()*35);
      }
      walkTimer--;
      if(preJumpT > 0){
        // ジャンプ前の溜め：しゃがんでから発射
        preJumpT--; yOff = 0; grid = squatFrame(grid);
        if(preJumpT === 0) startJump(prof);
      } else if(lookT > 0){
        // 見回す：その場で目だけを左右に動かす。
        //  グレイのドット絵は左右対称なので、体を反転しても見た目が変わらない（目を動かす必要がある）
        lookT--; yOff = 0;
        grid = shiftEyes(sp, grid, LOOK_SCAN[Math.floor((LOOK_T - lookT) / LOOK_TURN) % LOOK_SCAN.length]);
      } else if(dashT > 0){
        // ダッシュ：ひと息に走り、終わりはぴたりと止まってしばらく動かない
        dashT--;
        grid = shiftEyes(sp, grid, walkDir);          // 走っている方向へ目を寄せる
        walkX += walkDir * prof.speed * DASH_MUL * wSpd;
        if(dashT === 0){ walkDir = 0; walkTimer = Math.max(walkTimer, DASH_STOP); }
      } else if(squatWalkT > 0){
        // 屈伸しながら横移動（しゃがみ↔立ちを繰り返しつつ進む）
        squatWalkT--; yOff = 0;
        if(walkDir === 0) walkDir = 1;   // 念のため方向を確保
        if(Math.floor((54 - squatWalkT)/6) % 2 === 1) grid = squatFrame(grid);
        walkX += walkDir * prof.speed * 0.9 * wSpd;
      } else if(floatT > 0){
        // 浮遊：ふわりと上がって画面中央あたりで漂い、ゆっくり降りてくる
        floatT--;
        const ft = FLOAT_T - floatT;                            // 経過フレーム
        let lift;
        if(ft <= FLOAT_RISE)          lift = FLOAT_H * easeOut(ft / FLOAT_RISE);
        else if(floatT <= FLOAT_FALL) lift = FLOAT_H * easeOut(floatT / FLOAT_FALL);
        else                          lift = FLOAT_H + Math.sin(fM/6) * 1.2;   // 高いところで上下にたゆたう
        airOff = Math.min(Math.round(lift), MAIN_GY - gh - FLOAT_TOP);
        // 左右にふわふわ漂う（決めた進行方向へわずかに流れる）
        walkX += (Math.sin(ft * 0.16) * 0.55 + walkDir * prof.speed * 0.2) * wSpd;
      } else if(jumpT > 0){
        // ジャンプ：放物線（跳びながら進む）
        jumpT--;
        airOff = Math.round(Math.sin(Math.PI * (jumpDur-jumpT)/jumpDur) * jumpHi);
        airOff = Math.min(airOff, MAIN_GY - gh - FLOAT_TOP);   // 頭がヘッダーに掛からないよう止める
        walkX += walkDir * prof.speed * 1.4 * wSpd;
      } else if(walkDir !== 0){
        if(prof.mode === 'hop'){
          // インベーダー：跳ねて進む（着地中は進まない）
          if(hopPause <= 0){ startJump(prof); hopPause = 5 + Math.floor(Math.random()*6); }
          else hopPause--;
        } else {
          walkX += walkDir * prof.speed * wSpd;
        }
      }
      // 画面端＋オブジェクト（皿・うんち）を壁として扱い、重なりを回避
      const segs = freeSegments(gw);
      if(segs.length){
        let seg = segs.find(([a,b]) => walkX >= a && walkX <= b);
        if(seg){
          if(walkX <= seg[0]){ walkX = seg[0]; walkDir = 1; }   // 区間の左端でバウンド
          if(walkX >= seg[1]){ walkX = seg[1]; walkDir = -1; }  // 右端でバウンド
        } else {
          // 障害物に被っている（オブジェクトが足元に出た等）→ 最寄りの自由区間へ徐々に押し出す
          const near = segs.reduce((best,s)=>{
            const d  = walkX < s[0]  ? s[0]-walkX  : walkX-s[1];
            const bd = walkX < best[0]? best[0]-walkX: walkX-best[1];
            return d < bd ? s : best;
          });
          const target = walkX < near[0] ? near[0] : near[1];
          walkX += Math.sign(target - walkX) * Math.min(0.8, Math.abs(target - walkX));
        }
      }
      }   // ← モゾモゾ中でなければ歩行
    }

    let charX = Math.round(walkX);
    const charY = MAIN_GY - grid.length;   // 屈伸で縮んだフレームでも足元を地面に据える
    if(reactT > 0 && reactType === 'eat') charX = 36 - gw - 2;   // 皿の前に来て食べる

    // 進化演出：点滅＋キラキラ
    let hideChar = false;
    if(evoT > 0){
      evoT--;
      if(evoT%6 < 3) hideChar = true;
      for(let k=0;k<6;k++){
        const sx = charX - 5 + ((fM*7 + k*11) % (gw+10));
        const sy = charY - 5 + ((fM*5 + k*7)  % (gh+8));
        dot(ctxM, sx, sy, DM);
      }
    }
    if(!hideChar) stamp(ctxM, grid, charX+xOff, charY+yOff-airOff, charCol);

    // 食事中の口パクパク（皿側に開けた口の穴が開閉する）
    if(!hideChar && reactT > 0 && reactType === 'eat' && eatLvl > 0){
      const m = EAT_MOUTH[eatKey()];
      if(m){
        dot(ctxM, charX+xOff+m[0], charY+yOff+m[1], BG);                  // 口（閉じ線）
        if(fM%6 >= 3) dot(ctxM, charX+xOff+m[0], charY+yOff+m[1]+1, BG);  // 開いた口
      }
    }

    // ── 皿・汚れオブジェクト ──
    const plateX = 36;                              // 皿は固定位置（キャラが移動するため）
    if(pet.plateSpoiled) drawSpoiledPlate(plateX, MAIN_GY-1, NK, DM, pet.plateKind);     // 食べ残し（崩れた盛り＋ハエ）
    else if(pet.plateAt) drawFoodPlate(plateX, MAIN_GY-1, 3, NK, DM, pet.plateKind);     // 残った皿（満杯のまま）
    else if(eatLvl >= 0) drawFoodPlate(plateX, MAIN_GY-1, eatLvl, NK, DM, reactFood);    // 食事中：3口で減って空皿に
    const poopFly = poopHasFlies();
    for(let i=0;i<pet.W && i<POOP_X.length;i++){
      stamp(ctxM, POOP_SPR, POOP_X[i], MAIN_GY-4, NK);          // 足元を地面に接地させる
      if(poopFly) drawFly(POOP_X[i]+2, MAIN_GY-6, i, NK, DM);   // 放置中はハエがたかる
    }

    // ── CLEAN：汚れが左から順に消えて、消えた場所にキラキラが弾ける ──
    if(reactT > 0 && reactType === 'clean'){
      const prog = (CLEAN_T - reactT) / CLEAN_T;                    // 0→1
      // 掃除前にあった汚れを左から並べる（消える順を決めるため）
      const items = [];
      for(let i=0;i<cleanSnapW && i<POOP_X.length;i++)
        items.push({kind:'poop', i, x:POOP_X[i], cx:POOP_X[i]+2});
      if(cleanSnapPlate || cleanSnapSpoiled)
        items.push({kind:'plate', cx:plateX + (foodW(cleanSnapKind)>>1)});
      items.sort((a,b)=>a.cx-b.cx);
      items.forEach((it,k)=>{
        const gone = 0.12 + k * 0.5 / Math.max(1, items.length);    // 消える瞬間（左から順に）
        if(prog < gone){
          if(it.kind==='poop'){
            stamp(ctxM, POOP_SPR, it.x, MAIN_GY-4, NK);
            if(cleanSnapPoopFly) drawFly(it.cx, MAIN_GY-6, it.i, NK, DM);
          } else if(cleanSnapSpoiled){
            drawSpoiledPlate(plateX, MAIN_GY-1, NK, DM, cleanSnapKind);
          } else {
            drawFoodPlate(plateX, MAIN_GY-1, 3, NK, DM, cleanSnapKind);
          }
        } else {
          drawSparkle(it.cx, MAIN_GY-4, (prog-gone)/0.4, NK, DM);   // 消えた跡でキラキラ
        }
      });
      // 仕上げに小さな輝きを散らす（掃除が終わった気持ちよさを出す）
      SPARKLE_DUST.forEach(([sx,sy,delay])=>{
        drawSparkle(sx, sy, (prog-delay)/0.45, DM, DM);
      });
    }

    // ── 感情アイコン（リアクション優先 → 状態駆動。移動に追従し画面内にクランプ） ──
    // ハート・音符は「世話をした時の反応」としてだけ出す。
    // ごきげんな間ずっと出していると常時表示になってしまうので、状態駆動からは外してある。
    // 感情アイコン位置：通常はキャラ左上。左に余白が無い（左端）ときはキャラの右側へ回してキャラとの接触を避ける
    // アイコンごとに幅が違う（Zzz・…は8ドット、！は2ドット）ので、
    // 固定オフセットではなくスプライト幅から右端を揃えて一定の隙間を確保する
    const EMO_GAP = 2;                                        // キャラとの隙間（ドット）
    const iconY = charY + yOff - airOff - 3;
    function emo(spr){
      const w = spr[0].length;
      // 通常はキャラの左。左に余白が足りない（画面左端）ときは右側へ回す
      let x = (charX - EMO_GAP - w >= 1) ? (charX - EMO_GAP - w) : (charX + gw + EMO_GAP);
      x = Math.max(1, Math.min(W - w, x));                    // 画面内にクランプ
      stamp(ctxM, spr, x, iconY, NK);
    }
    // 演出アイコンを出すか（quiet時は出さず、下の状態アイコン＝Zzzなどに任せる）
    const showReact = reactT > 0 && !reactQuiet;
    if (reactT > 0) {
      const blink = (fM%8)<5;
      if(blink && showReact){
        if(reactType==='eat'||reactType==='clean')            emo(ICO_NOTE);
        else if(reactType==='heart'||reactType==='cured')     emo(ICO_HEART);
        else if(reactType==='anger'||reactType==='refuse')    emo(ICO_ANGER);
        else if(reactType==='nothing'||reactType==='sad')     emo(ICO_DOTS);
        else if(reactType==='hungry')                         emo(ICO_EXCL);
        else if(reactType==='sick')                           emo(ICO_DROP);
      }
      reactT--;
      // 食事が終わったら、食べる前の位置ではなく画面中央から歩き再開
      if(reactT === 0 && reactType === 'eat'){ walkX = Math.floor((W - gw)/2); walkDir = Math.random()<0.5?-1:1; walkTimer = 0; }
    }
    if (showReact) {
      /* 演出アイコンは上で描画済み */
    } else if (asleep) {
      // 睡眠中：Zzz
      if((fM%30)<24) emo(ICO_ZZZ);
    } else if (isWeak()) {
      // 衰弱：！を速く点滅（SOS）
      if((fM%8)<5) emo(ICO_EXCL);
    } else if (pet.health === 'SICK') {
      // 病気：汗しずく
      if((fM%16)<10) emo(ICO_DROP);
    } else if (pet.hunger <= 1) {
      // 空腹：！を点滅（世話の催促）
      if((fM%16)<10) emo(ICO_EXCL);
    } else if (isEstranged()) {
      // 疎遠期：無表情（何も出さない）
    } else if (pet.mood <= 1) {
      // 退屈：…をゆっくり点滅
      if((fM%40)<28) emo(ICO_DOTS);
    }

    fM++;
  }
  setInterval(tickMain, 100);

  function btnAnim(el,ty=1,sc=0.95){ el.style.transform=`translateY(${ty}px) scale(${sc})`; el.style.filter='brightness(0.7)'; setTimeout(()=>{el.style.transform='';el.style.filter='';},120); }
  function dpadAnim(el){ el.style.transform='translateY(2px) scale(0.88)'; el.style.filter='brightness(2.5)'; setTimeout(()=>{el.style.transform='';el.style.filter='';},120); }

  onPress(document.getElementById('mmenu'),()=>{ playClick(); btnAnim(document.getElementById('mmenu'),1,0.93); menuSel=0; menuScroll=0; inSettings=false; inPlay=false; inFeed=false; inStatus=false; confirmReset=false; locPrime=false; inWeather=false; playSel=0; feedSel=0; showView('menu'); });
  onPress(document.getElementById('mb'),()=>{ playClick(); btnAnim(document.getElementById('mb')); nameSelActive=false; diarySelActive=false; });
  // お世話アクションはMENU内のアイコングリッドへ移動

  onPress(document.getElementById('ma'),()=>{

  document.querySelectorAll('#view-main .dpad-arrow').forEach(el=>{

    });
  });

  // ════════════════════════════════════════
  // MENU  (interval: 80ms、元モックと同一)
  // ════════════════════════════════════════
  const ctxN = initCanvas('lcd-n');
  // FEED/PLAY/CLEANはアクションバーに移管済み。DIARY は中間体になってから並ぶ
  const MENU_BASE = [['STATUS','status'], ['SETTINGS','settings'], ['STORY','story'], ['MANUAL','manual']];

    if(!diaryUnlocked()) return MENU_BASE;
    return [MENU_BASE[0], ['DIARY','diary'], ...MENU_BASE.slice(1)];   // STATUS の次に DIARY を挟む
  }
  const PLAY_ITEMS=['SPACEWALK','SHOOTING STAR','ABDUCTION'];
  const PLAY_FILES={'SPACEWALK':'spacewalk_game.html','SHOOTING STAR':'shootingstar_game.html','ABDUCTION':'abduction_game.html'};
  let playSel=0;
  let menuSel=0, fN=0;

  // settings state
  let soundOn = true;
  try{ if(localStorage.getItem('myvader_sound') === 'off') soundOn = false; }catch(e){}
  function setSound(on){ soundOn = on; try{ localStorage.setItem('myvader_sound', on?'on':'off'); }catch(e){} }
  // ボディカラー（面：明るめ / 側面ボタン：やや暗め）
  const BODY_COLORS  = ['#e8e3d8','#272727','#9ed0d8','#c8b8e0','#e8a89a','#98d0b0'];
  const BODY_SHELLS  = ['#ccc8bc','#383838','#7ec0c8','#b8a8d0','#d89888','#82bf9e'];
  const BODY_LABELS  = ['IVORY','ONYX','AQUA','LILAC','CORAL','MINT'];
  let bodyColorIdx = 1; // デフォルト: ONYX（黒）

  let inSettings = false;
  let inPlay = false;
  // ステータスの目盛り：10本並べ、2本で1段階（内部値0〜5 → 0〜10本）。
  //  5個のアイコンより刻みが細かく見え、残量メーターとして読みやすい
  const GAUGE_X = 18, GAUGE_W = 2, GAUGE_GAP = 1, GAUGE_H = 4;
  const GAUGE_MAX = 5;                 // 内部値の段階数（1段階＝2本）
  const STAT_VAL_X = 54 - 8;           // 文字で出す項目（けんこう等）の右端

  // 項目はキーで管理（表示ラベルは言語辞書、値は各キーで分岐）
  const SETTINGS_KEYS = ['language','weather','sound','bodycolor','reset'];
  let inWeather = false, wSel = 0, wScroll = 0;      // 天気の選択リスト（オフ／げんざいち／都市）
  // 選択肢をひとつのリストにまとめる。左右キーに頼らせず、Aを押せば全部の選択肢が見える
  function weatherOptions(){
    return [{k:'off'}, {k:'here'}].concat(CITIES.map((c,i)=>({k:'city', i})));
  }
  function weatherOptionLabel(o){
    if(o.k === 'off')  return T('off');
    if(o.k === 'here') return T('where');
    return (lang==='ja') ? CITIES[o.i][1] : CITIES[o.i][0];
  }
  function weatherSelIndex(){
    return weatherMode==='off' ? 0 : weatherMode==='here' ? 1 : 2 + cityIdx;
  }

  function applyBodyColor() {
    const bg = BODY_COLORS[bodyColorIdx];
    const isDark = bodyColorIdx === 1; // ONYX
    // 背景
    // 実機モードのレターボックス（画面比の差で生じる余白）もシェル色で塗り、黒帯を出さない
    document.documentElement.style.setProperty('--body-bg', bg);
    document.querySelector('.screen-area').style.background = bg;
    const app = document.querySelector('.app');
    app.style.background = bg;
    // ボタン影：暗いボディでは濃く、明るいボディでは薄く
    app.style.setProperty('--shadow-hard', isDark ? 'rgba(0,0,0,0.88)' : 'rgba(0,0,0,0.28)');
    app.style.setProperty('--shadow-soft', isDark ? 'rgba(0,0,0,0.72)' : 'rgba(0,0,0,0.16)');
    // ボタン下ラベルの色
    document.querySelectorAll('.btn-name').forEach(el=>{
      el.style.color = isDark ? 'rgba(255,255,255,0.25)' : 'rgba(0,0,0,0.22)';
    });
    // ホームバー
    document.querySelector('.home-bar').style.background =
      isDark ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.18)';
    // 設定を保存（ミニゲーム側でも同じ色を適用するため）
    try{ localStorage.setItem('myvader_bodycolor', String(bodyColorIdx)); }catch(e){}
  }
  applyBodyColor(); // 起動時に即適用

  function tickMenu(){
    ctxN.fillStyle=OFF; ctxN.fillRect(0,0,W*S,H*S);
    // 名前と日数
    ctxN.font='6px "Press Start 2P"';
    ctxN.textBaseline='top'; ctxN.fillStyle=ON;
    ctxN.font=nameFont(6, pet.name); ctxN.textAlign='left';  ctxN.fillText(pet.name||'????', 2*S, 2*S); ctxN.font='6px "Press Start 2P"';
    ctxN.textAlign='right'; ctxN.fillText(dayLabel(),  (W-2)*S, 2*S);
    for(let x=0;x<W;x++) dot(ctxN,x,9,DIM);

    if (inSettings) {
      // ── SETTINGS サブ画面 ──
      ctxN.font=uiFont(7);
      ctxN.fillStyle=ON; ctxN.textAlign='center'; ctxN.textBaseline='top';
      ctxN.fillText(T('settings'),(W*S)/2,11*S);
      for(let x=1;x<W-1;x++) dot(ctxN,x,16,DIM);   // 見出しの下の区切り線

      if(confirmReset){
        // ── ALL RESET 確認ダイアログ ──
        ctxN.font=uiFont(7);
        ctxN.fillStyle='#7a3a3a'; ctxN.textAlign='center'; ctxN.textBaseline='top';
        ctxN.fillText(T('reset'),(W*S)/2, 24*S);
        ctxN.fillStyle=ON;
        ctxN.fillText(T('sure'),(W*S)/2, 34*S);
        ctxN.font=uiFont(6);
        if((fN%14)<9) ctxN.fillText(T('yesno'),(W*S)/2, 48*S);
        fN++;
        return;   // リスト描画をスキップ（tickMenu内のこの分岐のみ）
      }

      if(locPrime){
        // ── LOCATION 用途説明（OSの許可ダイアログの前に、天気反映のみに使う旨を表示）──
        const note = LOC_NOTE[lang] || LOC_NOTE.en;
        const TOP = 19, BOT = 54;                              // 区切り線と案内のあいだに収める
        const LH = (note.length >= 7) ? 5 : 6;                // 行数が多い言語では行間を詰める
        const y0 = Math.max(TOP, Math.round((TOP + BOT - note.length*LH) / 2));
        ctxN.font=uiFont(6); ctxN.fillStyle=ON; ctxN.textAlign='center'; ctxN.textBaseline='top';
        note.forEach((line,i)=> ctxN.fillText(line, (W*S)/2, (y0 + i*LH)*S));
        ctxN.font=uiFont(5); ctxN.fillStyle=DIM;
        if((fN%14)<9) ctxN.fillText(T('locok'),(W*S)/2, 57*S);
        fN++;
        return;
      }
      if(inWeather){
        // ── 天気の取り方を選ぶ（オフ／げんざいち／都市をひとつのリストに）──
        const opts = weatherOptions();
        // 親（SETTINGS）が見出しを描いたあとなので、いったん消してから自分の見出しを描く
        ctxN.fillStyle=OFF; ctxN.fillRect(0, 9*S, W*S, 6*S);
        ctxN.font=uiFont(7); ctxN.fillStyle=ON; ctxN.textAlign='center'; ctxN.textBaseline='top';
        ctxN.fillText(T('weather'),(W*S)/2,11*S);
        const ROW_H = 8, VIEW = 5;                       // 一度に5件見せて、選択に合わせてスクロール
        if(wSel < wScroll) wScroll = wSel;
        if(wSel > wScroll + VIEW - 1) wScroll = wSel - VIEW + 1;
        wScroll = Math.max(0, Math.min(wScroll, opts.length - VIEW));
        for(let i=0;i<VIEW;i++){
          const idx = wScroll + i; if(idx >= opts.length) break;
          const y = 20 + i*ROW_H, isSel = (idx === wSel), cy = (y + ROW_H/2)*S;
          if(isSel){ for(let dx=1;dx<W-1;dx++) for(let dy=0;dy<ROW_H;dy++) dot(ctxN,dx,y+dy,DIM); }
          ctxN.font=uiFont(6); ctxN.fillStyle=ON; ctxN.textAlign='left'; ctxN.textBaseline='middle';
          if(isSel) ctxN.fillText('>',2*S,cy);
          ctxN.fillText(weatherOptionLabel(opts[idx]), 7*S, cy);
          // いま設定されているものに印を付ける
          if(idx === weatherSelIndex()){ ctxN.textAlign='right'; ctxN.fillText('*',(W-3)*S,cy); }
          ctxN.textBaseline='top';
        }
        ctxN.textAlign='center'; ctxN.font=uiFont(5); ctxN.fillStyle=DIM;
        if(wScroll > 0) ctxN.fillText('^',(W*S)/2, 17*S);
        if(wScroll + VIEW < opts.length) ctxN.fillText('v',(W*S)/2, 60*S);
        return;
      }
      // 項目を1画面に収める（y=19起点・間隔8。画面高65内）
      const ITEM_H = 8;
      SETTINGS_KEYS.forEach((key,i)=>{
        const y = 19 + i * ITEM_H;
        const isSel = i === settingsSel;
        const HL_H = 7, cy = (y + HL_H/2)*S;                 // 文字は網掛けの上下中央に置く
        if(isSel){ for(let dx=1;dx<W-1;dx++) for(let dy=0;dy<HL_H;dy++) dot(ctxN,dx,y+dy,DIM); }
        ctxN.font=uiFont(6); ctxN.fillStyle=ON; ctxN.textAlign='left'; ctxN.textBaseline='middle';
        if(isSel) ctxN.fillText('>',2*S,cy);
        ctxN.fillText(T(key), 7*S, cy);
        // 現在の設定値。右端はステータス画面と同じ位置に揃え、項目名とのあいだを薄い点線でつなぐ
        const val = key==='sound'     ? (soundOn?T('on'):T('off'))
                  : key==='language'  ? T('langval')
                  : key==='bodycolor' ? BODY_LABELS[bodyColorIdx]
                  : key==='weather'   ? (weatherMode==='off' ? T('off')
                                       : weatherMode==='city' ? cityName() : T('where'))
                  : key==='debug'     ? (debugMode?T('on'):T('off'))
                  : '';
        if(val){
          const lx = 7 + ctxN.measureText(T(key)).width / S;
          const rx = STAT_VAL_X - ctxN.measureText(val).width / S;
          // 選択中の行は網掛けの上なので、点を明るい色にして見えるようにする（明暗を反転）
          const lead = isSel ? OFF : DIM;
          for(let x = Math.floor(lx) + 2; x < rx - 1.5; x += STAT_LEADER) dot(ctxN, x, y + 3, lead);
          ctxN.textAlign='right';
          ctxN.fillStyle = (key==='debug' && !debugMode) ? '#7a7660' : ON;
          ctxN.fillText(val, STAT_VAL_X*S, cy);
        }
        ctxN.textBaseline='top';
      });

    } else if (inStatus) {
      // ── STATUS サブ画面 ──
      ctxN.font=uiFont(7);
      ctxN.fillStyle=ON; ctxN.textAlign='center'; ctxN.textBaseline='top';
      ctxN.fillText(T('status'),(W*S)/2,11*S);
      for(let x=1;x<W-1;x++) dot(ctxN,x,16,DIM);   // 見出しの下の区切り線

      // けんこうはバーではなく文字で出す。バーだと「半分」が何を指すのか伝わらないため
      const healthText =
          pet.dead            ? T('dead')     // おばけ
        : isWeak()            ? T('weak')     // 衰弱（空腹18時間超。あと12時間で死）
        : pet.health==='SICK' ? T('sick')     // 病気（放置36時間で死）
        : pet.hunger===0      ? T('normal')   // 空腹が続いている（このままだと衰弱）
        :                       T('good');
      // なかよし度Bは0〜100なので、5段階に落としてハートで見せる
      const bondPips = Math.max(0, Math.min(5, Math.round((pet.B||0) / 20)));
      const rows=[
        {label:T('hungry'), gauge:pet.hunger},
        {label:T('mood'),   gauge:pet.mood},
        {label:T('friend'), gauge:bondPips},
        {label:T('health'), text:healthText},
        {label:T('stage'),  text:stageLabel()},
        {label:T('ptype'),  text:typeLabel()},
      ];
      rows.forEach((r,i)=>{
        const y = 21 + i*7;                          // 6行入るよう行間を9→7に詰める
        ctxN.font=uiFont(6); ctxN.fillStyle=ON; ctxN.textAlign='left';
        ctxN.fillText(r.label, 2*S, y*S);
        if(r.gauge !== undefined){
          // 目盛り10本。点いているぶんがON、残りはDIM
          const lit = Math.max(0, Math.min(GAUGE_MAX, r.gauge)) * 2;
          for(let k=0;k<GAUGE_MAX*2;k++){
            const c = (k < lit) ? ON : DIM;
            for(let dx=0;dx<GAUGE_W;dx++) for(let dy=0;dy<GAUGE_H;dy++)
              dot(ctxN, GAUGE_X + k*(GAUGE_W+GAUGE_GAP) + dx, y + dy, c);
          }
        } else {
          ctxN.textAlign='right'; ctxN.fillText(r.text, STAT_VAL_X*S, y*S);
          // 項目名と状態のあいだを薄い点線でつなぐ。「・」の文字だと言語でグリフが変わるのでドットで描く
          const lx = 2 + ctxN.measureText(r.label).width / S;
          const vx = STAT_VAL_X - ctxN.measureText(r.text).width / S;
          for(let x = Math.floor(lx) + 2; x < vx - 1.5; x += STAT_LEADER) dot(ctxN, x, y + 1, DIM);
        }
      });

    } else if (inFeed) {
      // ── FEED サブ画面（ごはん／おやつの選択）──
      ctxN.font=uiFont(7);
      ctxN.fillStyle=ON; ctxN.textAlign='center'; ctxN.textBaseline='top';
      ctxN.fillText(T('feed'),(W*S)/2,11*S);
      for(let x=1;x<W-1;x++) dot(ctxN,x,16,DIM);   // 見出しの下の区切り線

      const ROW_H = 16, FOOD_ICON_CX = 10;   // アイコンを揃える中心x
      FEED_ITEMS.forEach((key,i)=>{
        const y = 22 + i*ROW_H;
        const isSel = i === feedSel;
        const HL_H = 14, cy = (y + HL_H/2)*S;                // 文字もドット絵も網掛けの上下中央に置く
        if(isSel){ for(let dx=1;dx<W-1;dx++) for(let dy=0;dy<HL_H;dy++) dot(ctxN,dx,y+dy,DIM); }
        // 実物のドット絵を並べて、どちらを選んでいるか一目で分かるようにする。
        // ごはん11幅・おやつ9幅と幅が違うので、左端ではなく中心を揃えて置く
        const g = foodSet(key)[3];
        const gx = FOOD_ICON_CX - (g[0].length >> 1);
        stamp2(ctxN, g, gx, y + Math.round((HL_H - g.length)/2), ON, isSel ? OFF : DIM);  // 選択中は反転地なのでDIM部分をOFFで抜く
        ctxN.font=uiFont(7); ctxN.fillStyle=ON; ctxN.textAlign='left'; ctxN.textBaseline='middle';
        if(isSel) ctxN.fillText('>', 1*S, cy);
        ctxN.fillText(T(key), 20*S, cy);
        ctxN.textBaseline='top';
      });

    } else if (inPlay) {
      // ── PLAY サブ画面（ミニゲーム選択）──
      ctxN.font=uiFont(7);
      ctxN.fillStyle=ON; ctxN.textAlign='center'; ctxN.textBaseline='top';
      ctxN.fillText(T('play'),(W*S)/2,11*S);
      for(let x=1;x<W-1;x++) dot(ctxN,x,16,DIM);   // 見出しの下の区切り線

      const ITEM_H = 12;
      PLAY_ITEMS.forEach((label,i)=>{
        const y = 22 + i * ITEM_H;
        const isSel = i === playSel;
        const HL_H = 10, cy = (y + HL_H/2)*S;                // 文字は網掛けの上下中央に置く
        if(isSel){ for(let dx=1;dx<W-1;dx++) for(let dy=0;dy<HL_H;dy++) dot(ctxN,dx,y+dy,DIM); }
        // 長い項目名はサイズ7、それ以外8（ゲーム名は共通で英語表記）
        const fsz = (label.length>9) ? 7 : 8;
        ctxN.font=fsz+'px "Press Start 2P"'; ctxN.fillStyle=ON; ctxN.textAlign='left'; ctxN.textBaseline='middle';
        if(isSel) ctxN.fillText('>',2*S,cy);
        ctxN.fillText(label, 8*S, cy);
        ctxN.textBaseline='top';
      });

    } else {
      // ── メインメニュー：お世話アイコングリッド(2段×3列) ＋ サブ項目 ──
      // menuSel: 0..5=アイコン, 6..8=STATUS/STORY/SETTINGS
      const HS = S/2;
      const GY0 = 12, CELL_W = 18, CELL_H = 11;
      for(let i=0;i<6;i++){
        const r = Math.floor(i/3), c = i%3;
        const cx0 = c*CELL_W, cy0 = GY0 + r*CELL_H;
        const isSel = (menuSel === i);
        if(isSel){
          // 選択中：薄色(DIM)の四角枠で囲う
          for(let dx=0;dx<CELL_W;dx++){ dot(ctxN, cx0+dx, cy0, DIM); dot(ctxN, cx0+dx, cy0+CELL_H-1, DIM); }
          for(let dy=0;dy<CELL_H;dy++){ dot(ctxN, cx0, cy0+dy, DIM); dot(ctxN, cx0+CELL_W-1, cy0+dy, DIM); }
        }
        const grid = CARE_ICONS[CARE_ORDER[i]];
        const gh = grid.length, gw = grid[0].length;   // アイコンごとに大きさが違うので枠の中央に置く
        const ox = cx0*S + Math.round((CELL_W*S - gw*HS)/2);
        const oy = cy0*S + Math.round((CELL_H*S - gh*HS)/2);
        const off = careDisabled(CARE_ORDER[i]);       // 使えないものは薄く
        for(let y=0;y<gh;y++) for(let x=0;x<gw;x++){
          const v = grid[y][x]; if(!v) continue;
          ctxN.fillStyle = off ? DIM : (v===2?ON:DIM);
          ctxN.fillRect(ox+x*HS, oy+y*HS, HS, HS);
        }
      }
      // 選択中アクション名ラベル
      ctxN.font=uiFont(6);
      ctxN.fillStyle=ON; ctxN.textAlign='center'; ctxN.textBaseline='top';
      if(menuSel < 6){
        ctxN.fillStyle = careDisabled(CARE_ORDER[menuSel]) ? DIM : ON;
        ctxN.fillText(T(CARE_ORDER[menuSel].toLowerCase()), (W*S)/2, 36*S);
        ctxN.fillStyle = ON;
      }
      for(let x=1;x<W-1;x++) dot(ctxN,x,40,DIM);

      // サブ項目（STATUS / DIARY / SETTINGS / STORY / MANUAL）。
      //  DIARYの有無で4〜5項目になるので、いちばん下の行が画面(y=64)に収まるよう行間を決める
      const list = menuList();
      const HL_H = (list.length >= 5) ? 5 : (list.length >= 4 ? 6 : 7);
      const Y0   = (list.length >= 5) ? 40 : (list.length >= 4 ? 41 : 43);
      list.forEach(([item,key],i)=>{
        const y = Y0 + i*HL_H;
        const isSel = (menuSel === 6+i);
        const cy = (y + HL_H/2)*S;                           // 文字は網掛けの上下中央に置く
        if(isSel){ for(let dx=1;dx<W-1;dx++) for(let dy=0;dy<HL_H;dy++) dot(ctxN,dx,y+dy,DIM); }
        ctxN.font=uiFont(7); ctxN.fillStyle=ON; ctxN.textAlign='left'; ctxN.textBaseline='middle';
        if(isSel) ctxN.fillText('>',2*S,cy);
        ctxN.fillText(T(key), 8*S, cy);
        ctxN.textBaseline='top';
        // 未読があるDIARYには封筒を添える
        // 未読があるDIARYには「NEW」を点滅させる
        if(item==='DIARY' && diaryUnread > 0 && fN%16 < 10){
          ctxN.textAlign='right'; ctxN.textBaseline='middle';
          ctxN.font=uiFont(6); ctxN.fillStyle=ON;
          ctxN.fillText('NEW', (W-3)*S, cy);
          ctxN.textAlign='left'; ctxN.textBaseline='top';
        }
      });
    }

    fN++;
  }
  setInterval(tickMenu, 80);

  document.querySelectorAll('#view-menu .dpad-arrow').forEach(el=>{
    onPress(el,()=>{
      playClick(900); dpadAnim(el);
      if(inSettings){
        if(confirmReset || locPrime) return;   // ダイアログ/説明中は移動不可（A/Bのみ）
        if(inWeather){                         // 天気リストの上下移動
          if(el.classList.contains('up'))   wSel = Math.max(0, wSel-1);
          if(el.classList.contains('down')) wSel = Math.min(weatherOptions().length-1, wSel+1);
          return;
        }
        if(el.classList.contains('up'))   settingsSel=Math.max(0, settingsSel-1);
        if(el.classList.contains('down')) settingsSel=Math.min(SETTINGS_KEYS.length-1, settingsSel+1);
        // 左右で値変更
        if(locPrime){ /* 用途説明中は左右無効 */ }
        else if(el.classList.contains('left')||el.classList.contains('right')){
          const key = SETTINGS_KEYS[settingsSel], right = el.classList.contains('right');
          if(key==='sound')     setSound(!soundOn);
          if(key==='language')  toggleLang();
          if(key==='bodycolor'){ bodyColorIdx=(right?bodyColorIdx+1:bodyColorIdx-1+BODY_COLORS.length)%BODY_COLORS.length; applyBodyColor(); }
          // 天気は選択肢が多いので左右では変えない。Aでリストを開いて選ぶ
        }
      } else if(inStatus){
        // STATUSに選択項目なし
      } else if(inFeed){
        if(el.classList.contains('up'))   feedSel=Math.max(0, feedSel-1);
        if(el.classList.contains('down')) feedSel=Math.min(FEED_ITEMS.length-1, feedSel+1);
      } else if(inPlay){
        if(el.classList.contains('up'))   playSel=Math.max(0, playSel-1);
        if(el.classList.contains('down')) playSel=Math.min(PLAY_ITEMS.length-1, playSel+1);
      } else {
        // アイコングリッド(0..5) ⇔ サブ項目(6..8) のナビゲーション
        const dir = el.classList.contains('up')?'up' : el.classList.contains('down')?'down'
                  : el.classList.contains('left')?'left' : 'right';
        const last = 6 + menuList().length - 1;    // サブ項目の最後（DIARYの有無で変わる）
        if(menuSel < 6){
          const r = Math.floor(menuSel/3);
          // 左右は6アイコンを一列としてループ（くすり→ほめる、ゲーム→ごはん）
          if(dir==='left')  menuSel = (menuSel+5)%6;
          if(dir==='right') menuSel = (menuSel+1)%6;
          // 上下もループ：上段から上で最後のサブ項目へ、下段から下でサブ項目へ
          if(dir==='up')    menuSel = (r===1) ? menuSel-3 : last;
          if(dir==='down')  menuSel = (r===0) ? menuSel+3 : 6;
        } else {
          if(dir==='up')   menuSel = (menuSel===6) ? 4 : menuSel-1;      // 先頭から上でグリッド下段中央へ
          if(dir==='down') menuSel = (menuSel===last) ? 0 : menuSel+1;   // 末尾から下で先頭アイコンへループ
        }
      }
    });
  });

  // A: 決定
  onPress(document.getElementById('na'),()=>{
    playClick(900); btnAnim(document.getElementById('na'));
    if(inSettings){
      if(locPrime){ locPrime=false; setWeatherMode('here'); return; }   // 用途説明のあと、A で許可要求
      if(inWeather){
        const o = weatherOptions()[wSel];
        inWeather = false;
        if(o.k === 'off')       setWeatherMode('off');
        else if(o.k === 'here') locPrime = true;                         // 説明を読んでからAで許可
        else { cityIdx = o.i; setWeatherMode('city'); }                  // 都市は位置情報を使わない
        return;
      }
      const key = SETTINGS_KEYS[settingsSel];
      if(key==='sound') setSound(!soundOn);
      if(key==='language') toggleLang();
      if(key==='bodycolor'){ bodyColorIdx=(bodyColorIdx+1)%BODY_COLORS.length; applyBodyColor(); }
      if(key==='weather'){ inWeather=true; wSel=weatherSelIndex(); }     // 選択肢をリストで見せる
      if(key==='debug'){
        debugMode=!debugMode;
        if(debugMode){
          debugTimer=setInterval(cycleDebug, DEBUG_INTERVAL);
        } else {
          clearInterval(debugTimer);
          timeOfDay=getTimeOfDay();
        }
      }
      if(key==='reset'){
        if(!confirmReset){
          confirmReset = true;             // まず確認ダイアログを表示
        } else {
          // 確認中のA = 実行
          confirmReset = false; locPrime = false;
          menuSel=0; menuScroll=0; settingsSel=0; inSettings=false; inPlay=false; inFeed=false; inStatus=false; bodyColorIdx=1; setSound(true);  // カラーはデフォルトのONYX（黒）
          weatherFetched=false; weather='clear'; debugMode=false;
          setWeatherMode('off'); cityIdx = 0; inWeather = false;
          clearInterval(debugTimer);
          timeOfDay=getTimeOfDay();
          try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
          clearDiary();                    // 日記が消えるのはこのリセットの時だけ
          pet = defaultPet(); nameBuf=''; nameCur=0; onSlots=false;
          ufoEnding = false; ufoT = 0; departEnding = false; departT = 0; evoT = 0;
          applyBodyColor(); showView('opening'); fO=0; openingReady=false;
        }
      }
    } else if(inStatus){
      // STATUSでは決定操作なし
    } else if(inFeed){
      // ごはん／おやつを決定 → 育成画面に戻ってリアクション表示
      doCare(FEED_ITEMS[feedSel]==='snack' ? 'SNACK' : 'FEED');
      inFeed=false; showView('main');
    } else if(inPlay){
      // ミニゲームは同一ページ内のフルスクリーンiframeで開く
      // （ホーム画面アプリでページ遷移するとSafariのUI付き表示に抜け出してしまうため）
      const game = PLAY_ITEMS[playSel];
      const file = PLAY_FILES[game];
      if(file) openMiniGame(file);
    } else {
      if(menuSel < 6){
        // お世話アクション実行 → 育成画面に戻ってリアクション表示
        const act = CARE_ORDER[menuSel];
        if(act==='GAME'){
          // 入口制御：おばけ・睡眠・病気・空腹・疎遠期・わがままは遊べない
          // （たまご段階でも遊べる：ミニゲームのデフォルメ6種にeggが含まれる設計）
          if(pet.dead || pet.gone || departEnding || ufoEnding){ /* 操作不可 */ }
          else if(!pet.name){ showView('main'); }   // 命名前は遊べない（点滅する名前欄へ誘導）
          else if(effectiveAsleep()){ showView('main'); }
          else if(pet.health==='SICK'){ setReaction('sick'); showView('main'); }
          else if(pet.hunger <= 1){ setReaction('hungry'); showView('main'); }
          else if(pet.tantrumAt || rollTantrum('game')){ setReaction('refuse'); showView('main'); savePet(); }
          else { inPlay=true; playSel=0; }
        }
        else if(pet.dead || pet.gone){ /* おばけ・帰還後：世話不可 */ }
        else if(act==='FEED'){
          // ごはん／おやつの選択へ。世話が効かない状態では開かない（空の画面を見せない）。
          // 皿が画面に残っているあいだは、置き場所がひとつしかないので新しく出せない
          //  （出すと皿の絵はそのままで中身だけ食べる、という不自然なことになる）
          if(!pet.name || ufoEnding || departEnding || plateOnScreen()) showView('main');
          else { inFeed=true; feedSel=0; }
        }
        else { doCare(act); showView('main'); }
      } else {
        const sel = (menuList()[menuSel-6] || [])[0];
        if(sel==='SETTINGS'){ inSettings=true; settingsSel=0; }
        else if(sel==='DIARY'){ openDiary(); }        // 日記は死んだあと・帰還したあとも読める
        else if(sel==='MANUAL'){ openManual(); }      // 説明書もいつでも読める
        else if(pet.dead || pet.gone){ /* おばけ・帰還後：上記以外は操作不可 */ }
        else if(sel==='STATUS'){ inStatus=true; }
        else if(sel==='STORY'){ storyScrollY=H*S; showView('story'); }
      }
    }
  });
  // B: 戻る
  onPress(document.getElementById('nb'),()=>{
    playClick(); btnAnim(document.getElementById('nb'));
    if(inSettings){
      if(inWeather){ inWeather=false; }         // 天気の選択をキャンセル
      else if(locPrime){ locPrime=false; }      // 用途説明をキャンセル（許可を求めない）
      else if(confirmReset){ confirmReset=false; }   // 確認ダイアログをキャンセル
      else inSettings=false;
    }
    else if(inStatus){ inStatus=false; }
    else if(inFeed){ inFeed=false; }  // MENUのFEEDアイコンから入るためグリッドへ戻る
    else if(inPlay){ inPlay=false; }  // MENUのGAMEアイコンから入るためグリッドへ戻る
    else showView('main');
  });
  onPress(document.getElementById('nmenu'),()=>{
    playClick(); btnAnim(document.getElementById('nmenu'),1,0.93);
    inSettings=false; inPlay=false; inFeed=false; inStatus=false; confirmReset=false; locPrime=false; inWeather=false; showView('main');
  });

  // ════════════════════════════════════════
  // STORY
  // ════════════════════════════════════════
  const ctxS = initCanvas('lcd-s');
  // {t:本文, st:'title'|''}。タイトルは言語に関わらず英語表記
  const T_ = (t,st)=>({t, st:st||''});
  const STORY_EN = [
    T_(''),T_(''),T_('My Little Invader','title'),T_(''),T_(''),
    T_('One day,'),T_('a tiny creature'),T_('fell from the sky.'),T_(''),
    T_('Nothing like the armies'),T_('that once invaded Earth.'),T_(''),
    T_('Frail,'),T_('without a hint of malice'),T_('it gazes at me'),T_('with innocent eyes.'),T_(''),
    T_('That gaze'),T_('captured my heart.'),T_(''),
    T_('Yes, this little one'),T_('is the invader'),T_('of my heart.'),T_(''),T_(''),T_(''),
  ];
  // 日本語版（LCD幅に収まるよう短く改行）
  const STORY_JA = [
    T_(''),T_(''),T_('My Little Invader','title'),T_(''),T_(''),
    T_('ある日、空から'),T_('小さな生き物が'),T_('落ちてきた。'),T_(''),
    T_('それは、かつて'),T_('侵略のため大軍を成して'),T_('地球に攻め込んできた'),T_('"やつら"とは、'),T_('似ても似つかない。'),T_(''),
    T_('か弱く、敵意の'),T_('かけらもないそれは、'),T_('つぶらな瞳で'),T_('私を見つめる。'),T_(''),
    T_('その眼差しに、'),T_('私の心は奪われた。'),T_(''),
    T_('そう、この子は、'),T_('私の心の"インベーダー"'),T_(''),T_(''),T_(''),
  ];
  function storyData(){ return lang==='ja' ? STORY_JA : STORY_EN; }
  const S_LINE_H = 14;

  function tickStory(){
    if(scene!=='story') return;
    const lines = storyData();
    ctxS.fillStyle=OFF; ctxS.fillRect(0,0,W*S,H*S);
    ctxS.save();
    ctxS.beginPath(); ctxS.rect(0,0,W*S,H*S); ctxS.clip();
    ctxS.textAlign='center'; ctxS.textBaseline='top';
    lines.forEach((line,i)=>{
      const y = storyScrollY + i * S_LINE_H;
      if(y < -S_LINE_H || y > H*S) return;
      // タイトルは英語ピクセル字体、本文は英語=ピクセル/日本語=大きめゴシック
      ctxS.font = (line.st==='title') ? '9px "Press Start 2P"'
                : (lang==='ja' ? '10px '+JP_FONT : '6px "Press Start 2P"');
      ctxS.fillStyle = ON;
      ctxS.fillText(line.t,(W*S)/2,y);
    });
    ctxS.restore();
    if(!storyDone){ storyScrollY-=0.8; if(storyScrollY < -(lines.length*S_LINE_H)){ storyDone=true; setTimeout(()=>{ showView('menu'); }, 500); } }
  }
  setInterval(tickStory, 80);


  // ── 日記の画面（1ページ＝1日。十字上下でページを繰る）──
  const ctxT = initCanvas('lcd-t');
  const DIARY_TITLE = { ja:'のにっき', en:"'S DIARY" };     // 名前のうしろに付ける
  const DIARY_EMPTY = { ja:['まだ なにも','かいていない'], en:['NOTHING WRITTEN','YET'] };
  const MON_EN = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  // 日記の日付。cd（対象の暦日）を優先し、古い日記は書いた時刻から補う
  function diaryDate(e){
    if(!e) return '';
    let dt = null;
    if(e.cd){ const p = String(e.cd).split('-'); if(p.length===3) dt = new Date(+p[0], +p[1]-1, +p[2]); }
    if(!dt && e.ts) dt = new Date(e.ts);
    if(!dt || isNaN(dt.getTime())) return '';
    const m = dt.getMonth()+1, d = dt.getDate();
    return (lang==='ja') ? (m + 'がつ' + d + 'にち') : (MON_EN[m-1] + ' ' + d);
  }
  let diaryPage = 0;
  let diaryFrom = 'menu';        // どこから開いたか（閉じたらそこへ戻る）
  function openDiary(from){
    diaryFrom = from || 'menu';
    diaryPage = Math.max(0, diaryLog.length - 1);   // いちばん新しい日を開く
    if(diaryUnread > 0){ diaryUnread = 0; saveDiary(); }   // 開いたら既読
    showView('diary');
  }
  function tickDiary(){
    if(scene !== 'diary') return;
    ctxT.fillStyle=OFF; ctxT.fillRect(0,0,W*S,H*S);
    ctxT.textAlign='center'; ctxT.textBaseline='top';
    const e = diaryLog[diaryPage];
    // 見出し1段目：「<なまえ>のにっき」。名前は英数字ならピクセル字体になるので、
    //  2つの書体の幅を測ってから並べて中央に置く
    const who = (e && e.n) || pet.name || '????';
    const suf = DIARY_TITLE[lang] || DIARY_TITLE.en;
    ctxT.textAlign = 'left'; ctxT.fillStyle = ON;
    ctxT.font = nameFont(7, who); const wName = ctxT.measureText(who).width;
    ctxT.font = uiFont(7);       const wSuf  = ctxT.measureText(suf).width;
    const hx = Math.round((W*S - (wName + wSuf)) / 2);
    ctxT.font = nameFont(7, who); ctxT.fillText(who, hx, 3*S);
    ctxT.font = uiFont(7);        ctxT.fillText(suf, hx + wName, 3*S);
    ctxT.textAlign = 'center';
    // 見出し2段目：その日記が書かれた対象の日
    const dstr = diaryDate(e);
    if(dstr){ ctxT.font = uiFont(6); ctxT.fillStyle = ON; ctxT.fillText(dstr, (W*S)/2, 10*S); }
    // ページ位置（前後にまだ日があることを示す）。見出しの左右に置く
    if(e){
      ctxT.font = uiFont(6); ctxT.fillStyle = DIM;
      if(diaryPage > 0)                 ctxT.fillText('<', 4*S, 7*S);
      if(diaryPage < diaryLog.length-1) ctxT.fillText('>', (W-4)*S, 7*S);
    }
    for(let x=6;x<W-6;x++) dot(ctxT, x, 17, DIM);
    // 本文（材料から組み立てた行）。ページ数(y57)に掛からないよう上下中央に置く
    const body = e ? diaryBody(e) : (lang==='ja' ? DIARY_EMPTY.ja : DIARY_EMPTY.en);
    const TOP = 20, BOT = 50;
    const LH = (body.length <= 5) ? 6 : 5;         // 行数が多い時だけ詰める
    const y0 = Math.max(TOP, Math.round((TOP + BOT)/2 - (body.length - 1)*LH/2));
    ctxT.font = (lang==='ja') ? ('10px '+JP_FONT) : '6px "Press Start 2P"';
    ctxT.fillStyle = ON;
    body.forEach((line,i)=>{
      if(!line) return;
      ctxT.fillText(line, (W*S)/2, (y0 + i*LH)*S);
    });
    // ページ数（本文の下）。書いた本人の名前は見出しに出るので、ここでは繰り返さない
    if(e){
      ctxT.font = uiFont(6); ctxT.fillStyle = DIM;
      ctxT.fillText((diaryPage + 1) + ' / ' + diaryLog.length, (W*S)/2, 57*S);
    }
  }
  setInterval(tickDiary, 100);

  function closeDiary(){ diarySelActive=false; showView(diaryFrom); }
  onPress(document.getElementById('ta'),()=>{ playClick(); btnAnim(document.getElementById('ta')); closeDiary(); });
  onPress(document.getElementById('tb'),()=>{ playClick(); btnAnim(document.getElementById('tb')); closeDiary(); });
  onPress(document.getElementById('tmenu'),()=>{ playClick(); btnAnim(document.getElementById('tmenu'),1,0.93); closeDiary(); });
  document.querySelectorAll('#view-diary .dpad-arrow').forEach(el=>{
    onPress(el,()=>{
      playClick(900); dpadAnim(el);
      if(el.classList.contains('up')||el.classList.contains('left'))    diaryPage = Math.max(0, diaryPage-1);
      if(el.classList.contains('down')||el.classList.contains('right')) diaryPage = Math.min(diaryLog.length-1, diaryPage+1);
    });
  });

  onPress(document.getElementById('sa'),()=>{ playClick(); btnAnim(document.getElementById('sa')); showView('menu'); });
  onPress(document.getElementById('sb'),()=>{ playClick(); btnAnim(document.getElementById('sb')); showView('menu'); });
  onPress(document.getElementById('smenu'),()=>{ playClick(); btnAnim(document.getElementById('smenu'),1,0.93); showView('menu'); });

})();
</script>

<script>
// iPhone実機表示：ゲーム機シェルを画面サイズに合わせて拡大（デザイン比率は維持）

  // 実機（ホーム画面アプリ / iOS Safari）ではモックのiPhone外装を消す
  (function(){
    var standalone = window.navigator.standalone === true ||
                     (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    var touchPhone = /iPhone|iPod|Android/i.test(navigator.userAgent);
    if(standalone || touchPhone) document.body.classList.add("device");
  })();
(function(){
  // セーフエリアの各辺を実測（env()はCSSでしか読めないので、探り用の要素を挿して測る）
  function safeInset(side){
    var p=document.createElement("div");
    p.style.cssText="position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-"+side+");";
    document.body.appendChild(p);
    var v=p.getBoundingClientRect().height; p.remove();
    return v;
  }
  function fit(){
    var el=document.querySelector(".iphone"); if(!el) return;
    el.style.transform="none";
    // 計測は必ず通常フローの状態で行う（横向き時のfixed指定が残っていると幅が変わるため）
    el.style.position=""; el.style.left=""; el.style.top="";
    var r=el.getBoundingClientRect();
    var w=r.width||280, h=r.height||600;
    var vw=window.innerWidth, vh=window.innerHeight;
    var device=document.body.classList.contains("device");
    // 端末を横に倒しても縦画面のまま見せる（回転させない）。
    // iOS Safariはマニフェストのorientation指定もscreen.orientation.lock()も非対応のため、
    // 横向きを検知して中身を90度カウンター回転させることで縦表示を維持する。
    var landscape = device && vw > vh;
    // 回転後の外接矩形は (h×s) × (w×s) になるので、幅と高さを入れ替えて収める
    var s = landscape ? Math.min(vw*0.995/h, vh*0.995/w)
                      : Math.min(vw*0.995/w, vh*0.995/h);
    el.style.transformOrigin="center center";
    // どちら向きに倒したかで必要な回転方向が変わるため、OSが報告する角度の逆ぶんだけ戻す
    var angle=0;
    if(window.screen && screen.orientation && typeof screen.orientation.angle==="number") angle=screen.orientation.angle;
    else if(typeof window.orientation==="number") angle=window.orientation;
    if(landscape && angle%180===0) angle=90;   // 角度が取得できない環境では時計回り90°とみなす
    // 横向き時は通常フローの高さ(545px)が画面高を超えて中央がずれるため、fixedで確実にセンタリングする
    if(landscape){ el.style.position="fixed"; el.style.left="50%"; el.style.top="50%"; }
    el.style.transform=(landscape ? "translate(-50%,-50%) rotate("+(-angle)+"deg) " : "")+"scale("+s+")";
    // 実機ではステータスバー分だけ中身（LCD・十字ボタン・A/B/MENU）を下げ、
    // 上部にLEDの余白を確保する。ステータスバーへの被りも避けられる。
    var app=document.querySelector(".app");
    if(app){
      var pad=0;
      if(device){
        // 回転時は画面の左右どちらかにノッチが来る（どちら向きに倒したかで変わる）ので大きい方を使う
        var sat = landscape ? Math.max(safeInset("left"), safeInset("right")) : safeInset("top");
        pad=(sat/s)+6;   // セーフエリア分＋少し余白
      }
      app.style.paddingTop=pad+"px";
    }
    placeLed();
  }
  // 電源LEDを、現在表示中のLCDパネルの上端すぐ上（機種のセーフエリアに依存しない位置）へ置く。
  // 以前はステータスバー分を一律で足しており、Dynamic Island機種などLCDに被ることがあった。
  // 座標はレイアウト値(offsetTop)で求める：getBoundingClientRectは拡大・回転の影響を受けるため。
  function placeLed(){
    var led=document.querySelector(".power-led"); if(!led) return;
    var parent=led.offsetParent || document.querySelector(".app");
    var active=document.querySelector(".view.active");
    var lcd=active && active.querySelector(".lcd-wrap");
    if(!parent || !lcd) return;
    var lcdTop=0, node=lcd;
    while(node && node!==parent){ lcdTop+=node.offsetTop; node=node.offsetParent; }
    var ledH=led.offsetHeight||5;
    // .lcd-wrap の外周ベゼルは box-shadow(0 0 0 7px) で描かれ、レイアウト上の高さに含まれない。
    // そのぶん上に張り出しているので、ベゼル分を差し引いた位置に置かないと実機で被る。
    var BEZEL=7, GAP=8;   // GAP=LEDとLCDベゼルの間隔
    var top=lcdTop - ledH - BEZEL - GAP;
    if(top<2) top=2;
    led.style.top=top+"px";
  }
  window.__placeLed=placeLed;      // ビュー切替時に本体スクリプトから呼ぶ
  window.addEventListener("resize",fit);
  window.addEventListener("orientationchange",function(){setTimeout(fit,300);});
  window.addEventListener("load",fit);
  document.addEventListener("DOMContentLoaded",fit);
})();
</script>
